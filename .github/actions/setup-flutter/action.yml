name: Setup Flutter
description: Installs the Flutter version pinned in client/.fvmrc, with the SDK and pub caches restored.

outputs:
  version:
    description: The installed Flutter version.
    value: ${{ steps.flutter-action.outputs.VERSION }}

runs:
  using: composite
  steps:
    - name: Get Flutter
      id: flutter-action
      uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
      with:
        cache: true
        flutter-version-file: client/.fvmrc
        pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:"
        cache-key: "flutter:os:-:channel:-:version:-:arch:"
