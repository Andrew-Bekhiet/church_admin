version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: weekly
    commit-message:
      prefix: build
      include: scope

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 4
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: "shorebirdtech/*"

  - package-ecosystem: npm
    directory: /server/firebase/functions
    schedule:
      interval: weekly
    cooldown:
      default-days: 4
      semver-major-days: 15
    commit-message:
      prefix: build
      include: scope
    groups:
      npm:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    # Majors held back until the toolchain supports them; check-toolchain-ceilings.yml opens an issue when one can be lifted.
    ignore:
      # Cloud Functions' newest GA runtime is Node 24.
      - dependency-name: "@types/node"
        update-types:
          - version-update:semver-major
      # typescript-eslint 8 accepts typescript <6.1.
      - dependency-name: typescript
        versions:
          - ">= 6.1.0"
      # eslint-plugin-import supports eslint up to 9.
      - dependency-name: eslint
        update-types:
          - version-update:semver-major
      - dependency-name: "@eslint/js"
        update-types:
          - version-update:semver-major

  - package-ecosystem: pub
    directories:
      - /client
      - /church_admin_generator
      - /server/church_admin_migrator
    schedule:
      interval: weekly
    cooldown:
      default-days: 4
      semver-major-days: 15
    commit-message:
      prefix: build
      include: scope
    groups:
      pub:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      pub-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: gradle
    directory: /client/android
    schedule:
      interval: weekly
    cooldown:
      default-days: 4
      semver-major-days: 15
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directories:
      - /server/hasura
      - /server/postgres
      - /server/firebase
    patterns:
      - "*"
    multi-ecosystem-group: infrastructure
    ignore:
      # A Postgres major (pg17 -> pg18) needs a dump/restore of production data, not a tag bump.
      - dependency-name: timescale/timescaledb-ha
        update-types:
          - version-update:semver-major
      # The emulator image tracks the Cloud Functions runtime, whose newest GA is Node 24.
      - dependency-name: node
        update-types:
          - version-update:semver-major

  - package-ecosystem: docker-compose
    directory: /server
    patterns:
      - "*"
    multi-ecosystem-group: infrastructure
