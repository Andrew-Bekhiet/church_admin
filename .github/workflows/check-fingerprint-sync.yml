name: Lint & Test fingerprint sync

on:
  pull_request:
    paths:
      - "server/fingerprint_sync/**"
      - ".github/workflows/fingerprint-sync.yml"

  push:
    branches: [master]
    paths:
      - "server/fingerprint_sync/**"
      - ".github/workflows/fingerprint-sync.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server/fingerprint_sync

jobs:
  check:
    name: Lint, build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/fingerprint_sync/.nvmrc
          cache: npm
          cache-dependency-path: server/fingerprint_sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check the Linux install script with ShellCheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh

      - name: Check the Windows install script parses in Windows PowerShell 5.1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path scripts/install.ps1), [ref]$null, [ref]$parseErrors) | Out-Null
          if ($parseErrors) { $parseErrors; exit 1 }

      - name: Check the Windows install script with PSScriptAnalyzer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) { Install-Module PSScriptAnalyzer -Scope CurrentUser -Force }
          $findings = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Settings PSGallery
          $findings | Format-Table -AutoSize
          if ($findings) { exit 1 }

      - name: Build the executable
        run: npm run build:executable

      - name: Check the executable starts and prints its usage
        shell: bash
        run: |
          binary=$(ls dist/fingerprint-sync-*)
          if "$binary" unknown-command; then exit 1; else status=$?; fi
          test "$status" -eq 2
