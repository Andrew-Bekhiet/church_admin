name: Test Coverage Report and Release

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  run-tests:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get specific changed files
        id: source-changed
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **.dart
            **/*.dart
            client/assets
            client/pubspec.yaml
            client/build.yaml
            client/analysis_options.yaml
            codecov.yaml

      - name: Check if testing is required
        id: run-tests
        env:
          run_tests: ${{ steps.source-changed.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci release]') || contains(github.event.head_commit.message, '[ci release apk]') || contains(github.event.head_commit.message, '[ci release ios]') || contains(github.event.head_commit.message, '[ci test]') }}
        run: |
          echo "run-tests=$run_tests" >> $GITHUB_OUTPUT

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        with:
          cache: true
          pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:"
          cache-key: "flutter:os:-:channel:-:version:-:arch:"
          channel: "stable"

      - name: Populate the Flutter tool's cache of binary artifacts
        if: ${{ steps.run-tests.outputs.run-tests == 'true'}}
        run: flutter precache

      # - name: Get Cached .dart_tool
      #   uses: actions/cache@v3
      #   if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
      #   id: dart_tool_cache
      #   with:
      #     path: client/.dart_tool
      #     key: dart-tool-v1-${{hashFiles('client/pubspec.yaml', 'client/build.yaml')}}
      #     restore-keys: |
      #       dart-tool-v1-

      - name: Override git ignored files for testing
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        run: |
          cp --force lib/firebase_options_ci.dart lib/firebase_options.dart
          cp --force lib/src/services/encryption/encryption_service_ci_impl.dart lib/src/services/encryption/encryption_service_impl.dart
          cp --force lib/src/services/secrets/secrets_service_ci_impl.dart lib/src/services/secrets/secrets_service_impl.dart
          cp pubspec_overrides_ci.yaml pubspec_overrides.yaml

      - name: Override git pubspec overrides
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          cat > pubspec_overrides.yaml << EOF
          dependency_overrides:
            church_admin_generator:
              git:
                url: https://${DEPS_TOKEN}@github.com/Andrew-Bekhiet/church_admin_generator.git
                ref: master
          EOF

      - name: Install dependencies
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        run: flutter pub get

      - name: Run new builder
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run Tests
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        run: flutter test --coverage --machine > test-results.json --dart-define CI=true

      - name: Upload test-results.json to artifacts
        uses: actions/upload-artifact@v3
        if: ${{ (success() || failure()) && steps.run-tests.outputs.run-tests == 'true'}}
        with:
          name: test-results
          path: client/test-results.json

  upload-coverage:
    permissions:
      contents: read
      actions: read
      checks: write

    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Check if test-results.json exists
        uses: xSAVIKx/artifact-exists-action@v0
        id: check-test-results
        with:
          name: test-results

      - if: ${{ steps.check-test-results.outputs.exists == 'false' }}
        run: echo "No test-results.json artifact found. Skipping job."

      - name: Checkout repository
        if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Download test-results.json from artifacts
        if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        uses: actions/download-artifact@v2
        with:
          name: test-results
          path: client/

      - name: Search for test-results.json
        if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        run: |
          find . -name test-results.json

      - name: Report test results to run checks
        if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        uses: dorny/test-reporter@v1
        with:
          name: "Unit and Widget Tests"
          path: client/test-results.json
          reporter: flutter-json

      - name: Upload coverage to codecov
        uses: codecov/codecov-action@v3
        if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        with:
          directory: client
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    permissions:
      contents: write

    needs: run-tests
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        # Excludes ubuntu when building ipa only and macos when building apk only
        exclude:
          - os: ${{ contains(github.event.head_commit.message, '[ci release ios]') && 'ubuntu-latest' }}
          - os: ${{ contains(github.event.head_commit.message, '[ci release apk]') && 'macos-latest' }}
    runs-on: ${{ matrix.os }}
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event_name != 'pull_request' && (contains(github.event.head_commit.message, '[ci release]') || contains(github.event.head_commit.message, '[ci release apk]') || contains(github.event.head_commit.message, '[ci release ios]')))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:"
          cache-key: "flutter:os:-:channel:-:version:-:arch:"
          channel: "stable"

      - name: Set Up Java
        uses: actions/setup-java@v4
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          cache: "gradle"
          distribution: "corretto"
          java-version: "17"

      - name: Populate the Flutter tool's cache of binary artifacts
        run: flutter precache

      # - name: Get Cached .dart_tool
      #   uses: actions/cache@v3
      #   id: dart_tool_cache
      #   with:
      #     path: client/.dart_tool
      #     key: dart-tool-v1-${{hashFiles('client/pubspec.yaml', 'client/build.yaml')}}
      #     restore-keys: |
      #       dart-tool-v1-

      - name: Override git pubspec overrides
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          cd client
          cat > pubspec_overrides.yaml << EOF
          dependency_overrides:
            church_admin_generator:
              git:
                url: https://${DEPS_TOKEN}@github.com/Andrew-Bekhiet/church_admin_generator.git
                ref: master
          EOF

      - name: Decode and save secrets to files
        working-directory: client
        env:
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          ENCRYPTION_SERVICE_DART: ${{ secrets.ENCRYPTION_SERVICE_DART }}
          SECRETS_SERVICE_DART: ${{ secrets.SECRETS_SERVICE_DART }}
        run: |
          echo $FIREBASE_OPTIONS_DART | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./lib/firebase_options.dart
          echo $ENCRYPTION_SERVICE_DART | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./lib/src/services/encryption/encryption_service_impl.dart
          echo $SECRETS_SERVICE_DART | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./lib/src/services/secrets/secrets_service_impl.dart

      - name: Decode and save android secrets
        working-directory: client
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_STRINGS: ${{ secrets.ANDROID_STRINGS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          echo $ANDROID_SIGNING_KEY | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/app/key.keystore
          echo $ANDROID_STRINGS | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/app/src/main/res/values/strings.xml
          echo $GOOGLE_SERVICES_JSON | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/app/google-services.json
          echo $ANDROID_KEYSTORE_PROPERTIES | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/releaseKey.properties

      - name: Decode and save ios secrets
        working-directory: client
        if: ${{ matrix.os == 'macos-latest' }}
        env:
          GOOGLE_SERVICES_PLIST: ${{ secrets.GOOGLE_SERVICES_PLIST }}
        run: |
          echo $GOOGLE_SERVICES_PLIST | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./ios/Runner/GoogleService-Info.plist

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Run new builder
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build apk
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: client
        run: flutter build apk

      - name: Build ios
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: client
        run: flutter build ios --release --no-codesign

      - name: Get version from pubspec.yaml
        working-directory: client
        id: version
        run: |
          version=$(grep 'version:' pubspec.yaml | awk '{print $2}' | awk -F "+" '{print $1}')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Compress ios
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: client
        run: |
          cd build
          tar -czf ios_build-v${{ steps.version.outputs.version }}.tar.gz ios
          tar -czf ios_dir-v${{ steps.version.outputs.version }}.tar.gz ../ios

      - name: Add version to APK filename
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: client
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-v${{ steps.version.outputs.version }}.apk

      - name: Authenticate with Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.APP_RELEASE_UPLOADER_KEY }}"

      - name: Upload APK to Google Cloud Storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          path: "client/build/app/outputs/flutter-apk/app-release-v${{ steps.version.outputs.version }}.apk"
          destination: "${{ secrets.APP_RELEASE_GCS_BUCKET }}"

      - name: Upload iOS build dir to Google Cloud Storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        if: ${{ matrix.os == 'macos-latest' }}
        with:
          path: "client/build/ios_build-v${{ steps.version.outputs.version }}.tar.gz"
          destination: "${{ secrets.APP_RELEASE_GCS_BUCKET }}"

      - name: Upload iOS dir to Google Cloud Storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        if: ${{ matrix.os == 'macos-latest' }}
        with:
          path: "client/build/ios_dir-v${{ steps.version.outputs.version }}.tar.gz"
          destination: "${{ secrets.APP_RELEASE_GCS_BUCKET }}"

      - name: Create release
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.version }}
          generateReleaseNotes: true
