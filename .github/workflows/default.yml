name: Test, Report Coverage and Release

on: [push, pull_request, workflow_dispatch]

jobs:
  run-tests:
    permissions:
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get specific changed files
        id: source-changed
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **.dart
            **/*.dart
            client/assets
            client/pubspec.yaml
            client/build.yaml
            client/analysis_options.yaml
            codecov.yaml

      - name: Check if testing is required
        id: run-tests
        env:
          run-tests: ${{ steps.source-changed.outputs.any_changed == 'true' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci release]') || contains(github.event.head_commit.message, '[ci test]') }}
        run: |
          echo "run-tests=$run-tests" >> $GITHUB_OUTPUT

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        with:
          cache: true
          cache-key: "flutter-:channel:-:version:"
          channel: "stable"

      - name: Get Cached dependencies
        uses: actions/cache@v3
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        id: flutter_cache
        with:
          path: ${{ env.PUB_CACHE }}
          key: flutter-dependencies-v1-${{hashFiles('client/pubspec.yaml', 'client/pubspec.lock')}}
          restore-keys: |
            flutter-dependencies-v1-

      - name: Populate the Flutter tool's cache of binary artifacts
        if: ${{ steps.run-tests.outputs.run-tests == 'true' && steps.flutter_cache.outputs.cache-hit != 'true' }}
        run: |
          flutter config --no-analytics
          flutter precache

      - name: Get Cached .dart_tool
        uses: actions/cache@v3
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        id: dart_tool_cache
        with:
          path: client/.dart_tool
          key: dart-tool-v1-${{hashFiles('client/pubspec.yaml', 'client/build.yaml')}}
          restore-keys: |
            dart-tool-v1-

      - name: Override git ignored files
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        run: |
          cp --force lib/firebase_options_ci.dart lib/firebase_options.dart
          cp --force lib/src/services/encryption/encryption_service_ci_impl.dart lib/src/services/encryption/encryption_service_impl.dart
          cp --force lib/src/services/secrets/secrets_service_ci_impl.dart lib/src/services/secrets/secrets_service_impl.dart
          cp pubspec_overrides_ci.yaml pubspec_overrides.yaml

      - name: Override git pubspec overrides
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          cat > pubspec_overrides.yaml << EOF
          dependency_overrides:
            church_admin_generator:
              git:
                url: https://${DEPS_TOKEN}@github.com/Andrew-Bekhiet/church_admin_generator.git
                ref: master
          EOF

      - name: Install dependencies
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        run: flutter pub get

      - name: Run new builder
        if: ${{ steps.run-tests.outputs.run-tests == 'true' && steps.dart_tool_cache.outputs.cache-hit != 'true' }}
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run cached builder
        if: ${{ steps.run-tests.outputs.run-tests == 'true' && steps.dart_tool_cache.outputs.cache-hit == 'true' }}
        working-directory: client
        run: dart run build_runner build

      - name: Run Tests
        if: ${{ steps.run-tests.outputs.run-tests == 'true' }}
        working-directory: client
        run: flutter test --coverage --machine > test-results.json --dart-define CI=true

      - name: Upload test-results.json to artifacts
        uses: actions/upload-artifact@v3
        if: ${{ failure() || success() }}
        with:
          name: test-results
          path: client/test-results.json

  upload-coverage:
    permissions:
      checks: write

    runs-on: ubuntu-latest
    needs: run-tests

    steps:
      - name: Check if test-results.json exists
        uses: xSAVIKx/artifact-exists-action@v0
        id: check-test-results
        with:
          name: test-results

      - if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        run: echo "No test-results.json artifact found. Skipping job."

      - name: Download test-results.json from artifacts
        if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        uses: actions/download-artifact@v2
        with:
          name: test-results

      - name: Upload Test Report
        if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        uses: dorny/test-reporter@v1
        with:
          name: Unit and Widget Tests
          path: test-results.json
          reporter: flutter-json

      - uses: codecov/codecov-action@v3
        if: ${{ steps.check-test-results.outputs.exists == 'true' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    permissions:
      contents: write

    needs: run-tests
    runs-on: ubuntu-latest
    if: github.actor == github.repository_owner && (github.event_name == 'workflow_dispatch' || github.event_name != 'pull_request' && contains(github.event.head_commit.message, '[ci release]'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          cache-key: "flutter-:channel:-:version:"
          channel: "stable"

      - name: Get Cached dependencies
        uses: actions/cache@v3
        id: flutter_cache
        with:
          path: ${{ env.PUB_CACHE }}
          key: flutter-dependencies-v1-${{hashFiles('client/pubspec.yaml', 'client/pubspec.lock')}}
          restore-keys: |
            flutter-dependencies-v1-

      - name: Populate the Flutter tool's cache of binary artifacts
        if: ${{ steps.flutter_cache.outputs.cache-hit != 'true' }}
        run: |
          flutter config --no-analytics
          flutter precache

      - name: Get Cached .dart_tool
        uses: actions/cache@v3
        id: dart_tool_cache
        with:
          path: client/.dart_tool
          key: dart-tool-v1-${{hashFiles('client/pubspec.yaml', 'client/build.yaml')}}
          restore-keys: |
            dart-tool-v1-

      - name: Override git pubspec overrides
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          cd client
          cat > pubspec_overrides.yaml << EOF
          dependency_overrides:
            church_admin_generator:
              git:
                url: https://${DEPS_TOKEN}@github.com/Andrew-Bekhiet/church_admin_generator.git
                ref: master
          EOF

      - name: Decode and save secrets to files
        working-directory: client
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          ANDROID_STRINGS: ${{ secrets.ANDROID_STRINGS }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
          FIREBASE_OPTIONS_DART: ${{ secrets.FIREBASE_OPTIONS_DART }}
          ENCRYPTION_SERVICE_DART: ${{ secrets.ENCRYPTION_SERVICE_DART }}
          SECRETS_SERVICE_DART: ${{ secrets.SECRETS_SERVICE_DART }}
        run: |
          echo $ANDROID_SIGNING_KEY | base64 -d -i > ./android/app/key.keystore
          echo $ANDROID_STRINGS | base64 -d -i > ./android/app/src/main/res/values/strings.xml
          echo $GOOGLE_SERVICES_JSON | base64 -d -i > ./android/app/google-services.json
          echo $ANDROID_KEYSTORE_PROPERTIES | base64 -d -i > ./android/releaseKey.properties
          echo $FIREBASE_OPTIONS_DART | base64 -d -i > ./lib/firebase_options.dart
          echo $ENCRYPTION_SERVICE_DART | base64 -d -i > ./lib/src/services/encryption/encryption_service_impl.dart
          echo $SECRETS_SERVICE_DART | base64 -d -i > ./lib/src/services/secrets/secrets_service_impl.dart

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Run new builder
        working-directory: client
        if: ${{ steps.dart_tool_cache.outputs.cache-hit != 'true' }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run cached builder
        working-directory: client
        if: ${{ steps.dart_tool_cache.outputs.cache-hit == 'true' }}
        run: dart run build_runner build

      - name: Build apk
        working-directory: client
        run: flutter build apk

      - name: Get version from pubspec.yaml
        working-directory: client
        id: version
        run: |
          version=$(grep 'version:' pubspec.yaml | awk '{print $2}' | awk -F "+" '{print $1}')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Add version to APK filename
        working-directory: client
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-v${{ steps.version.outputs.version }}.apk

      - name: Authenticate with Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.APP_RELEASE_UPLOADER_KEY }}"

      - name: Upload APK to Google Cloud Storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        with:
          path: "client/build/app/outputs/flutter-apk/app-release-v${{ steps.version.outputs.version }}.apk"
          destination: "${{ secrets.APP_RELEASE_GCS_BUCKET }}"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.version }}
          generateReleaseNotes: true
