name: Test, Report Coverage and Release

on: [push, pull_request, workflow_dispatch]

jobs:
  test-and-upload-coverage:
    permissions:
      checks: write
      contents: read

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get specific changed files
        id: source-changed
        uses: tj-actions/changed-files@v41
        with:
          files: |
            **.dart
            **/*.dart
            client/assets
            client/pubspec.yaml
            client/build.yaml
            client/analysis_options.yaml
            codecov.yaml

      - name: Get Cached Flutter installation
        uses: actions/cache@v3
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: flutter-3.10.6-stable

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          cache: true
          cache-key: "flutter-:channel:-:version:"
          channel: "stable"

      - name: Get Cached dependencies
        uses: actions/cache@v3
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        id: flutter_cache
        with:
          path: ${{ env.PUB_CACHE }}
          key: flutter-dependencies-v1-${{hashFiles('client/pubspec.yaml', 'client/pubspec.lock')}}
          restore-keys: |
            flutter-dependencies-v1-

      - name: Populate the Flutter tool's cache of binary artifacts
        if: ${{ steps.source-changed.outputs.any_changed == 'true' && steps.flutter_cache.outputs.cache-hit != 'true' }}
        run: |
          flutter config --no-analytics
          flutter precache

      - name: Get Cached .dart_tool
        uses: actions/cache@v3
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        id: dart_tool_cache
        with:
          path: client/.dart_tool
          key: dart-tool-v1-${{hashFiles('client/pubspec.yaml', 'client/build.yaml')}}
          restore-keys: |
            dart-tool-v1-

      - name: Override git ignored files
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        working-directory: client
        run: |
          cp --force lib/firebase_options_ci.dart lib/firebase_options.dart
          cp --force lib/src/services/encryption/encryption_service_ci_impl.dart lib/src/services/encryption/encryption_service_impl.dart
          cp --force lib/src/services/secrets/secrets_service_ci_impl.dart lib/src/services/secrets/secrets_service_impl.dart
          cp pubspec_overrides_ci.yaml pubspec_overrides.yaml

      - name: Override git pubspec overrides
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        working-directory: client
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          cat > pubspec_overrides.yaml << EOF
          dependency_overrides:
            church_admin_generator:
              git:
                url: https://${DEPS_TOKEN}@github.com/Andrew-Bekhiet/church_admin_generator.git
                ref: master
          EOF

      - name: Install dependencies
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        working-directory: client
        run: flutter pub get

      - name: Run new builder
        if: ${{ steps.source-changed.outputs.any_changed == 'true' && steps.dart_tool_cache.outputs.cache-hit != 'true' }}
        working-directory: client
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run cached builder
        if: ${{ steps.source-changed.outputs.any_changed == 'true' && steps.dart_tool_cache.outputs.cache-hit == 'true' }}
        working-directory: client
        run: dart run build_runner build

      - name: Analyze project source
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        uses: ValentinVignal/action-dart-analyze@v0.16
        with:
          working-directory: client
          fail-on: "warning"

      - name: Run Tests
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        working-directory: client
        run: flutter test --coverage --machine > test-results.json --dart-define CI=true

      - name: Upload test-results.json to artifacts
        uses: actions/upload-artifact@v3
        if: ${{ failure() || success() }}
        with:
          name: test-results
          path: client/test-results.json

      - name: Upload Test Report
        uses: dorny/test-reporter@v1
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          name: Unit and Widget Tests
          path: client/test-results.json
          reporter: flutter-json

      - uses: codecov/codecov-action@v3
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          directory: client
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    permissions:
      contents: write
    needs: test-and-upload-coverage
    runs-on: ubuntu-latest
    if: github.repository != 'Andrew-Bekhiet/church_admin' && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[ci release]'))

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Flutter
        uses: subosito/flutter-action@v2
        with:
          cache: true
          cache-key: "flutter-:channel:-:version:"
          channel: "stable"

      - name: Get Cached dependencies
        uses: actions/cache@v3
        id: flutter_cache
        with:
          path: ${{ env.PUB_CACHE }}
          key: flutter-dependencies-v1-${{hashFiles('client/pubspec.yaml', 'client/pubspec.lock')}}
          restore-keys: |
            flutter-dependencies-v1-

      - name: Populate the Flutter tool's cache of binary artifacts
        if: ${{ steps.flutter_cache.outputs.cache-hit != 'true' }}
        run: |
          flutter config --no-analytics
          flutter precache

      - name: Get Cached .dart_tool
        uses: actions/cache@v3
        id: dart_tool_cache
        with:
          path: client/.dart_tool
          key: dart-tool-v1-${{hashFiles('client/pubspec.yaml', 'client/build.yaml')}}
          restore-keys: |
            dart-tool-v1-

      - name: Override git pubspec overrides
        env:
          DEPS_TOKEN: ${{ secrets.DEPS_TOKEN }}
        run: |
          cd client
          cat > pubspec_overrides.yaml << EOF
          dependency_overrides:
            church_admin_generator:
              git:
                url: https://${DEPS_TOKEN}@github.com/Andrew-Bekhiet/church_admin_generator.git
                ref: master
          EOF

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Run new builder
        working-directory: client
        if: ${{ steps.dart_tool_cache.outputs.cache-hit != 'true' }}
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Run cached builder
        working-directory: client
        if: ${{ steps.dart_tool_cache.outputs.cache-hit == 'true' }}
        run: dart run build_runner build

      - name: Build apk
        working-directory: client
        run: flutter build apk

      - name: Get version from pubspec.yaml
        working-directory: client
        id: version
        run: |
          version=$(grep 'version:' pubspec.yaml | awk '{print $2}' | awk -F "+" '{print $1}')
          echo "version=$version" >> $GITHUB_OUTPUT

      - name: Rename APK
        working-directory: client
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-v${{ steps.version.outputs.version }}.apk

      - name: Authenticate with Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.APP_RELEASE_UPLOADER_KEY }}"

      - name: Upload APK to Google Cloud Storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        with:
          path: "client/build/app/outputs/flutter-apk/app-release-v${{ steps.version.outputs.version }}.apk"
          destination: "${{ secrets.APP_RELEASE_GCS_BUCKET }}"

      - name: Create release
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.version }}
          generateReleaseNotes: true
