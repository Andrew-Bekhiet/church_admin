name: Test and upload coverage

on: [push, pull_request]

jobs:
  test-and-upload-coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 2

      - name: Get specific changed files
        id: source-changed
        uses: tj-actions/changed-files@v13
        with:
          files: |
            **.dart
            **/*.dart
            assets
            pubspec.yaml
            build.yaml
            analysis_options.yaml
            codecov.yaml

      - uses: actions/cache@v3
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          path: ${{ runner.tool_cache }}/flutter
          key: flutter-3.10.6-stable

      - uses: subosito/flutter-action@v2
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          channel: "stable"

      - uses: actions/cache@v3
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          path: ${{ env.PUB_CACHE }}
          key: flutter-dependencies-v1-${{hashFiles('pubspec.yaml')}}
          restore-keys: |
            flutter-dependencies-v1-

      - name: Install dependencies
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        run: flutter pub get

      - uses: actions/cache@v3
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          path: ${{ env.GITHUB_WORKSPACE }}/.dart_tool
          key: dart-tool-v1-${{hashFiles('pubspec.yaml', 'build.yaml')}}
          restore-keys: |
            dart-tool-v1-

      - name: Override git ignored files
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        run: |
          cp --force lib/firebase_options_ci.dart lib/firebase_options.dart
          cp --force lib/src/services/encryption/encryption_service_ci_impl.dart lib/src/services/encryption/encryption_service_impl.dart
          cp --force lib/src/services/secrets/secrets_service_ci_impl.dart lib/src/services/secrets/secrets_service_impl.dart

      - name: Build files
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        run: dart run build_runner build

      - name: Analyze project source
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        run: flutter analyze

      - name: Run Tests
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        run: flutter test --coverage --machine > test-results.json

      - name: Upload Test Report
        uses: dorny/test-reporter@v1
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          name: Package Tests
          path: test-results.json
          reporter: flutter-json

      - uses: codecov/codecov-action@v3
        if: ${{ steps.source-changed.outputs.any_changed == 'true' }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
