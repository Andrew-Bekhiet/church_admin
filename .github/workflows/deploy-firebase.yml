name: Deploy Firebase

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-firebase.yml"
      - "server/firebase/**"

permissions: {}

concurrency:
  group: deploy-firebase-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: server/firebase

jobs:
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOYER_SERVICE_ACCOUNT_NAME }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Firebase project
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
        run: |
          DEPLOY_MESSAGE="$(git log -1 --pretty=oneline)"
          npx firebase-tools@15.29.0 deploy --project "$FIREBASE_PROJECT_ID" --only database,hosting -m "$DEPLOY_MESSAGE"
