name: Deploy Firebase

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-firebase.yml"
      - "server/firebase/**"
  pull_request:
    paths:
      - ".github/workflows/deploy-firebase.yml"
      - "server/firebase/**"

defaults:
  run:
    working-directory: server/firebase/functions

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: server/firebase/functions/.nvmrc
          cache: npm
          cache-dependency-path: server/firebase/functions/package-lock.json

      - name: Install Firebase Functions dependencies
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOYER_SERVICE_ACCOUNT_NAME }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Set Firebase project environment variables
        if: ${{ github.event_name != 'pull_request' }}
        env:
          FUNCTIONS_PROD_ENV_FILE: ${{ secrets.FUNCTIONS_PROD_ENV_FILE }}
        run: echo "$FUNCTIONS_PROD_ENV_FILE" | base64 -d > .env

      - name: Set Mock Firebase project environment variables
        if: ${{ github.event_name == 'pull_request' }}
        run: mv example.env.project-id .env

      - name: Deploy Firebase project
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          DEPLOY_MESSAGE="$(git log -1 --pretty=oneline)"
          npx firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only database,functions,hosting -m "$DEPLOY_MESSAGE"

      - name: Validate Firebase project
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          DEPLOY_MESSAGE="$(git log -1 --pretty=oneline)"
          npx firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only database,functions,hosting -m "$DEPLOY_MESSAGE" --dry-run

      - name: Remove Firebase project environment variables
        if: ${{ always() }}
        run: rm -f .env
