name: Deploy Firebase

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/deploy-firebase.yml"
      - "server/firebase/**"

jobs:
  deploy-firebase:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/firebase/functions/package-lock.json

      - name: Install Firebase Functions dependencies
        working-directory: server/firebase/functions
        run: npm ci

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ secrets.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.FIREBASE_DEPLOYER_SERVICE_ACCOUNT_NAME }}
          create_credentials_file: true
          export_environment_variables: true

      - name: Deploy Firebase project
        working-directory: server/firebase
        run: |
          npx firebase deploy --project "${{ secrets.FIREBASE_PROJECT_ID }}" --only database,hosting,functions --message="${{ github.sha }}"
