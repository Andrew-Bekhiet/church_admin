name: Fingerprint sync

on:
  pull_request:
    paths:
      - "server/fingerprint_sync/**"
      - ".github/workflows/fingerprint-sync.yml"

  push:
    branches: [master]
    paths:
      - "server/fingerprint_sync/**"
      - ".github/workflows/fingerprint-sync.yml"

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server/fingerprint_sync

jobs:
  check:
    name: Lint, build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: server/fingerprint_sync/.nvmrc
          cache: npm
          cache-dependency-path: server/fingerprint_sync/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
