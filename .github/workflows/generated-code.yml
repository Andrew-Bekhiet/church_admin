name: Check generated code matches committed files

on:
  pull_request:
    paths:
      - "client/lib/**"
      - "client/test/**/*.dart"
      - "client/build.yaml"
      - "client/pubspec.*"
      - "client/.fvmrc"
      - "client/scripts/check_generated_code.sh"
      - "client/scripts/check_graphql_schema.sh"
      - "client/scripts/fetch_graphql_schema.sh"
      - "client/scripts/graphql_schema.cjs"
      - "client/scripts/split_schema_graphql_dart.sh"
      - "packages/*/lib/**"
      - "packages/*/build.yaml"
      - "packages/*/pubspec.*"
      - "server/hasura/**"
      - "server/postgres/**"
      - "server/docker-compose.yml"
      - ".github/workflows/generated-code.yml"
      - ".github/actions/setup-flutter/**"

  push:
    branches: [master]
    paths:
      - "client/lib/**"
      - "client/test/**/*.dart"
      - "client/build.yaml"
      - "client/pubspec.*"
      - "client/.fvmrc"
      - "client/scripts/check_generated_code.sh"
      - "client/scripts/check_graphql_schema.sh"
      - "client/scripts/fetch_graphql_schema.sh"
      - "client/scripts/graphql_schema.cjs"
      - "client/scripts/split_schema_graphql_dart.sh"
      - "packages/*/lib/**"
      - "packages/*/build.yaml"
      - "packages/*/pubspec.*"
      - "server/hasura/**"
      - "server/postgres/**"
      - "server/docker-compose.yml"
      - ".github/workflows/generated-code.yml"
      - ".github/actions/setup-flutter/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  generated-code:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: 🔍 Check client schema.graphql matches the Hasura schema built from this commit's migrations and metadata
        run: client/scripts/check_graphql_schema.sh

      - name: 💙 Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install client dependencies
        run: flutter pub get --directory client

      - name: 🔍 Check committed build_runner outputs match a fresh build (changed files on PRs, everything on master)
        run: client/scripts/check_generated_code.sh ${{ github.event_name == 'pull_request' && 'HEAD^1' || '' }}
