name: Test Dart packages

on:
  pull_request:
    paths:
      - "packages/**"
      - "client/.fvmrc"
      - ".github/workflows/packages.yml"

  push:
    branches: [master]
    paths:
      - "packages/**"
      - "client/.fvmrc"
      - ".github/workflows/packages.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  find-tested-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      packages: ${{ steps.find.outputs.packages }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages

      - name: List packages that have a test directory
        id: find
        run: |
          packages=$(find packages -mindepth 2 -maxdepth 2 -type d -name test | cut -d/ -f2 | sort | jq -Rnc '[inputs]')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    needs: find-tested-packages
    if: needs.find-tested-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.find-tested-packages.outputs.packages) }}

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          cache: true
          flutter-version-file: client/.fvmrc
          pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:"
          cache-key: "flutter:os:-:channel:-:version:-:arch:"

      - name: Install dependencies (standalone resolution, newest analyzer the constraints allow)
        run: dart pub get

      - name: Run tests
        run: dart test
