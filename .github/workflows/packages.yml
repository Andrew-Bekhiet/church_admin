name: Test Dart packages

on:
  pull_request:
    paths:
      - "packages/**"
      - "client/.fvmrc"
      - ".github/workflows/packages.yml"
      - ".github/actions/setup-flutter/**"

  push:
    branches: [master]
    paths:
      - "packages/**"
      - "client/.fvmrc"
      - ".github/workflows/packages.yml"
      - ".github/actions/setup-flutter/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  find-tested-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      packages: ${{ steps.find.outputs.packages }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages

      - name: 📋 List packages that have a test directory
        id: find
        run: |
          set -o pipefail
          packages=$(find packages -mindepth 2 -maxdepth 2 -type d -name test | cut -d/ -f2 | sort | jq -Rnc '[inputs]')
          echo "packages=$packages" >> "$GITHUB_OUTPUT"

  test:
    needs: find-tested-packages
    if: needs.find-tested-packages.outputs.packages != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.find-tested-packages.outputs.packages) }}

    defaults:
      run:
        working-directory: packages/${{ matrix.package }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 💙 Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install dependencies (standalone resolution, newest analyzer the constraints allow)
        run: dart pub get

      - name: 🧪 Run tests
        run: dart test
