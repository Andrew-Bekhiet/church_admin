name: Patch

on:
  push:
    tags:
      - "v*.*.*\\+*"
  workflow_dispatch:
    inputs:
      base_version:
        description: "Version to be patched (e.g., latest, 1.0.0+1)"
        required: true
        type: string
      android:
        description: "Patch for Android"
        required: false
        default: true
        type: boolean
      ios:
        description: "Patch for iOS"
        required: false
        default: true
        type: boolean

defaults:
  run:
    working-directory: client

jobs:
  patch-android:
    if: ${{ github.event_name == 'push' || inputs.android }}
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🙈 Mask log values
        env:
          LOG_MASK_VALUES: ${{ secrets.LOG_MASK_VALUES }}
        run: while IFS= read -r v; do if [ -n "$v" ]; then echo "::add-mask::$v"; fi; done <<< "$LOG_MASK_VALUES"

      - name: 🧹 Free up disk space
        run: |
          # Space usage before cleanup
          df -h /

          # Remove unused tool caches
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Verify gains
          df -h /

      - name: 🛠️ Prepare Shorebird build
        uses: ./.github/actions/prepare-shorebird-build

      - name: ☕ Set Up Java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          cache: "gradle"
          distribution: "temurin"
          java-version: "17"

      - name: 🔓 Decode and save android secrets
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          echo $ANDROID_SIGNING_KEY | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/app/key.keystore
          echo $GOOGLE_SERVICES_JSON | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/app/google-services.json
          echo $ANDROID_KEYSTORE_PROPERTIES | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/releaseKey.properties

      - name: 🔓 Decode app production environment
        env:
          APP_PROD_ENV_FILE: ${{ secrets.APP_PROD_ENV_FILE }}
        run: echo "$APP_PROD_ENV_FILE" | base64 -d > .env

      - name: 🏷️ Resolve release version to patch
        id: release-version
        env:
          BASE_VERSION: ${{ inputs.base_version }}
        run: echo "version=${BASE_VERSION:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Shorebird Patch Android
        uses: shorebirdtech/shorebird-patch@deb179c67708c6b0caf7582eac41361c8d51948a # main
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: android
          working-directory: client
          release-version: ${{ steps.release-version.outputs.version }}
          args: --allow-asset-diffs
            --dart-define-from-file=.env

      - name: 🗑️ Delete app production environment
        if: ${{ always() }}
        run: rm -f .env

  patch-ios:
    if: ${{ github.event_name == 'push' || inputs.ios }}
    runs-on: macos-latest
    environment: release
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: 🙈 Mask log values
        env:
          LOG_MASK_VALUES: ${{ secrets.LOG_MASK_VALUES }}
        run: while IFS= read -r v; do if [ -n "$v" ]; then echo "::add-mask::$v"; fi; done <<< "$LOG_MASK_VALUES"

      - name: 🛠️ Prepare Shorebird build
        uses: ./.github/actions/prepare-shorebird-build

      - name: 📦 Install Codemagic CLI tools
        run: pip install codemagic-cli-tools

      - name: 🔐 Set up keychain
        run: keychain initialize

      - name: 🔏 Fetch signing files
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_APPLE_ID: ${{ secrets.APP_STORE_APPLE_ID }}
        run: |
          cd ios
          app-store-connect fetch-signing-files $(xcode-project detect-bundle-id) \
          --type IOS_APP_STORE \
          --create

      - name: 🔏 Set up signing certificate
        run: keychain add-certificates

      - name: 🔏 Set up code signing settings on Xcode project
        run: xcode-project use-profiles

      - name: 🍎 Set Up latest stable Xcode version
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90 # v1
        with:
          xcode-version: latest-stable

      - name: 🔓 Decode app production environment
        env:
          APP_PROD_ENV_FILE: ${{ secrets.APP_PROD_ENV_FILE }}
        run: echo "$APP_PROD_ENV_FILE" | base64 -d > .env

      - name: 🏷️ Resolve release version to patch
        id: release-version
        env:
          BASE_VERSION: ${{ inputs.base_version }}
        run: echo "version=${BASE_VERSION:-${GITHUB_REF_NAME#v}}" >> "$GITHUB_OUTPUT"

      - name: 🚀 Shorebird Patch iOS
        uses: shorebirdtech/shorebird-patch@deb179c67708c6b0caf7582eac41361c8d51948a # main
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          platform: ios
          working-directory: client
          release-version: ${{ steps.release-version.outputs.version }}
          args: --export-options-plist="$HOME/export_options.plist"
            --allow-asset-diffs
            --dart-define-from-file=.env

      - name: 🗑️ Delete app production environment
        if: ${{ always() }}
        run: rm -f .env
