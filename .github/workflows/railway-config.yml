name: Railway config

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/railway-config.yml"
      - ".railway/**"
      - "package.json"
      - "package-lock.json"
  pull_request:
    paths:
      - ".github/workflows/railway-config.yml"
      - ".railway/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: railway-config-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  RAILWAY_CLI_VERSION: 5.71.0

jobs:
  plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      actions: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Plan Railway config and pin the change set
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: plan
          cli-version: ${{ env.RAILWAY_CLI_VERSION }}
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  apply:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Apply the merged pull request's pinned plan
        uses: railwayapp/config@9e17d413dbe219f19d62538d9c06b5dbb5e9abf8 # v1.2.0
        with:
          command: apply
          cli-version: ${{ env.RAILWAY_CLI_VERSION }}
          railway-token: ${{ secrets.RAILWAY_TOKEN }}

  drift:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install Railway SDK
        run: npm ci --no-audit --no-fund

      - name: Install Railway CLI
        run: npm install --global --no-audit --no-fund "@railway/cli@${RAILWAY_CLI_VERSION}"

      - name: Fail when the Railway dashboard drifted from .railway/railway.ts
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway config plan --detailed-exit-code
