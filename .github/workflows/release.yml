name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v1.0.0)"
        required: true
        type: string
      android:
        description: "Release for Android"
        required: false
        default: true
        type: boolean
      ios:
        description: "Release for iOS"
        required: false
        default: true
        type: boolean

jobs:
  validate-tag:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      is-valid: ${{ steps.validate.outputs.is-valid }}

    steps:
      - name: Get version from tag
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          # Remove 'v' prefix if present
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Validate semantic version
        id: validate
        run: |
          VERSION="${{ steps.get-version.outputs.version }}"
          if [[ $VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is-valid=true" >> $GITHUB_OUTPUT
            echo "✅ Valid semantic version: $VERSION"
          else
            echo "is-valid=false" >> $GITHUB_OUTPUT
            echo "❌ Invalid semantic version: $VERSION"
            exit 1
          fi

  release-mobile:
    permissions:
      contents: write

    needs: [validate-tag]
    if: ${{ always() && (needs.validate-tag.result == 'success') && (github.event_name == 'push' || (github.event.inputs.android == 'true' || github.event.inputs.ios == 'true')) }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        exclude:
          # Skip Ubuntu (Android) if only iOS is requested
          - os: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.android == 'false' && 'ubuntu-latest' }}
          # Skip macOS (iOS) if only Android is requested
          - os: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ios == 'false' && 'macos-latest' }}
    runs-on: ${{ matrix.os }}

    steps:
      - name: Free up disk space
        if: ${{ matrix.os == 'ubuntu-latest' }}
        run: |
          # Space usage before cleanup
          df -h /

          # Remove unused tool caches
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/share/swift
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

          # Verify gains
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get Flutter
        id: flutter-action
        uses: subosito/flutter-action@v2
        with:
          cache: true
          flutter-version-file: client/.fvmrc
          pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:"
          cache-key: "flutter:os:-:channel:-:version:-:arch:"

      - name: Install Codemagic CLI tools
        run: pip install codemagic-cli-tools

      - name: Set up keychain
        if: ${{ matrix.os == 'macos-latest' }}
        run: keychain initialize

      - name: Fetch signing files
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: client/ios
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_APPLE_ID: ${{ secrets.APP_STORE_APPLE_ID }}
        run: |
          app-store-connect fetch-signing-files $(xcode-project detect-bundle-id) \
          --type IOS_APP_STORE \
          --create
      - name: Set up signing certificate
        if: ${{ matrix.os == 'macos-latest' }}
        run: keychain add-certificates
      - name: Set up code signing settings on Xcode project
        if: ${{ matrix.os == 'macos-latest' }}
        run: xcode-project use-profiles

      - name: 🐦 Setup Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Set Up Java
        uses: actions/setup-java@v4
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          cache: "gradle"
          distribution: "temurin"
          java-version: "17"

      - name: Set Up latest stable Xcode version
        if: ${{ matrix.os == 'macos-latest' }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Populate the Flutter tool's cache of binary artifacts
        run: flutter precache

      - name: Decode and save android secrets
        working-directory: client
        if: ${{ matrix.os == 'ubuntu-latest' }}
        env:
          ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_SIGNING_KEY }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          ANDROID_KEYSTORE_PROPERTIES: ${{ secrets.ANDROID_KEYSTORE_PROPERTIES }}
        run: |
          echo $ANDROID_SIGNING_KEY | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/app/key.keystore
          echo $GOOGLE_SERVICES_JSON | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/app/google-services.json
          echo $ANDROID_KEYSTORE_PROPERTIES | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./android/releaseKey.properties

      - name: Install dependencies
        working-directory: client
        run: flutter pub get

      - name: Run new builder
        working-directory: client
        run: rm -r lib/src/core/graphql/__generated__/; dart run build_runner build && ./scripts/split_schema_graphql_dart.sh

      - name: Decode app production environment
        working-directory: client
        env:
          APP_PROD_ENV_FILE: ${{ secrets.APP_PROD_ENV_FILE }}
        run: echo "$APP_PROD_ENV_FILE" | base64 -d > .env

      - name: 🚀 Shorebird Release
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: shorebirdtech/shorebird-release@v0
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          working-directory: client
          platform: android
          args: --artifact=apk
            --flutter-version=${{ steps.flutter-action.outputs.VERSION }}
            --dart-define-from-file=.env

      - name: Run pod repo update
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: client
        run: pod repo update

      - name: Update podfile.lock
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: client/ios
        run: pod install --repo-update

      - name: Get version from tag
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION=${VERSION#v}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
      - name: 🚀 Shorebird Release
        if: ${{ matrix.os == 'macos-latest' }}
        uses: shorebirdtech/shorebird-release@v0
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
        with:
          working-directory: client
          platform: ios
          args: --build-name ${{ steps.version.outputs.version }}
            --export-options-plist="$HOME/export_options.plist"
            --flutter-version=${{ steps.flutter-action.outputs.VERSION }}
            --dart-define-from-file=.env

      - name: Delete app production environment
        if: ${{ always() }}
        working-directory: client
        run: rm -f .env

      - name: Publish to Google Play
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: client
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_CREDENTIALS }}
        run: |
          google-play bundles publish \
          --bundle "build/app/outputs/bundle/release/app-release.aab" \
          --track production

      - name: Publish the app to App Store Connect
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: client
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
          APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
          APP_STORE_APPLE_ID: ${{ secrets.APP_STORE_APPLE_ID }}
        run: |
          app-store-connect publish --path "$(find $(pwd) -name "*.ipa")"

      - name: Add version to APK filename
        if: ${{ matrix.os == 'ubuntu-latest' }}
        working-directory: client
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/app-release-v${{ steps.version.outputs.version }}.apk

      - name: Add version to ipa filename
        if: ${{ matrix.os == 'macos-latest' }}
        working-directory: client
        run: |
          mv build/ios/ipa/churchAdmin.ipa build/ios/ipa/app-release-v${{ steps.version.outputs.version }}.ipa

      - name: Authenticate with Google Cloud
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.APP_RELEASE_UPLOADER_KEY }}"

      - name: Upload APK to Google Cloud Storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        if: ${{ matrix.os == 'ubuntu-latest' }}
        with:
          path: "client/build/app/outputs/flutter-apk/app-release-v${{ steps.version.outputs.version }}.apk"
          destination: "${{ secrets.APP_RELEASE_GCS_BUCKET }}"

      - name: Upload ipa to Google Cloud Storage
        uses: "google-github-actions/upload-cloud-storage@v2"
        if: ${{ matrix.os == 'macos-latest' }}
        with:
          path: "client/build/ios/ipa/app-release-v${{ steps.version.outputs.version }}.ipa"
          destination: "${{ secrets.APP_RELEASE_GCS_BUCKET }}"

      - name: Create release
        if: ${{ matrix.os == 'ubuntu-latest' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag: v${{ steps.version.outputs.version }}
          generateReleaseNotes: true

  update-app-version:
    runs-on: ubuntu-latest
    needs: release-mobile

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Get current version
        id: get-version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.tag }}"
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          VERSION=${VERSION#v}
          echo "current_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Write service account key to file
        working-directory: server/functions
        env:
          FIREBASE_REMOTE_CONFIG_UPDATER_KEY: ${{ secrets.FIREBASE_REMOTE_CONFIG_UPDATER_KEY }}
        run: |
          echo $FIREBASE_REMOTE_CONFIG_UPDATER_KEY | sed 's/[^A-Za-z0-9+/=]//g' | base64 -d > ./firebase-service-account.json

      - name: Install npm dependencies
        working-directory: server/functions
        run: npm ci

      - name: Build server
        working-directory: server/functions
        run: npm run build

      - name: Update remote config app version
        working-directory: server/functions
        env:
          LATEST_VERSION: ${{ steps.get-version.outputs.current_version }}
          GOOGLE_APPLICATION_CREDENTIALS: ./firebase-service-account.json
        run: node ./lib/update_remote_config_app_version.js

      - name: Remove service account key file
        working-directory: server/functions
        if: ${{ always() }}
        run: rm -f ./firebase-service-account.json
