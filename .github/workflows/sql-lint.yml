name: SQL lint

on:
  pull_request:
    paths:
      - "server/hasura/migrations/**/*.sql"
      - "server/hasura/.sqlfluff"
      - "server/hasura/scripts/lint_changed_migrations.sh"
      - ".github/workflows/sql-lint.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  sqlfluff:
    name: SQL (migrations changed in this PR)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install sqlfluff
        run: pip install sqlfluff==3.5.0

      - name: Lint changed migrations
        run: server/hasura/scripts/lint_changed_migrations.sh "${{ github.event.pull_request.base.sha }}"
