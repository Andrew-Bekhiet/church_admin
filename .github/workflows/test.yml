name: Test and Coverage

on:
  pull_request:
    paths:
      - "client/lib/**"
      - "client/test/**"
      - "client/assets/**"
      - "client/dart_test.yaml"
      - "client/pubspec.*"
      - "client/.fvmrc"
      - "client/scripts/generate_test_bundle.sh"
      - "packages/*/lib/**"
      - "packages/*/pubspec.*"
      - ".github/workflows/test.yml"
      - ".github/actions/setup-flutter/**"

  push:
    branches: [master]
    paths:
      - "client/lib/**"
      - "client/test/**"
      - "client/assets/**"
      - "client/dart_test.yaml"
      - "client/pubspec.*"
      - "client/.fvmrc"
      - "client/scripts/generate_test_bundle.sh"
      - "packages/*/lib/**"
      - "packages/*/pubspec.*"
      - ".github/workflows/test.yml"
      - ".github/actions/setup-flutter/**"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: 💙 Setup Flutter
        uses: ./.github/actions/setup-flutter

      - name: 📦 Install dependencies
        run: flutter pub get

      - name: 🧪 Run tests with coverage
        env:
          TZ: Africa/Cairo
        run: flutter test --coverage --reporter=expanded --file-reporter "json:test-results.json" --dart-define CI=true test/test_bundle.dart $(scripts/generate_test_bundle.sh)

      - name: ☁️ Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          path: client/test-results.json
          archive: false

      - name: 📊 Report test results
        uses: dorny/test-reporter@b94dfe179d7ff66342276f4bd6b82c3c0f659f52 # v3.2.0
        if: always()
        with:
          name: "Unit and Widget Tests"
          path: client/test-results.json
          reporter: flutter-json

      - name: ☁️ Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: client
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
