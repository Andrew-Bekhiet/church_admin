name: Test and Coverage

on:
  pull_request:
    paths:
      - "client/**"
      - ".github/workflows/test.yml"

  push:
    branches: [master]
    paths:
      - "client/**"
      - ".github/workflows/test.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          cache: true
          flutter-version-file: client/.fvmrc
          pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:"
          cache-key: "flutter:os:-:channel:-:version:-:arch:"

      - name: Install dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Restore analyzer cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.dartServer
          key: dart-server-${{ runner.os }}-${{ hashFiles('client/.fvmrc', 'client/pubspec.lock') }}-${{ github.sha }}
          restore-keys: |
            dart-server-${{ runner.os }}-${{ hashFiles('client/.fvmrc', 'client/pubspec.lock') }}-
            dart-server-${{ runner.os }}-

      - name: Analyze code
        run: dart analyze --plugins --fatal-infos

      - name: Save analyzer cache
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.dartServer
          key: dart-server-${{ runner.os }}-${{ hashFiles('client/.fvmrc', 'client/pubspec.lock') }}-${{ github.sha }}

      - name: Run tests with coverage
        run: flutter test --coverage --reporter=expanded --file-reporter "json:test-results.json" --dart-define CI=true test/test_bundle.dart $(scripts/generate_test_bundle.sh)

      - name: Upload test results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: client/test-results.json

      - name: Report test results
        uses: dorny/test-reporter@d61b558e8df85cb60d09ca3e5b09653b4477cea7 # v1
        if: always()
        with:
          name: "Unit and Widget Tests"
          path: client/test-results.json
          reporter: flutter-json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4
        with:
          directory: client
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
