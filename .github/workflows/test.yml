name: Test and Coverage

on:
  pull_request:
    paths:
      - "client/**/*.dart"
      - "client/**/*.gql"
      - "client/**/*.graphql"
      - "client/test/**"
      - "client/assets/**"
      - "client/dart_test.yaml"
      - "client/pubspec.*"
      - "client/.fvmrc"
      - "client/scripts/generate_test_bundle.sh"
      - "packages/**/*.dart"
      - "packages/*/pubspec.*"
      - ".github/workflows/test.yml"

  push:
    branches: [master]
    paths:
      - "client/**/*.dart"
      - "client/**/*.gql"
      - "client/**/*.graphql"
      - "client/test/**"
      - "client/assets/**"
      - "client/dart_test.yaml"
      - "client/pubspec.*"
      - "client/.fvmrc"
      - "client/scripts/generate_test_bundle.sh"
      - "packages/**/*.dart"
      - "packages/*/pubspec.*"
      - ".github/workflows/test.yml"

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: client

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          cache: true
          flutter-version-file: client/.fvmrc
          pub-cache-key: "flutter-pub:os:-:channel:-:version:-:arch:"
          cache-key: "flutter:os:-:channel:-:version:-:arch:"

      - name: Install dependencies
        run: flutter pub get

      - name: Run tests with coverage
        run: flutter test --coverage --reporter=expanded --file-reporter "json:test-results.json" --dart-define CI=true test/test_bundle.dart $(scripts/generate_test_bundle.sh)

      - name: Upload test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          path: client/test-results.json
          archive: false

      - name: Report test results
        uses: dorny/test-reporter@cc52f364a405169afe07bb00dab3d375b451229d # v3.2.0
        if: always()
        with:
          name: "Unit and Widget Tests"
          path: client/test-results.json
          reporter: flutter-json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: client
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
