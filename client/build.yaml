targets:
  $default:
    builders:
      freezed:
        enabled: true
        options:
          format: true
          map: false
          when: false
      json_serializable:
        options:
          any_map: true
          explicit_to_json: true
      source_gen:combining_builder:
        options:
          preamble: |-
            // coverage:ignore-file
            // ignore_for_file: type=lint
      graphql_codegen:
        enabled: true
        options:
          addTypenameExcludedPaths: []
          outputDirectory: "__generated__"
          namingSeparator: "_"
          scalars:
            ID:
              type: String
            DateTime:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/src/core/graphql/scalars.dart
            NaiveDateTime:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/src/core/graphql/scalars.dart
            Date:
              type: DateTime
              fromJsonFunctionName: dateFromString
              toJsonFunctionName: dateToString
              import: package:church_admin/src/core/graphql/scalars.dart
            Time:
              type: DateTime
              fromJsonFunctionName: timeFromString
              toJsonFunctionName: timeToString
              import: package:church_admin/src/core/graphql/scalars.dart
            DateRange:
              type: DateTimeRange
              fromJsonFunctionName: dateRangeFromString
              toJsonFunctionName: dateRangeToString
              import: package:church_admin/src/core/graphql/scalars.dart
            Json:
              type: Json
            Decimal:
              type: String
          clients: []
