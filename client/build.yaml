targets:
  $default:
    builders:
      json_serializable:
        options:
          any_map: true
          explicit_to_json: true
      graphql_codegen:
        enabled: true
        options:
          # generatedFileHeader: "// ignore_for_file: directives_ordering, prefer_is_not_operator, prefer_if_elements_to_conditional_expressions, annotate_overrides, prefer_final_fields, always_declare_return_types, avoid_redundant_argument_values"
          addTypenameExcludedPaths: ["subscription"]
          outputDirectory: "__generated__"
          scalars:
            uuid:
              type: UuidValue
              fromJsonFunctionName: stringToUuid
              toJsonFunctionName: uuidToString
              import: package:church_admin/graphql/scalars.dart
            bytea:
              type: String
            citext:
              type: String
            name:
              type: String
            bigint:
              type: int
            smallint:
              type: int
            date:
              type: DateTime
              fromJsonFunctionName: dateFromString
              toJsonFunctionName: dateToString
              import: package:church_admin/graphql/scalars.dart
            daterange:
              type: DateTimeRange
              fromJsonFunctionName: dateRangeFromString
              toJsonFunctionName: dateRangeToString
              import: package:church_admin/graphql/scalars.dart
            timetz:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/graphql/scalars.dart
            time:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/graphql/scalars.dart
            timestamp:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/graphql/scalars.dart
            timestamptz:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/graphql/scalars.dart
            _text:
              type: List<String>
            json:
              type: Json
            jsonb:
              type: Json
            geography:
              type: Map<String, dynamic>
            geometry:
              type: Map<String, dynamic>
          clients: []
