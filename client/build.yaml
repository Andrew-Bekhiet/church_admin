targets:
  $default:
    sources:
      exclude:
        - "lib/**.graphql"
    builders:
      freezed:
        enabled: true
        options:
          format: true
          map: false
          when: false
      json_serializable:
        options:
          any_map: true
          explicit_to_json: true
      source_gen:combining_builder:
        options:
          preamble: |-
            // coverage:ignore-file
            // ignore_for_file: type=lint
      graphql_codegen:
        enabled: true
        options:
          scopes:
            - "lib/**.gql"
          # generatedFileHeader: "// ignore_for_file: directives_ordering, prefer_is_not_operator, prefer_if_elements_to_conditional_expressions, annotate_overrides, prefer_final_fields, always_declare_return_types, avoid_redundant_argument_values"
          # A root __typename makes Hasura commit each mutation root field in its own transaction.
          # `__typename`s are only needed for non-root fields for cache normalization
          addTypenameExcludedPaths:
            - query
            - mutation
            - subscription
          outputDirectory: "__generated__"
          namingSeparator: "_"
          scalars:
            uuid:
              type: UuidValue
              fromJsonFunctionName: stringToUuid
              toJsonFunctionName: uuidToString
              import: package:church_admin/src/core/graphql/scalars.dart
            name:
              type: String
            bigint:
              type: int
            smallint:
              type: int
            date:
              type: DateTime
              fromJsonFunctionName: dateFromString
              toJsonFunctionName: dateToString
              import: package:church_admin/src/core/graphql/scalars.dart
            daterange:
              type: DateTimeRange
              fromJsonFunctionName: dateRangeFromString
              toJsonFunctionName: dateRangeToString
              import: package:church_admin/src/core/graphql/scalars.dart
            timetz:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/src/core/graphql/scalars.dart
            time:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/src/core/graphql/scalars.dart
            timestamp:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/src/core/graphql/scalars.dart
            timestamptz:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/src/core/graphql/scalars.dart
            json:
              type: Json
            jsonb:
              type: Json
            geography:
              type: Map<String, dynamic>
            geometry:
              type: Map<String, dynamic>
            meeting_audience:
              type: String
          clients: []
  ash:
    sources:
      include:
        - "lib/**.graphql"
    builders:
      graphql_codegen:
        enabled: true
        options:
          scopes:
            - "lib/**.graphql"
          addTypenameExcludedPaths: []
          outputDirectory: "__generated__"
          namingSeparator: "_"
          scalars:
            ID:
              type: String
            DateTime:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/src/core/graphql/scalars.dart
            NaiveDateTime:
              type: DateTime
              fromJsonFunctionName: tstzFromString
              toJsonFunctionName: tstzToString
              import: package:church_admin/src/core/graphql/scalars.dart
            Date:
              type: DateTime
              fromJsonFunctionName: dateFromString
              toJsonFunctionName: dateToString
              import: package:church_admin/src/core/graphql/scalars.dart
            Time:
              type: DateTime
              fromJsonFunctionName: timeFromString
              toJsonFunctionName: timeToString
              import: package:church_admin/src/core/graphql/scalars.dart
            DateRange:
              type: DateTimeRange
              fromJsonFunctionName: dateRangeFromString
              toJsonFunctionName: dateRangeToString
              import: package:church_admin/src/core/graphql/scalars.dart
            Json:
              type: Json
            Decimal:
              type: String
          clients: []
