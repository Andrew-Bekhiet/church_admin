# Any other files should be in the shared or core folders
# The problem with current folder structure is that it's not scalable.
# Files for each feature are scattered across different folders
# Changing a feature requires changing multiple files across different folders
# This is not scalable and makes it hard to maintain and refactor

# Folder structure implementation
- Feature:
    - Presentation:
        - Widgets
        - Navigation
        - Screens
        - Controllers
    - Application:
        - Services
    - Domain:
        - Models
    - Data:
        - Repositories
        - models (dtos)
        - Data Sources
