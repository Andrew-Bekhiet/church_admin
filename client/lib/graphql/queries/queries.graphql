subscription getAreasStream(
  $addWhere: [areas_bool_exp!] = {}
  $limit: Int = 200
) {
  areas(where: { _and: $addWhere }, order_by: { name: asc }, limit: $limit) {
    id
    name
    bounds
    color
    photoUpdatedAt
  }
}

subscription getServicesStream(
  $addWhere: [services_bool_exp!] = {}
  $groupsAddWhere: [groups_bool_exp!] = {}
  $classesAddWhere: [classes_bool_exp!] = {}
  $limit: Int = 200
) {
  services(
    where: { _and: $addWhere }
    order_by: { studyYearFrom: asc, studyYearTo: asc }
    limit: $limit
  ) {
    id
    name
    color
    photoUpdatedAt
    fromStudyYear {
      name
      order
    }
    toStudyYear {
      name
      order
    }
    classes(
      where: { _and: $classesAddWhere }
      order_by: { service: { studyYearFrom: asc, studyYearTo: asc } }
    ) {
      id
      name
      color
      photoUpdatedAt
    }
    groups(
      where: { _and: $groupsAddWhere }
      order_by: { service: { studyYearFrom: asc, studyYearTo: asc } }
    ) {
      id
      name
      color
      photoUpdatedAt
    }
  }
}

query getStudyYearName($order: smallint!) {
  study_years_by_pk(order: $order) {
    order
    name
  }
}

subscription getPersonsStream(
  $addWhere: [persons_bool_exp!] = {}
  $limit: Int = 200
) {
  persons(where: { _and: $addWhere }, order_by: { name: asc }, limit: $limit) {
    id
    name
    color
    photoUpdatedAt
  }
}

subscription getUserInfoStream($uid: uuid!) {
  users_by_pk(uid: $uid) {
    uid
    firebaseAuthUid
    email
    permissions
    person {
      id
      name
      address
      geolocation
      mainPhone
      otherPhones
      birthdate
      gender
      isShammas
      shammasLevel
      schoolId
      collegeId
      churchId
      fatherId
      isStudent
      jobId
      jobDescription
      qualificationId
      personTypeId
      stateId
      isServant
      notes
      familyId
      storeId
      studyYearId
      color
      photoUpdatedAt
      lastKodas
      lastConfession
    }
  }
}

query getPersonsAttendanceWarning($dateFilter: date!) {
  persons(
    where: { attendanceHistory: { _not: { dayId: { _gte: $dateFilter } } } }
    limit: 25
  ) {
    name
  }
}

query getPersonsKodasWarning($dateFilter: date!) {
  persons(
    where: { kodasHistory: { _not: { dayId: { _gte: $dateFilter } } } }
    limit: 25
  ) {
    name
  }
}

query getPersonsConfessionWarning($dateFilter: date!) {
  persons(
    where: { confessionHistory: { _not: { dayId: { _gte: $dateFilter } } } }
    limit: 25
  ) {
    name
  }
}

query getPersonsVisitWarning($dateFilter: timestamptz!) {
  persons(
    where: { visitHistory: { _not: { time: { _gte: $dateFilter } } } }
    limit: 25
  ) {
    name
  }
}

query getPersonsBirthday($dateFilter: String!) {
  persons(where: { birthday: { _eq: $dateFilter } }, limit: 25) {
    name
  }
}
