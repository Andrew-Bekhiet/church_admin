mutation deleteArea($areaId: uuid!) {
  deleteAreasByPk(id: $areaId) {
    ...Area
  }
}

mutation insertArea($newArea: AreasInsertInput!) {
  insertAreasOne(object: $newArea) {
    ...Area
  }
}

mutation updateArea(
  $areaId: uuid!
  $newArea: AreasSetInput!
  $lastVisit: timestamptz
  $updateLastVisit: Boolean!
) {
  updateAreasByPk(pkColumns: { id: $areaId }, _set: $newArea) {
    ...Area
  }

  insertHistoryVisitHistoryOne(
    object: { table: "areas", recordId: $areaId, time: $lastVisit }
  ) @include(if: $updateLastVisit) {
    ...VisitHistory
  }
}
