query classesForService($serviceId: uuid!) {
  classes(
    where: { serviceId: { _eq: $serviceId } }
    orderBy: [{ name: ASC }]
  ) {
    id
    name
    color
    serviceStudyYear
    serviceStudyYearTo
    serviceGender
    studyYear {
      ...StudyYear
    }
    studyYearTo {
      ...StudyYear
    }
  }
}
