subscription watchAllClasses(
  $limit: Int = 200
  $orderBy: [ClassesOrderBy!] = { name: ASC }
  $where: [ClassesBoolExp!] = {}
) {
  classes(limit: $limit, orderBy: $orderBy, where: { _and: $where }) {
    ...Class
  }
}

subscription watchClassesCount($where: [ClassesBoolExp!] = {}, $limit: Int) {
  classesAggregate(where: { _and: $where }, limit: $limit) {
    aggregate {
      count
    }
  }
}

subscription watchClass($id: uuid!) {
  classesByPk(id: $id) {
    ...Class
    service {
      ...ServiceWithStudyYears
    }
    lastEdit {
      ...LatestEditHistory
    }
    serviceGender
    studyYear {
      order
      name
    }
    adminUsers(distinctOn: uid) {
      user {
        ...User
      }
    }
  }
}
