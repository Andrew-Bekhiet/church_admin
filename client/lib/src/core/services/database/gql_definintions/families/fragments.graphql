fragment Family on Family {
  id
  name
  color
  userCanEdit
  photoUpdatedAt
  blurhash
  dataCheck {
    ...DataCheck
  }
}

fragment FamilyWithAddress on Family {
  ...Family
  status
  deceasedSpouseName
  marriageDate
  address {
    ...Address
  }
}

fragment FamilyDetails on Family {
  ...FamilyWithAddress
  church {
    id
    name
  }
  notes
  latestEdit {
    ...LatestEdit
  }
  latestVisit {
    ...LatestVisit
  }
  latestFatherVisit {
    ...LatestFatherVisit
  }
}
