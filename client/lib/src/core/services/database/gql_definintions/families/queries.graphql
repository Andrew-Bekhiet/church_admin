query families(
  $filter: FamilyFilterInput
  $sort: [FamilySortInput]
  $first: Int
  $after: String
) {
  families(filter: $filter, sort: $sort, first: $first, after: $after) {
    count
    endKeyset
    results {
      ...Family
    }
  }
}

query familiesWithAddresses(
  $filter: FamilyFilterInput
  $sort: [FamilySortInput]
  $first: Int
  $after: String
) {
  families(filter: $filter, sort: $sort, first: $first, after: $after) {
    count
    endKeyset
    results {
      ...FamilyWithAddress
    }
  }
}

query family(
  $id: ID!
  $contactsFilter: FamilyContactFilterInput
  $contactsSort: [FamilyContactSortInput]
) {
  family(id: $id) {
    ...FamilyDetails
    contacts(filter: $contactsFilter, sort: $contactsSort) {
      ...FamilyContact
    }
  }
}

query familyWithRelatives($id: ID!, $relativesSort: [FamilySortInput]) {
  family(id: $id) {
    ...Family
    children(sort: $relativesSort) {
      ...Family
    }
    parents(sort: $relativesSort) {
      ...Family
    }
  }
}
