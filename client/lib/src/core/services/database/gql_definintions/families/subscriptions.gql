subscription watchAllFamilies(
  $limit: Int = 200
  $orderBy: [FamiliesOrderBy!] = { name: ASC }
  $where: [FamiliesBoolExp!] = {}
) {
  families(limit: $limit, orderBy: $orderBy, where: { _and: $where }) {
    ...Family
  }
}

subscription watchFamiliesCount($where: [FamiliesBoolExp!] = {}, $limit: Int) {
  familiesAggregate(where: { _and: $where }, limit: $limit) {
    aggregate {
      count
    }
  }
}

subscription watchAllFamiliesWithAddresses(
  $limit: Int = 200
  $orderBy: [FamiliesOrderBy!] = { name: ASC }
  $where: [FamiliesBoolExp!] = {}
) {
  families(limit: $limit, orderBy: $orderBy, where: { _and: $where }) {
    ...Family
    address {
      ...Address
    }
    status
    deceasedSpouseName
    marriageDate
  }
}

subscription watchFamily($id: uuid!) {
  familiesByPk(id: $id) {
    ...Family
    address {
      ...Address
    }
    church {
      id
      name
    }
    status
    deceasedSpouseName
    marriageDate
    familyAdminsPhones {
      aggregatedPhones
    }
    contacts(
      where: { personType: { isFamilyAdmin: { _eq: true } } }
      orderBy: [
        { personType: { order: ASC } }
        { isMainPhone: DESC }
        { createdAt: ASC }
      ]
    ) {
      ...ResolvedContact
    }
    notes
    lastEdit {
      ...LatestEditHistory
    }
    lastVisit {
      ...LatestVisitHistory
    }
    lastFatherVisit {
      ...LatestFatherVisitHistory
    }
  }
}
