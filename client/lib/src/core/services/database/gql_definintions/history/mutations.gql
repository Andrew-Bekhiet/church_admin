        data: { day: $lastKodas }
        onConflict: { constraint: attendance_days_pkey, updateColumns: day }
      }
    }
    onConflict: { constraint: kodas_history_day_id_person_id_key }
  ) {
    person {
      ...Person
    }
  }
}

mutation insertPersonLastCall($personId: uuid!, $lastCall: timestamptz!) {
  insertHistoryCallHistoryOne(
    object: { personId: $personId, time: $lastCall }
  ) {
    person {
      ...Person
    }
  }
}

mutation insertPersonLastVisit($personId: uuid!, $lastVisit: timestamptz!) {
  insertHistoryVisitHistoryOne(
    object: { table: "persons", recordId: $personId, time: $lastVisit }
  ) {
    time
    user {
      ...User
    }
  }
}

mutation insertFamilyLastVisit(
  $familyId: uuid!
  $lastVisit: timestamptz!
  $isFatherVisit: Boolean!
) {
  insertHistoryVisitHistoryOne(
    object: {
      table: "families"
      recordId: $familyId
      time: $lastVisit
      isFatherVisit: $isFatherVisit
    }
  ) {
    time
    user {
      ...User
    }
  }
}

