query edits(
  $filter: EditFilterInput
  $sort: [EditSortInput]
  $first: Int
  $after: String
) {
  edits(filter: $filter, sort: $sort, first: $first, after: $after) {
    count
    endKeyset
    results {
      keyset
      ...Edit
    }
  }
}

