fragment Meeting on Meeting {
  id
  name
  audience
  color
  isArchived
  showKodasCheckbox
  serviceId
  serviceGender
  serviceStudyYear
  groupId
  service {
    ...MeetingService
  }
  studyYear {
    ...StudyYear
  }
  group {
    ...MeetingGroup
  }
}

fragment MeetingService on Service {
  id
  name
  color
  userCanEdit
}

fragment MeetingGroup on Group {
  id
  name
  color
  userCanEdit
}

fragment AttendanceRecord on AttendanceRecord {
  id
  meetingId
  personId
  datetime
  asServant
  recordedBy
  recordedByUser {
    ...User
  }
}

fragment RosterEntry on RosterEntry {
  id
  meetingId
  personId
  asServant
  name
  phones
  gender
  color
  studyYearId
  studyYearName
  photoUpdatedAt
  blurhash
}
