query historyMeetingRoster(
  $meetingId: uuid!
  $where: [HistoryMeetingRosterBoolExp!] = []
  $orderBy: [HistoryMeetingRosterOrderBy!] = [{ name: ASC }, { personId: ASC }]
  $limit: Int = 200
) {
  historyMeetingRoster(
    where: { meetingId: { _eq: $meetingId }, _and: $where }
    orderBy: $orderBy
    limit: $limit
  ) {
    personId
    meetingId
    name
    person {
      id
      contacts {
        phone
      }
      familyContacts(where: { personType: { isFamilyAdmin: { _eq: true } } }) {
        phone
      }
    }
    gender
    color
    studyYearId
    studyYearName
    photoUpdatedAt
    blurhash
    asServant
  }
}

# Held days live on the meeting, so they are fetched once per meeting rather
# than duplicated on every roster row. distinctOn requires matching orderBy
# columns (personId, asServant, meetingId).
query attendanceAnalysis(
  $dayFrom: date!
  $dayTo: date!
  $meetingIds: [uuid!]!
  $where: [HistoryMeetingRosterBoolExp!] = []
) {
  historyMeetings(where: { id: { _in: $meetingIds } }) {
    id
    days(
      where: { day: { _gte: $dayFrom, _lte: $dayTo } }
      orderBy: { day: ASC }
      distinctOn: [day]
    ) {
      day
    }
  }
  historyMeetingRoster(
    where: { _and: [{ meetingId: { _in: $meetingIds } }, { _and: $where }] }
    orderBy: [{ personId: ASC }, { asServant: ASC }, { meetingId: ASC }]
    distinctOn: [personId, asServant, meetingId]
  ) {
    personId
    asServant
    meetingId
    attendanceHistory(
      where: { day: { _gte: $dayFrom, _lte: $dayTo } }
      orderBy: { day: ASC }
    ) {
      id
      day
    }
  }
}

query meetingsAttendanceAnalysis(
  $dayFrom: date!
  $dayTo: date!
  $where: [HistoryMeetingsBoolExp!] = []
  $demographicsWhere: [HistoryMeetingDaysBoolExp!] = []
) {
  historyMeetings(where: { _and: $where }, orderBy: [{ name: ASC }]) {
    ...Meeting
    days(
      where: { day: { _gte: $dayFrom, _lte: $dayTo }, _and: $demographicsWhere }
      orderBy: { day: ASC }
    ) {
      day
      studyYearId
      studyYear {
        ...StudyYear
      }
      gender
      personsCount
      servantsCount
      totalCount
    }
  }
}

query meetingsRosterDemographics(
  $day: date!
  $where: [HistoryMeetingsBoolExp!] = []
  $rosterWhere: [HistoryMeetingRosterBoolExp!] = []
) {
  historyMeetingRoster(
    where: { meeting: { _and: $where }, _and: $rosterWhere }
    orderBy: [{ personId: ASC }, { asServant: ASC }, { meetingId: ASC }]
    distinctOn: [personId, asServant, meetingId]
  ) {
    personId
    asServant
    meetingId
    studyYearId
    studyYearName
    gender
    attendanceHistory(where: { day: { _eq: $day } }) {
      id
      day
    }
  }
}

query personMeetings(
  $personId: uuid!
  $where: [HistoryMeetingRosterBoolExp!] = []
) {
  historyMeetingRoster(
    where: { personId: { _eq: $personId }, _and: $where }
    orderBy: [{ asServant: ASC }, { meetingId: ASC }]
    distinctOn: [asServant, meetingId]
  ) {
    personId
    asServant
    meetingId
    meeting {
      ...Meeting
    }
  }
}
