subscription watchAllMeetings(
  $where: [HistoryMeetingsBoolExp!] = {}
  $orderBy: [HistoryMeetingsOrderBy!] = { name: ASC }
  $limit: Int = 200
) {
  historyMeetings(where: { _and: $where }, orderBy: $orderBy, limit: $limit) {
    ...Meeting
  }
}

subscription watchMeeting($id: uuid!) {
  historyMeetingsByPk(id: $id) {
    ...Meeting
  }
}

subscription watchAttendanceHistory(
  $meetingId: uuid!
  $fromDate: timestamptz!
  $toDate: timestamptz!
) {
  historyAttendanceHistory(
    where: {
      meetingId: { _eq: $meetingId }
      datetime: { _gte: $fromDate, _lt: $toDate }
    }
  ) {
    id
    meetingId
    personId
    datetime
    asServant
  }
}

# Paginated attendance records for a person within a single meeting, used to
# list the "last attended" history behind the analysis indicator.
subscription personMeetingAttendance(
  $where: [HistoryAttendanceHistoryBoolExp!] = {}
  $orderBy: [HistoryAttendanceHistoryOrderBy!] = { datetime: DESC }
  $limit: Int! = 200
) {
  historyAttendanceHistory(
    where: { _and: $where }
    orderBy: $orderBy
    limit: $limit
  ) {
    ...AttendanceHistory
  }
}
