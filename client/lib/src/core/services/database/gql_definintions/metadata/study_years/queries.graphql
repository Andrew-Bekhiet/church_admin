query studyYears(
  $filter: StudyYearFilterInput
  $sort: [StudyYearSortInput]
  $first: Int
  $after: String
) {
  studyYears(filter: $filter, sort: $sort, first: $first, after: $after) {
    count
    endKeyset
    results {
      keyset
      ...StudyYear
    }
  }
}

query studyYear($id: ID!) {
  studyYear(id: $id) {
    ...StudyYear
  }
}
