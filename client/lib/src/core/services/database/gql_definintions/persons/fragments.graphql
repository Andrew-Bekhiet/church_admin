fragment PersonNoPhoto on Person {
  id
  name
  color
  userCanEdit
}

fragment Person on Person {
  ...PersonNoPhoto
  photoUpdatedAt
  blurhash
  dataCheck {
    ...DataCheck
  }
}

fragment PersonDetails on Person {
  ...Person
  address {
    ...Address
  }
  birthdate
  classMemberships(
    limit: $classesLimit
    sort: [{ field: CLASS_NAME, order: ASC }]
  ) {
    id
    class {
      ...Class
    }
  }
  church {
    ...Church
  }
  contacts(
    sort: [
      { field: IS_MAIN_PHONE, order: DESC }
      { field: CREATED_AT, order: ASC }
    ]
  ) {
    ...Contact
  }
  college {
    ...College
  }
  family {
    ...PersonFamily
  }
  father {
    ...Father
    church {
      ...Church
    }
  }
  gender
  groupMemberships(
    limit: $groupsLimit
    sort: [{ field: GROUP_NAME, order: ASC }]
  ) {
    groupId
    group {
      ...Group
    }
  }
  isServant
  servingChurch {
    ...Church
  }
  serviceType
  isShammas
  workStatus
  job {
    ...Job
  }
  jobDescription
  latestCall {
    ...LatestCall
  }
  latestConfession {
    ...LatestConfession
  }
  latestEdit {
    ...LatestEdit
  }
  latestKodas {
    ...LatestKodas
  }
  latestVisit {
    ...LatestVisit
  }
  notes
  martialStatus
  personType {
    ...PersonType
  }
  qualification {
    ...Qualification
  }
  school {
    ...School
  }
  serviceMemberships(
    limit: $servicesLimit
    sort: [{ field: SERVICE_NAME, order: ASC }]
  ) {
    serviceId
    service {
      ...ServiceWithStudyYears
    }
  }
  shammasLevel {
    ...ShammasLevel
  }
  state {
    ...PersonState
  }
  studyYear {
    ...StudyYear
  }
  hobbies(sort: [{ field: NAME, order: ASC }]) {
    ...Hobby
  }
  tags(sort: [{ field: NAME, order: ASC }]) {
    ...Tag
  }
  uid
  user {
    ...User
  }
}

fragment PersonFamily on Family {
  id
  name
  color
  userCanEdit
  photoUpdatedAt
  blurhash
  dataCheck {
    ...DataCheck
  }
}

fragment PersonMemberships on Person {
  id
  name
  userCanEdit
  serviceMemberships(sort: [{ field: SERVICE_NAME, order: ASC }]) {
    serviceId
    service {
      ...ServiceWithStudyYears
    }
  }
  classMemberships(sort: [{ field: CLASS_NAME, order: ASC }]) {
    id
    class {
      ...Class
      service {
        ...ServiceWithStudyYears
      }
    }
  }
  groupMemberships(sort: [{ field: GROUP_NAME, order: ASC }]) {
    groupId
    group {
      ...Group
      service {
        ...ServiceWithStudyYears
      }
    }
  }
}
