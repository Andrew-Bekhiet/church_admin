query persons(
  $filter: PersonFilterInput
  $sort: [PersonSortInput]
  $first: Int
  $after: String
) {
  persons(filter: $filter, sort: $sort, first: $first, after: $after) {
    count
    endKeyset
    results {
      ...Person
    }
  }
}

query person(
  $id: ID!
  $familyContactsFilter: FamilyContactFilterInput
  $classesLimit: Int
  $groupsLimit: Int
  $servicesLimit: Int
) {
  person(id: $id) {
    ...PersonDetails
    familyContacts(
      filter: $familyContactsFilter
      sort: [
        { field: PERSON_TYPE_ORDER, order: ASC }
        { field: IS_MAIN_PHONE, order: DESC }
        { field: CREATED_AT, order: ASC }
      ]
    ) {
      ...PersonFamilyContact
    }
  }
}

query personMemberships($id: ID!) {
  person(id: $id) {
    ...PersonMemberships
  }
}

query personHistoryAnalysis(
  $id: ID!
  $callsFilter: CallFilterInput
  $visitsFilter: VisitFilterInput
  $editsFilter: EditFilterInput
  $kodasesFilter: KodasFilterInput
  $confessionsFilter: ConfessionFilterInput
  $callHistory: Boolean! = false
  $visitHistory: Boolean! = false
  $editHistory: Boolean! = false
  $confessionHistory: Boolean! = false
  $kodasHistory: Boolean! = false
) {
  person(id: $id) {
    id
    name
    userCanEdit
    callHistoryAggregate: calls(filter: $callsFilter)
      @include(if: $callHistory) {
      id
      time
    }
    visitHistoryAggregate: visits(filter: $visitsFilter)
      @include(if: $visitHistory) {
      id
      time
    }
    editHistoryAggregate: edits(filter: $editsFilter)
      @include(if: $editHistory) {
      time
    }
    kodasHistoryAggregate: kodases(filter: $kodasesFilter)
      @include(if: $kodasHistory) {
      id
      time
    }
    confessionHistoryAggregate: confessions(filter: $confessionsFilter)
      @include(if: $confessionHistory) {
      id
      time
    }
  }
}

query familyUnclaimedContacts($filter: FamilyContactFilterInput, $first: Int) {
  familyContacts(filter: $filter, first: $first) {
    results {
      ...PersonFamilyContact
    }
  }
}

query geolocatedAreas($filter: AreaFilterInput, $first: Int, $after: String) {
  areas(filter: $filter, first: $first, after: $after) {
    endKeyset
    results {
      ...AreaWithBounds
    }
  }
}

query geolocatedStreets($filter: StreetFilterInput, $first: Int, $after: String) {
  streets(filter: $filter, first: $first, after: $after) {
    endKeyset
    results {
      ...StreetWithLine
    }
  }
}

query geolocatedFamilies($filter: FamilyFilterInput, $first: Int, $after: String) {
  families(filter: $filter, first: $first, after: $after) {
    endKeyset
    results {
      ...PersonFamily
      address {
        id
        geolocation
      }
    }
  }
}

query geolocatedStores($filter: StoreFilterInput, $first: Int, $after: String) {
  stores(filter: $filter, first: $first, after: $after) {
    endKeyset
    results {
      ...Store
      address {
        id
        geolocation
      }
    }
  }
}

query geolocatedPersons($filter: PersonFilterInput, $first: Int, $after: String) {
  persons(filter: $filter, first: $first, after: $after) {
    endKeyset
    results {
      ...PersonNoPhoto
      address {
        id
        geolocation
      }
    }
  }
}
