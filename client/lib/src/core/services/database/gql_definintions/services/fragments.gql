fragment Service on Services {
  ...ServiceNoPhoto
  photoUpdatedAt
  blurhash
}

fragment ServiceWithStudyYears on Services {
  ...ServiceNoPhoto
  studyYearFrom {
    order
    name
  }
  studyYearTo {
    order
    name
  }
  photoUpdatedAt
  blurhash
}

fragment ServiceNoPhoto on Services {
  id
  name
  color
  userCanEdit
}
