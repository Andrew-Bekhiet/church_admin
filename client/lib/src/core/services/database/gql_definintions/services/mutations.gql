mutation deleteService($serviceId: Uuid!) {
  deleteServicesByPk(id: $serviceId) {
    ...Service
  }
}

mutation insertService($newService: ServicesInsertInput!) {
  insertServicesOne(object: $newService) {
    ...Service
  }
}

mutation updateService($serviceId: Uuid!, $newService: ServicesSetInput!) {
  updateServicesByPk(pkColumns: { id: $serviceId }, _set: $newService) {
    ...Service
  }
}
