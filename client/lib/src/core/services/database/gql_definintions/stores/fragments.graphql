fragment Store on Store {
  id
  name
  color
  adminFamilyId
  photoUpdatedAt
  blurhash
  userCanEdit
}

fragment StoreDetails on Store {
  ...Store
  address {
    ...Address
  }
  latestEdit {
    ...LatestEdit
  }
  adminFamily {
    ...StoreAdminFamily
  }
}

fragment StoreAdminFamily on Family {
  id
  name
  color
  userCanEdit
  photoUpdatedAt
  blurhash
  dataCheck {
    ...DataCheck
  }
}
