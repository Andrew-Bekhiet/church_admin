subscription watchAllStores(
  $limit: Int = 200
  $orderBy: [StoresOrderBy!] = { name: ASC }
  $where: [StoresBoolExp!] = {}
) {
  stores(limit: $limit, orderBy: $orderBy, where: { _and: $where }) {
    ...Store
  }
}

subscription watchStore($id: uuid!) {
  storesByPk(id: $id) {
    ...Store
    address {
      ...Address
    }
    lastEdit {
      ...LatestEditHistory
    }
    family {
      ...Family
    }
  }
}
