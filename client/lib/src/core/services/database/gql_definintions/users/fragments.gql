fragment User on AuthUsersData {
  ...UserNoPhoto
  photoUpdatedAt
  blurhash
}

fragment UserNoPhoto on AuthUsersData {
  uid
  name
  email
}

fragment UserOverview on AuthUsersData {
  ...User
  currentUserCanManageThisUser
  email
  ...UserPermissions
  person {
    ...Person
    lastKodas {
      ...LatestKodasHistory
    }
    lastConfession {
      ...LatestConfessionHistory
    }
  }
}

fragment UserDetails on AuthUsersData {
  ...UserOverview
  lastEdit {
    ...LatestEditHistory
  }
  ...UserAdminOn
}

fragment UserPermissions on AuthUsersData {
  permissions {
    permission
  }
}

fragment UserAdminOn on AuthUsersData {
  adminOn(
    orderBy: [
      { area: { name: ASC_NULLS_LAST } }
      { service: { studyYearFromId: ASC, studyYearToId: ASC } }
      { serviceStudyYear: ASC }
      { serviceGender: DESC_NULLS_FIRST }
      { service: { name: ASC_NULLS_LAST } }
      { group: { name: ASC_NULLS_LAST } }
    ]
  ) {
    permissionId
    area {
      ...Area
    }
    areaAllowExport
    areaAllowEdit
    areaAdminOnUsers
    service {
      ...Service
      studyYearFrom {
        name
        order
      }
      studyYearTo {
        name
        order
      }
    }
    serviceStudyYearData {
      name
      order
    }
    serviceGender
    serviceAllowExport
    serviceAllowEdit
    serviceAllowRecordAttendance
    serviceAllowRecordServantsAttendance
    serviceAdminOnUsers
    serviceWriteRelatedFamilies
    classes(orderBy: { name: ASC }) {
      ...Class
    }
    group {
      ...Group
    }
    groupAllowExport
    groupAllowEdit
    groupAllowRecordAttendance
    groupAllowRecordServantsAttendance
    groupAdminOnUsers
    groupWriteRelatedFamilies
  }
}

fragment AttendanceFields on AuthUsersData {
  servicesHistory: adminOn(
    where: { service: { id: { _in: $servicesIds } } }
    distinctOn: adminOnService
  ) {
    permissionId
    service {
      ...Service
    }
  }
  classesHistory: adminOn(
    where: { classes: { id: { _in: $classesIds } } }
    distinctOn: adminOnService
  ) {
    permissionId
    classes(where: { id: { _in: $classesIds } }, distinctOn: id) {
      ...Class
    }
  }
  groupsHistory: adminOn(
    where: { group: { id: { _in: $groupsIds } } }
    distinctOn: adminOnGroup
  ) {
    permissionId
    group {
      ...Group
    }
  }
}
