subscription personEditHistory(
  $personId: uuid!
  $addWhere: [HistoryEditHistoryBoolExp!] = {}
  $limit: Int = 200
) {
  historyEditHistory(
    where: {
      _and: [
        { table: { _eq: "persons" } }
        { recordId: { _eq: $personId } }
        { _and: $addWhere }
      ]
    }
    limit: $limit
    orderBy: { time: DESC }
  ) {
    time
    user {
      uid
      name
      photoUpdatedAt
    }
  }
}
