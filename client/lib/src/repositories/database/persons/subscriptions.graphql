subscription editHistory(
  $personId: uuid!
  $addWhere: [history_edit_history_bool_exp!] = {}
  $limit: Int = 200
) {
  history_edit_history(
    where: {
      _and: [
        { table: { _eq: "persons" } }
        { recordId: { _eq: $personId } }
        { _and: $addWhere }
      ]
    }
    limit: $limit
    order_by: { time: desc }
  ) {
    time
    user {
      uid
      name
      photoUpdatedAt
    }
  }
}
