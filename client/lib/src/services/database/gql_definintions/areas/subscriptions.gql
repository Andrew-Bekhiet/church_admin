subscription watchAllAreas(
  $limit: Int = 200
  $orderBy: [AreasOrderBy!] = { name: ASC }
  $where: [AreasBoolExp!] = {}
) {
  areas(limit: $limit, orderBy: $orderBy, where: { _and: $where }) {
    ...Area
    bounds
  }
}

subscription watchArea($id: Uuid!) {
  areasByPk(id: $id) {
    ...Area
    bounds
    lastEdit {
      ...EditHistory
    }
    adminUsers(distinctOn: uid) {
      user {
        ...User
      }
    }
  }
}
