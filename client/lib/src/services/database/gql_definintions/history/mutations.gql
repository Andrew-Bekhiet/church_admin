mutation insertPersonLastConfession($personId: Uuid!, $lastConfession: Date!) {
  insertHistoryConfessionHistoryOne(
    object: {
      personId: $personId
      day: {
        data: { day: $lastConfession }
        onConflict: { constraint: attendanceDaysPkey, updateColumns: day }
      }
    }
    onConflict: { constraint: confessionHistoryDayIdPersonIdKey }
  ) {
    person {
      ...Person
    }
  }
}

