subscription editHistory(
  $where: [HistoryEditHistoryBoolExp!] = {}
  $limit: Int = 200
) {
  historyEditHistory(
    where: { _and: $where }
    limit: $limit
    orderBy: { time: DESC }
  ) {
    ...EditHistory
  }
}

subscription personCallHistory(
  $personId: Uuid!
  $where: [HistoryCallHistoryBoolExp!] = {}
  $limit: Int = 200
) {
  historyCallHistory(
    where: { _and: [{ personId: { _eq: $personId } }, { _and: $where }] }
    limit: $limit
    orderBy: { time: DESC }
  ) {
    ...CallHistory
  }
}

