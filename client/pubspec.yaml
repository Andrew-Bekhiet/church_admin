    path: ../church_admin_generator
  cross_file: ^0.3.3+4
  dart_code_metrics:
    git:
      url: https://github.com/rei-codes/dart-code-metrics
      ref: f601c7ba2c4b9fdf14056ecdd8f75ccf07f88cb0
  device_info_plus_platform_interface: ^7.0.0
  file: ^6.1.4
  firebase_app_check_platform_interface: ^0.1.0
  firebase_auth_platform_interface: ^7.0.6
  firebase_core_platform_interface: ^5.0.0
  firebase_messaging_platform_interface: ^4.5.7
  flutter_launcher_icons: ^0.13.1
  flutter_test:
    sdk: flutter
  freezed: ^2.3.2
  go_router_builder: ^2.7.1
  golden_toolkit: ^0.15.0
  graphql_codegen: ^1.1.0
  hive_generator: ^2.0.0
  http: ^1.0.0
  image_cropper_platform_interface: ^6.0.3
  image_picker_platform_interface: ^2.8.0
  json_serializable: ^6.6.0
  local_auth_platform_interface: ^1.0.5
  mock_data: ^2.0.0
  mockito: ^5.4.4
  path_provider_platform_interface: ^2.1.0
  permission_handler_platform_interface: ^4.0.2
  plugin_platform_interface: ^2.1.3
  rxdart_ext: ^0.2.6
  url_launcher_platform_interface: ^2.1.2

flutter:
  uses-material-design: true
  fonts:
    - family: Hacen Algeria
      fonts:
        - asset: assets/fonts/Hacen-Algeria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Hacen-Algeria-Bd-Regular.ttf
          weight: 500
        - asset: assets/fonts/Hacen-Algeria-Hd-Regular.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf
  assets:
    - assets/Logo.png
    - assets/google_logo.png
    - assets/risen.jpg
    - assets/holyweek.jpeg
    - assets/whatsapp.png
    - assets/church-data.png
    - assets/images/

flutter_launcher_icons:
  image_path_android: "graphics/app_icon.png"
  image_path_ios: "graphics/app_icon.png"
  android: true
  ios: true
  adaptive_icon_background: "graphics/app_icon_background.png"
  adaptive_icon_foreground: "graphics/app_icon_foreground.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#E2CABF"
  web:
    generate: true
    image_path: "graphics/app_icon.png"
    background_color: "#E2CABF"
    theme_color: "#E2CABF"

flutter_native_splash:
  color: "#E2CABF"
  image: graphics/logo.png
  branding: graphics/branding.png
  branding_bottom_padding: 24

  android_gravity: center

  android_12:
    color: "#E2CABF"
    image: graphics/android12-splash.png
    branding: graphics/branding.png

  ios: true
  android: true
  web: true
