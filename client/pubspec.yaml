name: church_admin
description: A new Flutter project.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=2.17.3 <3.0.0"

dependency_overrides:
  analyzer: ">=4.2.0 <5.0.0"
  churchdata_core:
    path: ../churchdata_core

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  artemis: ^7.9.0-beta
  churchdata_core:
    path: ../churchdata_core
  cupertino_icons: ^1.0.5
  dio: ^4.0.6
  equatable: ^2.0.3
  firebase_auth: ^3.3.20
  firebase_core: ^1.18.0
  get_it: ^7.2.0
  google_sign_in: ^5.3.3
  gql: ^0.13.1
  graphql_flutter: ^5.1.1-beta.3
  http: ^0.13.4
  json_annotation: ^4.5.0
  mime: ^1.0.2
  uuid: ^3.0.6
  cloud_functions: ^3.2.17
  firebase_app_check: ^0.0.6+14
  firebase_database: ^9.0.16
  firebase_dynamic_links: ^4.2.6
  firebase_messaging: ^11.4.2
  flutter_dotenv: ^5.0.2
  freezed_annotation: ^2.0.3
  hive_flutter: ^1.1.0
  collection: ^1.16.0
  rxdart: ^0.27.4
  flutter_local_notifications: ^9.6.1
  go_router: ^4.1.0
  local_auth: ^2.1.0
  pointycastle: ^3.6.0
  flutter_secure_storage: ^5.0.2
  device_info_plus: ^4.0.0
  universal_platform: ^1.0.0+1
  tuple: ^2.0.0

dev_dependencies:
  build_runner: ^2.1.11
  churchdata_core_mocks:
    path: ../churchdata_core_mocks
  flutter_test:
    sdk: flutter
  freezed: ^2.0.3+1
  json_serializable: ^6.2.0
  mockito: ^5.2.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/Logo.png
    - assets/google_logo.png
    - assets/holyweek.jpeg
    - assets/risen.jpg
