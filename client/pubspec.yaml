flutter:
  uses-material-design: true
  fonts:
    - family: Hacen Algeria
      fonts:
        - asset: assets/fonts/Hacen-Algeria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Hacen-Algeria-Bd-Regular.ttf
          weight: 500
        - asset: assets/fonts/Hacen-Algeria-Hd-Regular.ttf
          weight: 700
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-VariableFont.ttf
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont.ttf
  assets:
    - assets/logo.png
    - assets/google_logo.png
    - assets/risen.jpg
    - assets/holyweek.jpeg
    - assets/whatsapp.png
    - assets/church-data.png
    - assets/images/

flutter_launcher_icons:
  image_path_android: "graphics/logo.png"
  image_path_ios: "graphics/logo.png"
  android: true
  ios: true
  adaptive_icon_background: "#E2CABF"
  adaptive_icon_foreground: "graphics/logo.png"
  min_sdk_android: 21
  remove_alpha_ios: true
  background_color_ios: "#E2CABF"
  web:
    generate: true
    image_path: "graphics/logo.png"
    background_color: "#E2CABF"
    theme_color: "#E2CABF"

flutter_native_splash:
  color: "#E2CABF"
  image: graphics/logo.png
  image_web: graphics/logo-original.png
  branding: graphics/branding.png
  branding_web: graphics/branding-original.png
  branding_bottom_padding: 24

  android_gravity: center

  android_12:
    color: "#E2CABF"
    image: graphics/android12-splash.png
    branding: graphics/branding.png

  ios: true
  android: true
  web: true
