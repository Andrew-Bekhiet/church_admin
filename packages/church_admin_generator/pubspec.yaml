name: church_admin_generator
description: Generates queryable field metadata and the queryables registry for church_admin models.
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

# The floor follows the client, whose gql_code_builder holds analyzer below 14;
# standalone resolution picks the newest so solid_lints 1.x can lint this package.
dependencies:
  analyzer: ">=10.0.0 <15.0.0"
  build: ^4.0.7
  church_admin_annotations:
    path: ../church_admin_annotations
  source_gen: ^4.2.4

dev_dependencies:
  solid_lints: ^1.0.0
  test: ^1.26.0
