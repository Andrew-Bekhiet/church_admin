x-postgres: &postgres
  build:
    context: ../../postgres
  environment: &postgres-environment
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: church-admin-ash-dev
    POSTGRES_DB: ${DB_NAME:-church_admin}
    PGDATA: /var/lib/postgresql/data/pgdata
  command:
    [
      "-c",
      "config_file=/etc/postgresql/postgresql.conf",
      "-c",
      "cron.database_name=${DB_NAME:-church_admin}",
    ]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${DB_NAME:-church_admin}"]
    interval: 2s
    timeout: 5s
    retries: 30

services:
  postgres:
    <<: *postgres
    ports:
      - "${DB_PORT:-55432}:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql

  postgres_test:
    <<: *postgres
    environment:
      <<: *postgres-environment
      POSTGRES_DB: ${TEST_DB_NAME:-church_admin}
    command:
      [
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "cron.database_name=${TEST_DB_NAME:-church_admin}",
      ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d ${TEST_DB_NAME:-church_admin}"]
      interval: 2s
      timeout: 5s
      retries: 30
    ports:
      - "${TEST_DB_PORT:-55433}:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql

volumes:
  pgdata_dev:
  pgdata_test:
