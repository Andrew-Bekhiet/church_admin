name: church_admin_migrator
description: Migrates data from Church Data and Meeting Helper into Church Admin
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependency_overrides:
  connectivity_plus: ^7.0.0
  js: ^0.7.1
  pointycastle: ^3.7.0
  googleapis: ^15.0.0

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  args: ^2.7.0
  equatable: ^2.0.7
  dart_firebase_admin: ^0.4.1
  logger: ^2.6.1
  church_admin:
    path: ../../client
  csv: ^6.0.0
  collection: ^1.19.1
  csvwriter: ^1.3.0
  uuid: ^4.5.1
  meta: ^1.16.0
  googleapis: ^13.2.0
  googleapis_auth: ^1.6.0
  http: ^1.2.2

dev_dependencies:
  build_runner: ^2.7.1
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  uses-material-design: true
