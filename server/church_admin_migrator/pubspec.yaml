name: church_admin_migrator
description: Migrates data from Church Data and Meeting Helper into Church Admin
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  args: ^2.7.0
  equatable: ^2.1.0
  firebase_admin_sdk: ^0.5.4
  logger: ^2.8.0
  church_admin:
    path: ../../client
  csv: ^8.0.0
  collection: ^1.19.1
  csvwriter: ^1.3.0
  uuid: ^4.6.0
  meta: ^1.18.0
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.0
  http: ^1.2.2
  google_cloud_firestore: ^0.5.3

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6

flutter:
  uses-material-design: true
