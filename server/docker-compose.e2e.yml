name: church-admin-e2e

services:
  postgres:
    healthcheck:
      start_period: 2m

  ash:
    environment:
      ACCOUNT_CLAIMING_BY_EMAIL: "false"
    healthcheck:
      start_period: 3m

  firebase-emulators:
    environment:
      FIREBASE_EMULATORS_DATA_DIR: ""
    healthcheck:
      start_period: 5m
