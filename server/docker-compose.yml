name: church-admin-local

services:
  postgres:
    build:
      context: ./postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in server/.env}
      POSTGRES_DB: church_admin
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata_ash:/var/lib/postgresql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-postgres} -d church_admin",
        ]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

  ash:
    build:
      context: ./ash
    depends_on:
      postgres:
        condition: service_healthy
      firebase-emulators:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: church_admin
      PORT: "4100"
      AUTH_MODE: emulator
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-church-admin-local}
      FIREBASE_AUTH_EMULATOR_HOST: firebase-emulators:9099
      FIREBASE_STORAGE_EMULATOR_HOST: firebase-emulators:9199
      PHOTOS_GCS_BUCKET: ${PHOTOS_GCS_BUCKET:-church-admin-local.appspot.com}
      APP_RELEASE_GCS_BUCKET: ${APP_RELEASE_GCS_BUCKET:-church-admin-local-releases}
      ACCOUNT_CLAIMING_BY_EMAIL: "true"
      ASH_SETUP_ARGS: ${ASH_SETUP_ARGS:---services}
    ports:
      - "${ASH_PORT:-8080}:4100"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:4100/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  firebase-emulators:
    build:
      context: ./firebase
      dockerfile: Dockerfile.emulators
    environment:
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-church-admin-local}
    volumes:
      - ./firebase:/srv/firebase
      - ./scripts/start-firebase-emulators.sh:/start-firebase-emulators.sh:ro
      - firebase_emulator_cache:/root/.cache/firebase
    entrypoint: ["/bin/sh", "/start-firebase-emulators.sh"]
    ports:
      - "4000:4000"
      - "4500:4500"
      - "9000:9000"
      - "9099:9099"
      - "9199:9199"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "emulators=$$(curl -fsS http://localhost:4400/emulators) && for name in auth database storage; do echo \"$$emulators\" | grep -q \"\\\"$$name\\\"\" || exit 1; done",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  pgdata_ash:
  firebase_emulator_cache:
