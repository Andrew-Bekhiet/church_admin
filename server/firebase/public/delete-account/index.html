<!DOCTYPE html>
<html dir="rtl" lang="ar">
  <body>
    <head>
      <meta
        name="google-signin-client_id"
        content="368672361986-s8qoakrc74b1s0pt334coqqbvhee86hk.apps.googleusercontent.com" />
    </head>
    <link
      type="text/css"
      rel="stylesheet"
      href="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth.css" />
    <script src="https://www.gstatic.com/firebasejs/ui/6.0.1/firebase-ui-auth__ar.js"></script>

    <script src="/__/firebase/8.10.1/firebase-app.js"></script>
    <script src="/__/firebase/8.10.1/firebase-auth.js"></script>
    <script src="/__/firebase/8.10.1/firebase-functions.js"></script>

    <script>
      fetch("/__/firebase/init.json").then(async (response) => {
        firebase.initializeApp(await response.json());

        const app = firebase.app();
        const auth = firebase.auth();

        var ui = new firebaseui.auth.AuthUI(firebase.auth());

        var uiConfig = {
          callbacks: {
            signInSuccessWithAuthResult: function (authResult, redirectUrl) {
              // Show an alert to confirm account deletion
              var confirmation = window.confirm(
                "هل أنت متأكد من حذف حسابك؟\n" +
                  authResult.user.email +
                  "\n\nسيتم حذف حساب تسجيل الدخول وصلاحياتك في التطبيق." +
                  "\nسيبقى سجلك في بيانات الكنيسة ما لم تطلب من الكنيسة حذفه عبر البريد churchadmin@andrewbekhiet.dev."
              );

              if (confirmation) {
                app
                  .functions("europe-west6")
                  .httpsCallable("deleteMyAccount")()
                  .then(() => auth.signOut())
                  .then(() => {
                    console.log("Account deleted successfully");
                    window.alert("تم حذف حسابك بنجاح.");
                  })
                  .catch((error) => {
                    window.alert("حدث خطأ ما. يرجى المحاولة مرة أخرى لاحقاً");
                    console.log(error);
                  });
              }

              return false;
            },
            uiShown: function () {
              document.getElementById("loader").style.display = "none";
            },
          },
          signInFlow: "popup",
          signInSuccessUrl: window.location.href,
          signInOptions: [
            {
              provider: firebase.auth.EmailAuthProvider.PROVIDER_ID,
              requireDisplayName: false,
            },
          ],
        };

        ui.start("#firebaseui-auth-container", uiConfig);
      });
    </script>
    <div
      style="
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
      ">
      <h1>حذف حسابك في تطبيق خدمة كنيسة السيدة العذراء مريم</h1>
      <p>قم بتسجيل الدخول وسيتم حذف حسابك من تطبيق خدمة كنيسة السيدة العذراء مريم</p>
      <div
        id="g_id_onload"
        data-client_id="496540691813-o5pv1f1t58s67affh8nlc0b194ge3pqg.apps.googleusercontent.com"
        data-callback="deleteAccount"
        data-auto_prompt="false"></div>
      <div id="firebaseui-auth-container"></div>
      <div id="loader">جار التحميل...</div>
    </div>
  </body>
</html>
