table:
  name: invitations
  schema: auth
object_relationships:
  - name: creator
    using:
      foreign_key_constraint_on: created_by
  - name: user
    using:
      foreign_key_constraint_on: user_uid
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any-user
                  - entity_id:
                      _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: user
                  - entity_id:
                      _ceq:
                        - $
                        - user_uid
      columns:
        - expires_at
        - user_uid
      set:
        created_by: X-Hasura-User-Id
select_permissions:
  - role: user
    permission:
      columns:
        - claimed_at
        - code
        - created_at
        - created_by
        - expires_at
        - id
        - user_uid
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any-user
                  - entity_id:
                      _is_null: true
          - _exists:
