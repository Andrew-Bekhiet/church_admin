              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: user
                  - entity_id:
                      _ceq:
                        - $
                        - user_uid
