table:
  name: users_admin_on
  schema: auth
object_relationships:
  - name: area
    using:
      foreign_key_constraint_on: admin_on_area
  - name: group
    using:
      foreign_key_constraint_on: admin_on_group
  - name: service
    using:
      foreign_key_constraint_on: admin_on_service
  - name: serviceStudyYearData
    using:
      manual_configuration:
        column_mapping:
          service_study_year: order
        insertion_order: null
        remote_table:
          name: study_years
          schema: public
  - name: user
    using:
      foreign_key_constraint_on: uid
array_relationships:
  - name: classes
    using:
      manual_configuration:
        column_mapping:
          service_gender: service_gender
          service_study_year: service_study_year
        insertion_order: null
        remote_table:
          name: classes
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        user:
          isUserAllowedToChange:
            _eq: true
      columns:
        - admin_on_area
        - admin_on_group
        - admin_on_service
        - area_admin_on_users
        - area_allow_edit
        - group_admin_on_users
        - group_allow_edit
        - service_admin_on_users
        - service_allow_edit
        - service_gender
        - service_study_year
        - uid
select_permissions:
  - role: user
    permission:
      columns:
        - area_admin_on_users
        - area_allow_edit
        - group_admin_on_users
        - group_allow_edit
        - service_admin_on_users
        - service_allow_edit
        - service_gender
        - service_study_year
        - admin_on_area
        - admin_on_group
        - admin_on_service
        - permission_id
        - uid
      filter:
        user:
          isUserAllowedToRead:
            _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        user:
          isUserAllowedToChange:
            _eq: true
