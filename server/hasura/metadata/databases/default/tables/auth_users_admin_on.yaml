table:
  name: users_admin_on
  schema: auth
object_relationships:
  - name: area
    using:
      foreign_key_constraint_on: admin_on_area
  - name: group
    using:
      foreign_key_constraint_on: admin_on_group
  - name: service
    using:
      foreign_key_constraint_on: admin_on_service
  - name: serviceStudyYearData
    using:
      manual_configuration:
        column_mapping:
          service_study_year: order
        insertion_order: null
        remote_table:
          name: study_years
          schema: public
  - name: user
    using:
      foreign_key_constraint_on: uid
array_relationships:
  - name: classes
    using:
      manual_configuration:
        column_mapping:
          service_gender: service_gender
          service_study_year: service_study_year
        insertion_order: null
        remote_table:
          name: classes
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - &any_user_editable
            _exists:
              _table: &permissions_view
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any-user
                  - entity_id:
                      _is_null: true
          - &user_by_uid_editable
            _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: user
                  - entity_id:
                      _ceq:
                        - $
                        - uid
      columns:
        - admin_on_area
        - admin_on_group
        - admin_on_service
        - area_admin_on_users
        - area_allow_edit
        - area_allow_export
        - group_admin_on_users
        - group_allow_edit
        - group_allow_export
        - group_allow_record_attendance
        - group_allow_record_servants_attendance
        - group_write_related_families
        - service_admin_on_users
        - service_allow_edit
        - service_allow_export
        - service_allow_record_attendance
        - service_allow_record_servants_attendance
        - service_gender
        - service_study_year
        - service_write_related_families
        - uid
select_permissions:
  - role: user
    permission:
      columns:
        - admin_on_area
        - admin_on_group
        - admin_on_service
        - area_admin_on_users
        - area_allow_edit
        - area_allow_export
        - group_admin_on_users
        - group_allow_edit
        - group_allow_export
        - group_allow_record_attendance
        - group_allow_record_servants_attendance
        - group_write_related_families
        - permission_id
        - service_admin_on_users
        - service_allow_edit
        - service_allow_export
        - service_allow_record_attendance
        - service_allow_record_servants_attendance
        - service_gender
        - service_study_year
        - service_write_related_families
        - uid
      filter:
        _or:
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any-user
                  - entity_id:
                      _is_null: true
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: user
                  - entity_id:
                      _ceq:
                        - $
                        - uid
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - *any_user_editable
          - *user_by_uid_editable
