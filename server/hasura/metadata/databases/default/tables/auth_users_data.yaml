table:
  name: users_data
  schema: auth
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          uid: recorded_by
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: person
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: persons
          schema: public
array_relationships:
  - name: adminOn
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: users_admin_on
          schema: auth
  - name: permissions
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: users_permissions
          schema: auth
select_permissions:
  - role: user
    permission:
      columns:
        - email
        - name
        - photo_updated_at
        - blurhash
        - uid
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - entity_type:
                          _eq: any-user
                      - entity_id:
                          _is_null: true
                  - _and:
                      - entity_type:
                          _eq: user
                      - entity_id:
                          _ceq:
                            - $
                            - uid
      allow_aggregations: true
