table:
  name: users_data
  schema: auth
object_relationships:
  - name: invitation
    using:
      manual_configuration:
        column_mapping:
          uid: user_uid
        insertion_order: after_parent
        remote_table:
          name: invitations
          schema: auth
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          uid: recorded_by
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: person
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: persons
          schema: public
  - name: preferences
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: users_preferences
          schema: public
array_relationships:
  - name: adminOn
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: users_admin_on
          schema: auth
  - name: fcmTokens
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: users_fcm_tokens
          schema: public
  - name: permissions
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: users_permissions
          schema: auth
computed_fields:
  - name: currentUserCanManageThisUser
    definition:
      function:
        name: user_can_edit_user
        schema: auth
      session_argument: hasura_session
    comment: ""
insert_permissions:
  - role: user
    permission:
      check:
        uid:
          _eq: X-Hasura-User-Id
      set:
        uid: x-hasura-User-Id
      columns:
        - name
        - uid
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - auth_id
        - email
        - name
        - photo_updated_at
        - blurhash
        - uid
      computed_fields:
        - currentUserCanManageThisUser
      filter:
        _or:
          - _exists:
              _table: &any_user_permissions_view
                name: users_permissions_on_any_user
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: any-user
                  - entity_id:
                      _is_null: true
          - _exists:
              _table: &user_permissions_view
                name: users_permissions_on_user
                schema: auth
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: user
                  - entity_id:
                      _ceq:
                        - $
                        - uid
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - email
        - name
      filter:
        _or:
          - uid:
              _eq: X-Hasura-User-Id
          - _or:
              - &any_user_editable
                _exists:
                  _table: *any_user_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any-user
                      - entity_id:
                          _is_null: true
              - &user_by_uid_editable
                _exists:
                  _table: *user_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: user
                      - entity_id:
                          _ceq:
                            - $
                            - uid
      check:
        _or:
          - uid:
              _eq: X-Hasura-User-Id
          - _or:
              - *any_user_editable
              - *user_by_uid_editable
    comment: ""
