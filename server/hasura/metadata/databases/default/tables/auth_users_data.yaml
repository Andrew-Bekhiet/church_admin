table:
  name: users_data
  schema: auth
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          uid: recorded_by
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: person
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: persons
          schema: public
array_relationships:
  - name: adminOn
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: users_admin_on
          schema: auth
  - name: permissions
    using:
      foreign_key_constraint_on:
        column: uid
        table:
          name: users_permissions
          schema: auth
computed_fields:
  - name: isUserAllowedToChange
    definition:
      function:
        name: user_allowed_to_change_user_data
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_user
        schema: public
      session_argument: hasura_session
select_permissions:
  - role: user
    permission:
      columns:
        - email
        - name
        - photo_updated_at
        - blurhash
        - uid
      filter:
        isUserAllowedToRead:
          _eq: true
