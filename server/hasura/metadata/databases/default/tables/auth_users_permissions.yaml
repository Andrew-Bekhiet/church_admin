table:
  name: users_permissions
  schema: auth
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: uid
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: any-user
                      - entity_id:
                          _is_null: true
                  - _and:
                      - entity_type:
                          _eq: user
                      - entity_id:
                          _ceq:
                            - $
                            - uid
      columns:
        - permission
        - uid
select_permissions:
  - role: user
    permission:
      columns:
        - permission
        - uid
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - entity_type:
                          _eq: any-user
                      - entity_id:
                          _is_null: true
                  - _and:
                      - entity_type:
                          _eq: user
                      - entity_id:
                          _ceq:
                            - $
                            - uid
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: any-user
                      - entity_id:
                          _is_null: true
                  - _and:
                      - entity_type:
                          _eq: user
                      - entity_id:
                          _ceq:
                            - $
                            - uid
