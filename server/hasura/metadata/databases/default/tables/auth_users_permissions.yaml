table:
  name: users_permissions
  schema: auth
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: uid
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - &any_user_editable
            _exists:
              _table: &any_user_permissions_view
                name: users_permissions_on_any_user
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any-user
                  - entity_id:
                      _is_null: true
          - &user_by_uid_editable
            _exists:
              _table: &user_permissions_view
                name: users_permissions_on_user
                schema: auth
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: user
                  - entity_id:
                      _ceq:
                        - $
                        - uid
      columns:
        - permission
        - uid
select_permissions:
  - role: user
    permission:
      columns:
        - permission
        - uid
      filter:
        _or:
          - _exists:
              _table: *any_user_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any-user
                  - entity_id:
                      _is_null: true
          - _exists:
              _table: *user_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: user
                  - entity_id:
                      _ceq:
                        - $
                        - uid
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - *any_user_editable
          - *user_by_uid_editable
