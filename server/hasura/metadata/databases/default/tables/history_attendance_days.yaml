table:
  name: attendance_days
  schema: history
array_relationships:
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: attendance_history
          schema: history
  - name: confessionHistory
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: confession_history
          schema: history
  - name: constraints
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: attendance_days_constraints
          schema: history
  - name: kodasHistory
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: kodas_history
          schema: history
computed_fields:
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_day
        schema: history
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - day
        - notes
select_permissions:
  - role: user
    permission:
      columns:
        - day
        - notes
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - day
        - notes
      filter:
        isUserAllowedToWrite:
          _eq: true
      check:
        isUserAllowedToWrite:
          _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        isUserAllowedToWrite:
          _eq: true
