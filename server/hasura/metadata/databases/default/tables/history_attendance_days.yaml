table:
  name: attendance_days
  schema: history
array_relationships:
  - name: confessionHistory
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: confession_history
          schema: history
  - name: kodasHistory
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: kodas_history
          schema: history
insert_permissions:
  - role: user
    permission:
      check: &approved_user
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
      columns:
        - day
select_permissions:
  - role: user
    permission:
      columns:
        - day
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - day
      filter: *approved_user
      check: *approved_user
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - *approved_user
          - _and:
              - _exists:
                  _table:
                    name: users_permissions
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - permission:
                          _eq: readAllData
              - _exists:
                  _table:
                    name: users_permissions
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - permission:
                          _eq: writeAllData
              - _exists:
                  _table:
                    name: users_permissions
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - permission:
                          _eq: deleteData
