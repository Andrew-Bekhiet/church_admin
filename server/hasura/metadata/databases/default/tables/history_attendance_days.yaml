table:
  name: attendance_days
  schema: history
array_relationships:
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: attendance_history
          schema: history
  - name: confessionHistory
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: confession_history
          schema: history
  - name: constraints
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: attendance_days_constraints
          schema: history
  - name: kodasHistory
    using:
      foreign_key_constraint_on:
        column: day_id
        table:
          name: kodas_history
          schema: history
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - day
        - notes
select_permissions:
  - role: user
    permission:
      columns:
        - day
        - notes
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - day
        - notes
      filter:
        _exists:
          _table:
            name: users_attendance_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - allow_record_attendance:
                      _eq: true
                  - allow_record_servants_attendance:
                      _eq: true
      check:
        _exists:
          _table:
            name: users_attendance_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - allow_record_attendance:
                      _eq: true
                  - allow_record_servants_attendance:
                      _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: readAllData
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
