table:
  name: attendance_days_constraints
  schema: history
object_relationships:
  - name: day
    using:
      foreign_key_constraint_on: day_id
  - name: group
    using:
      foreign_key_constraint_on: group_id
  - name: service
    using:
      foreign_key_constraint_on: service_id
  - name: studyYear
    using:
      foreign_key_constraint_on: service_study_year
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: recordHistory
          - _or:
              - _exists:
                  _table:
                    name: users_permissions
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - permission:
                          _eq: writeAllData
              - _exists:
                  _table:
                    name: users_admin_on
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - _or:
                          - _and:
                              - admin_on_group:
                                  _ceq:
                                    - $
                                    - group_id
                              - group_allow_edit:
                                  _eq: true
                          - _and:
                              - admin_on_service:
                                  _ceq:
                                    - $
                                    - service_id
                              - service_allow_edit:
                                  _eq: true
                              - _or:
                                  - service_gender:
                                      _is_null: true
                                  - service_gender:
                                      _ceq:
                                        - $
                                        - service_gender
                              - _or:
                                  - service_study_year:
                                      _is_null: true
                                  - service_study_year:
                                      _ceq:
                                        - $
                                        - service_study_year
      columns:
        - day_id
        - group_id
        - service_id
        - service_gender
        - service_study_year
select_permissions:
  - role: user
    permission:
      columns:
        - service_gender
        - day_id
        - service_study_year
        - group_id
        - id
        - service_id
      filter:
        _and:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: recordHistory
          - _or:
              - _exists:
                  _table:
                    name: users_permissions
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - permission:
                          _eq: readAllData
              - _exists:
                  _table:
                    name: users_admin_on
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - _or:
                          - _and:
                              - admin_on_group:
                                  _ceq:
                                    - $
                                    - group_id
                          - _and:
                              - admin_on_service:
                                  _ceq:
                                    - $
                                    - service_id
                              - _or:
                                  - service_gender:
                                      _is_null: true
                                  - service_gender:
                                      _ceq:
                                        - $
                                        - service_gender
                              - _or:
                                  - service_study_year:
                                      _ceq:
                                        - $
                                        - service_study_year
      allow_aggregations: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: recordHistory
          - _or:
              - _exists:
                  _table:
                    name: users_permissions
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - permission:
                          _eq: writeAllData
              - _exists:
                  _table:
                    name: users_admin_on
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - _or:
                          - _and:
                              - admin_on_group:
                                  _ceq:
                                    - $
                                    - group_id
                              - group_allow_edit:
                                  _eq: true
                          - _and:
                              - admin_on_service:
                                  _ceq:
                                    - $
                                    - service_id
                              - service_allow_edit:
                                  _eq: true
                              - _or:
                                  - service_gender:
                                      _is_null: true
                                  - service_gender:
                                      _ceq:
                                        - $
                                        - service_gender
                              - _or:
                                  - service_study_year:
                                      _is_null: true
                                  - service_study_year:
                                      _ceq:
                                        - $
                                        - service_study_year
