table:
  name: attendance_days_constraints
  schema: history
object_relationships:
  - name: day
    using:
      foreign_key_constraint_on: day_id
  - name: group
    using:
      foreign_key_constraint_on: group_id
  - name: service
    using:
      foreign_key_constraint_on: service_id
  - name: studyYear
    using:
      foreign_key_constraint_on: service_study_year
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: recordAllAttendance
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: recordAllServantsAttendance
          - _exists:
              _table:
                name: users_attendance_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - allow_record_attendance:
                          _eq: true
                      - allow_record_servants_attendance:
                          _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
                      - _and:
                          - entity_type:
                              _eq: group
                          - entity_id:
                              _ceq:
                                - $
                                - group_id
                      - _and:
                          - entity_type:
                              _eq: service
                          - entity_id:
                              _ceq:
                                - $
                                - service_id
                          - _or:
                              - service_study_year:
                                  _is_null: true
                              - service_study_year:
                                  _ceq:
                                    - $
                                    - service_study_year
                          - _or:
                              - service_gender:
                                  _is_null: true
                              - service_gender:
                                  _ceq:
                                    - $
                                    - service_gender
      columns:
        - day_id
        - group_id
        - service_id
        - service_gender
        - service_study_year
select_permissions:
  - role: user
    permission:
      columns:
        - service_gender
        - day_id
        - service_study_year
        - group_id
        - id
        - service_id
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: readAllData
          - _exists:
              _table:
                name: users_admin_on
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - _and:
                          - admin_on_group:
                              _ceq:
                                - $
                                - group_id
                      - _and:
                          - admin_on_service:
                              _ceq:
                                - $
                                - service_id
                          - _or:
                              - service_gender:
                                  _is_null: true
                              - service_gender:
                                  _ceq:
                                    - $
                                    - service_gender
                          - _or:
                              - service_study_year:
                                  _is_null: true
                              - service_study_year:
                                  _ceq:
                                    - $
                                    - service_study_year
      allow_aggregations: true
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_attendance_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - allow_record_attendance:
                          _eq: true
                      - allow_record_servants_attendance:
                          _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
                      - _and:
                          - entity_type:
                              _eq: group
                          - entity_id:
                              _ceq:
                                - $
                                - group_id
                      - _and:
                          - entity_type:
                              _eq: service
                          - entity_id:
                              _ceq:
                                - $
                                - service_id
                          - _or:
                              - service_study_year:
                                  _is_null: true
                              - service_study_year:
                                  _ceq:
                                    - $
                                    - service_study_year
                          - _or:
                              - service_gender:
                                  _is_null: true
                              - service_gender:
                                  _ceq:
                                    - $
                                    - service_gender
