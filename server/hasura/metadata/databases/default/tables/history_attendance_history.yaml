table:
  name: attendance_history
  schema: history
object_relationships:
  - name: class
    using:
      manual_configuration:
        column_mapping:
          service_gender: service_gender
          service_id: service_id
          service_study_year: service_study_year
        insertion_order: null
        remote_table:
          name: classes
          schema: public
  - name: day
    using:
      foreign_key_constraint_on: day_id
  - name: group
    using:
      foreign_key_constraint_on: group_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: recordedByUser
    using:
      foreign_key_constraint_on: recorded_by
  - name: service
    using:
      foreign_key_constraint_on: service_id
  - name: studyYear
    using:
      foreign_key_constraint_on: service_study_year
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _or:
              - _and:
                  - as_admin:
                      _eq: false
                  - _exists:
                      _table:
                        name: users_attendance_permissions
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - allow_record_attendance:
                              _eq: true
                          - _or:
                              - _and:
                                  - entity_type:
                                      _eq: any
                                  - entity_id:
                                      _is_null: true
                              - _and:
                                  - entity_type:
                                      _eq: service
                                  - entity_id:
                                      _ceq:
                                        - $
                                        - service_id
                                  - _or:
                                      - service_study_year:
                                          _is_null: true
                                      - service_study_year:
                                          _ceq:
                                            - $
                                            - service_study_year
                                  - _or:
                                      - service_gender:
                                          _is_null: true
                                      - service_gender:
                                          _ceq:
                                            - $
                                            - service_gender
                              - _and:
                                  - entity_type:
                                      _eq: group
                                  - entity_id:
                                      _ceq:
                                        - $
                                        - group_id
                  - _or:
                      - _and:
                          - group_id:
                              _is_null: false
                          - _exists:
                              _table:
                                name: persons_groups
                                schema: public
                              _where:
                                _and:
                                  - person_id:
                                      _ceq:
                                        - $
                                        - person_id
                                  - group_id:
                                      _ceq:
                                        - $
                                        - group_id
                      - _and:
                          - group_id:
                              _is_null: true
                          - _exists:
                              _table:
                                name: persons_services
                                schema: public
                              _where:
                                _and:
                                  - person_id:
                                      _ceq:
                                        - $
                                        - person_id
                                  - service_id:
                                      _ceq:
                                        - $
                                        - service_id
              - _and:
                  - as_admin:
                      _eq: true
                  - _exists:
                      _table:
                        name: users_attendance_permissions
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - allow_record_servants_attendance:
                              _eq: true
                          - _or:
                              - _and:
                                  - entity_type:
                                      _eq: any
                                  - entity_id:
                                      _is_null: true
                              - _and:
                                  - entity_type:
                                      _eq: service
                                  - entity_id:
                                      _ceq:
                                        - $
                                        - service_id
                                  - _or:
                                      - service_study_year:
                                          _is_null: true
                                      - service_study_year:
                                          _ceq:
                                            - $
                                            - service_study_year
                                  - _or:
                                      - service_gender:
                                          _is_null: true
                                      - service_gender:
                                          _ceq:
                                            - $
                                            - service_gender
                              - _and:
                                  - entity_type:
                                      _eq: group
                                  - entity_id:
                                      _ceq:
                                        - $
                                        - group_id
                  - _exists:
                      _table:
                        name: users_attendance_permissions
                        schema: auth
                      _where:
                        _and:
                          - user_person_id:
                              _ceq:
                                - $
                                - person_id
                          - _or:
                              - _and:
                                  - entity_type:
                                      _eq: any
                                  - entity_id:
                                      _is_null: true
                              - _and:
                                  - entity_type:
                                      _eq: service
                                  - entity_id:
                                      _ceq:
                                        - $
                                        - service_id
                                  - _or:
                                      - service_study_year:
                                          _is_null: true
                                      - service_study_year:
                                          _ceq:
                                            - $
                                            - service_study_year
                                  - _or:
                                      - service_gender:
                                          _is_null: true
                                      - service_gender:
                                          _ceq:
                                            - $
                                            - service_gender
                              - _and:
                                  - entity_type:
                                      _eq: group
                                  - entity_id:
                                      _ceq:
                                        - $
                                        - group_id
      set:
        recorded_by: x-hasura-user-id
      columns:
        - as_admin
        - day_id
        - group_id
        - person_id
        - service_gender
        - service_id
        - service_study_year
        - time
select_permissions:
  - role: user
    permission:
      columns:
        - as_admin
        - day_id
        - group_id
        - id
        - person_id
        - recorded_by
        - service_gender
        - service_id
        - service_study_year
        - time
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: readAllData
          - _and:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - _and:
                          - entity_type:
                              _eq: person
                          - entity_id:
                              _ceq:
                                - $
                                - person_id
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - _or:
                          - _and:
                              - entity_type:
                                  _eq: service
                              - entity_id:
                                  _ceq:
                                    - $
                                    - service_id
                          - _and:
                              - entity_type:
                                  _eq: group
                              - entity_id:
                                  _ceq:
                                    - $
                                    - group_id
      allow_aggregations: true
