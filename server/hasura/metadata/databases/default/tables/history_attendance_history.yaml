table:
  name: attendance_history
  schema: history
object_relationships:
  - name: meeting
    using:
      foreign_key_constraint_on: meeting_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: recordedByUser
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      check: &check_record_attendance_permission
        _and:
          - _exists:
              _table:
                name: meeting_roster
                schema: history
              _where:
                _and:
                  - meeting_id:
                      _ceq:
                        - $
                        - meeting_id
                  - person_id:
                      _ceq:
                        - $
                        - person_id
                  - as_servant:
                      _ceq:
                        - $
                        - as_servant
          - _or:
              - _and:
                  - as_servant:
                      _eq: false
                  - _exists:
                      _table:
                        name: users_admin_on_meetings
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - allow_record_attendance:
                              _eq: true
                          - meeting_id:
                              _ceq:
                                - $
                                - meeting_id
              - _and:
                  - as_servant:
                      _eq: true
                  - _exists:
                      _table:
                        name: users_admin_on_meetings
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - allow_record_servants_attendance:
                              _eq: true
                          - meeting_id:
                              _ceq:
                                - $
                                - meeting_id
      set:
        recorded_by: x-hasura-user-id
      columns:
        - as_servant
        - datetime
        - meeting_id
        - person_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - as_servant
        - datetime
        - day
        - meeting_id
        - person_id
        - recorded_by
      filter:
        _and:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: approved
          - _or:
              - _exists:
                  _table:
                    name: users_permissions
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - permission:
                          _eq: readAllData
              - _and:
                  - _exists:
                      _table:
                        name: users_permissions_by_entity_id
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - _and:
                              - entity_type:
                                  _eq: person
                              - entity_id:
                                  _ceq:
                                    - $
                                    - person_id
                  - _exists:
                      _table:
                        name: users_admin_on_meetings
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - meeting_id:
                              _ceq:
                                - $
                                - meeting_id
              - _and:
                  - as_servant:
                      _eq: true
                  - _exists:
                      _table:
                        name: users_admin_on_meetings
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - meeting_id:
                              _ceq:
                                - $
                                - meeting_id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - datetime
      filter: *check_record_attendance_permission
      check: *check_record_attendance_permission
delete_permissions:
  - role: user
    permission:
      filter: *check_record_attendance_permission
