table:
  name: attendance_history
  schema: history
object_relationships:
  - name: meeting
    using:
      foreign_key_constraint_on: meeting_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: recordedByUser
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      # Two independent concerns, AND-ed together:
      #   1. Eligibility -- (person, as_servant) is on the roster for the
      #      meeting. `history.meeting_roster` is the single source of truth the
      #      UI also reads, so "what is shown" == "what is recordable"; it
      #      already encodes audience, is_archived, membership/scope and the
      #      `approved` servant gate, so none of those are repeated here.
      #   2. Authorization -- the recorder holds the matching record permission
      #      on the meeting (`allow_record_attendance` for served,
      #      `allow_record_servants_attendance` for servants).
      check: &check_record_attendance_permission
        _and:
          - _exists:
              _table:
                name: meeting_roster
                schema: history
              _where:
                _and:
                  - meeting_id:
                      _ceq:
                        - $
                        - meeting_id
                  - person_id:
                      _ceq:
                        - $
                        - person_id
                  - as_servant:
                      _ceq:
                        - $
                        - as_servant
          - _or:
              - _and:
                  - as_servant:
                      _eq: false
                  - _exists:
                      _table:
                        name: users_admin_on_meetings
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - allow_record_attendance:
                              _eq: true
                          - meeting_id:
                              _ceq:
                                - $
                                - meeting_id
              - _and:
                  - as_servant:
                      _eq: true
                  - _exists:
                      _table:
                        name: users_admin_on_meetings
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - allow_record_servants_attendance:
                              _eq: true
                          - meeting_id:
                              _ceq:
                                - $
                                - meeting_id
      set:
        recorded_by: x-hasura-user-id
      columns:
        - as_servant
        - datetime
        - meeting_id
        - person_id
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - as_servant
        - datetime
        - day
        - meeting_id
        - person_id
        - recorded_by
      # Servant rows are gated only on being an admin of the meeting, mirroring
      # meeting_roster: servant admins usually hold no person-entity grant over
      # fellow servants.
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: readAllData
          - _and:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - _and:
                          - entity_type:
                              _eq: person
                          - entity_id:
                              _ceq:
                                - $
                                - person_id
              - _exists:
                  _table:
                    name: users_admin_on_meetings
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - meeting_id:
                          _ceq:
                            - $
                            - meeting_id
          - _and:
              - as_servant:
                  _eq: true
              - _exists:
                  _table:
                    name: users_admin_on_meetings
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - meeting_id:
                          _ceq:
                            - $
                            - meeting_id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - datetime
      filter: *check_record_attendance_permission
      check: *check_record_attendance_permission
delete_permissions:
  - role: user
    permission:
      filter: *check_record_attendance_permission
