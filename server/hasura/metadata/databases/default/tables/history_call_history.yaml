table:
  name: call_history
  schema: history
object_relationships:
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table: &person_permissions_view
                name: users_permissions_on_person
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - person_id
          - _exists:
              _table: &any_permissions_view
                name: users_permissions_on_any
                schema: auth
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      columns:
        - person_id
        - time
select_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - time
        - recorded_by
      filter:
        _or:
          - _exists:
              _table: *person_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - person_id
          - _exists:
              _table: *any_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      allow_aggregations: true
