table:
  name: call_history
  schema: history
object_relationships:
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      columns:
        - person_id
        - time
select_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - time
        - recorded_by
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      allow_aggregations: true
