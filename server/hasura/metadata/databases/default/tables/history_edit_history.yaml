table:
  name: edit_history
  schema: history
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
select_permissions:
  - role: user
    permission:
      columns:
        - record_id
        - table
        - time
        - recorded_by
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
                  - _and:
                      - table:
                          _ceq:
                            - $
                            - table
                      - entity_id:
                          _ceq:
                            - $
                            - record_id
      allow_aggregations: true
