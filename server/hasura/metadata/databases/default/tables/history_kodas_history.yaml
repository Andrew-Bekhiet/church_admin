table:
  name: kodas_history
  schema: history
object_relationships:
  - name: day
    using:
      foreign_key_constraint_on: day_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      check:
        person:
          isUserAllowedToWrite:
            _eq: true
      columns:
        - day_id
        - person_id
select_permissions:
  - role: user
    permission:
      columns:
        - day_id
        - id
        - person_id
        - recorded_by
        - time
      filter:
        person:
          isUserAllowedToRead:
            _eq: true
      allow_aggregations: true
