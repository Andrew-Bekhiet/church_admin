table:
  name: kodas_history
  schema: history
object_relationships:
  - name: day
    using:
      foreign_key_constraint_on: day_id
  - name: meeting
    using:
      foreign_key_constraint_on: meeting_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      check: &check_record_kodas_permission
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: person
                          - entity_id:
                              _ceq:
                                - $
                                - person_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
          - _and:
              - meeting:
                  show_kodas_checkbox:
                    _eq: true
              - _or:
                  - _and:
                      - _exists:
                          _table:
                            name: meeting_roster
                            schema: history
                          _where:
                            _and:
                              - meeting_id:
                                  _ceq:
                                    - $
                                    - meeting_id
                              - person_id:
                                  _ceq:
                                    - $
                                    - person_id
                              - as_servant:
                                  _eq: false
                      - _exists:
                          _table:
                            name: users_admin_on_meetings
                            schema: auth
                          _where:
                            _and:
                              - uid:
                                  _eq: X-Hasura-User-Id
                              - allow_record_attendance:
                                  _eq: true
                              - meeting_id:
                                  _ceq:
                                    - $
                                    - meeting_id
                  - _and:
                      - _exists:
                          _table:
                            name: meeting_roster
                            schema: history
                          _where:
                            _and:
                              - meeting_id:
                                  _ceq:
                                    - $
                                    - meeting_id
                              - person_id:
                                  _ceq:
                                    - $
                                    - person_id
                              - as_servant:
                                  _eq: true
                      - _exists:
                          _table:
                            name: users_admin_on_meetings
                            schema: auth
                          _where:
                            _and:
                              - uid:
                                  _eq: X-Hasura-User-Id
                              - allow_record_servants_attendance:
                                  _eq: true
                              - meeting_id:
                                  _ceq:
                                    - $
                                    - meeting_id
      columns:
        - day_id
        - meeting_id
        - person_id
select_permissions:
  - role: user
    permission:
      columns:
        - day_id
        - id
        - meeting_id
        - person_id
        - recorded_by
        - time
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: person
                          - entity_id:
                              _ceq:
                                - $
                                - person_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
          - _exists:
              _table:
                name: users_admin_on_meetings
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - meeting_id:
                      _ceq:
                        - $
                        - meeting_id
      allow_aggregations: true
delete_permissions:
  - role: user
    permission:
      filter: *check_record_kodas_permission
