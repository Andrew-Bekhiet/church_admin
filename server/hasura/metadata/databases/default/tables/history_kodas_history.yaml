table:
  name: kodas_history
  schema: history
object_relationships:
  - name: day
    using:
      foreign_key_constraint_on: day_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: fingerprint_sync
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: users_data
                schema: auth
              _where:
                _and:
                  - uid:
                      _ceq:
                        - $
                        - recorded_by
                  - user_type:
                      _eq: fingerprint_bot
          - _exists:
              _table:
                name: persons
                schema: public
              _where:
                _and:
                  - id:
                      _ceq:
                        - $
                        - person_id
                  - deleted_at:
                      _is_null: true
      columns:
        - day_id
        - person_id
        - recorded_by
  - role: user
    permission:
      check: &check_edit_person_kodas_permission
        _or:
          - &person_by_person_id_editable
            _exists:
              _table: &permissions_view
                name: users_permissions_by_entity_id_cache
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - person_id
          - &all_data_editable
            _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      columns:
        - day_id
        - person_id
select_permissions:
  - role: user
    permission:
      columns:
        - day_id
        - id
        - person_id
        - recorded_by
        - time
      filter:
        _or:
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - person_id
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      allow_aggregations: true
delete_permissions:
  - role: user
    permission:
      filter: *check_edit_person_kodas_permission
