table:
  name: meeting_roster
  schema: history
object_relationships:
  - name: meeting
    using:
      manual_configuration:
        column_mapping:
          meeting_id: id
        insertion_order: null
        remote_table:
          name: meetings
          schema: history
  - name: person
    using:
      manual_configuration:
        column_mapping:
          person_id: id
        insertion_order: null
        remote_table:
          name: persons
          schema: public
array_relationships:
  - name: attendanceHistory
    using:
      manual_configuration:
        column_mapping:
          as_servant: as_servant
          meeting_id: meeting_id
          person_id: person_id
        insertion_order: null
        remote_table:
          name: attendance_history
          schema: history
select_permissions:
  - role: user
    permission:
      columns:
        - meeting_id
        - person_id
        - as_servant
        - name
        - gender
        - study_year_id
        - study_year_name
        - color
        - photo_updated_at
        - blurhash
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: readAllData
          - _and:
              - _exists:
                  _table:
                    name: users_admin_on_meetings
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - meeting_id:
                          _ceq:
                            - $
                            - meeting_id
              - _or:
                  - as_servant:
                      _eq: true
                  - _exists:
                      _table:
                        name: users_admin_on
                        schema: auth
                      _where:
                        _and:
                          - uid:
                              _eq: X-Hasura-User-Id
                          - _or:
                              - _and:
                                  - admin_on_group:
                                      _is_null: false
                                  - admin_on_group:
                                      _ceq:
                                        - $
                                        - group_id
                              - _and:
                                  - admin_on_service:
                                      _is_null: false
                                  - admin_on_service:
                                      _ceq:
                                        - $
                                        - service_id
                                  - _or:
                                      - service_study_year:
                                          _is_null: true
                                      - service_study_year:
                                          _ceq:
                                            - $
                                            - study_year_id
                                  - _or:
                                      - service_gender:
                                          _is_null: true
                                      - service_gender:
                                          _ceq:
                                            - $
                                            - gender
      allow_aggregations: true
