table:
  name: visit_history
  schema: history
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table: &any_permissions_view
                name: users_permissions_on_any
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _and:
              - table:
                  _eq: persons
              - _exists:
                  _table: &person_permissions_view
                    name: users_permissions_on_person
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - &editable
                        allow_edit:
                          _eq: true
                      - &same_record
                        entity_id:
                          _ceq:
                            - $
                            - record_id
                      - entity_type:
                          _eq: person
          - _and:
              - table:
                  _eq: families
              - _exists:
                  _table: &family_permissions_view
                    name: users_permissions_on_family
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - *editable
                      - *same_record
                      - entity_type:
                          _eq: family
          - _and:
              - table:
                  _eq: users
              - _exists:
                  _table: &user_permissions_view
                    name: users_permissions_on_user
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - *editable
                      - *same_record
                      - entity_type:
                          _eq: user
          - _and:
              - table:
                  _eq: services
              - _exists:
                  _table: &service_permissions_view
                    name: users_permissions_on_service
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - *editable
                      - *same_record
                      - entity_type:
                          _eq: service
          - _and:
              - table:
                  _eq: classes
              - _exists:
                  _table: &class_permissions_view
                    name: users_permissions_on_class
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - *editable
                      - *same_record
                      - entity_type:
                          _eq: class
          - _and:
              - table:
                  _eq: groups
              - _exists:
                  _table: &group_permissions_view
                    name: users_permissions_on_group
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - *editable
                      - *same_record
                      - entity_type:
                          _eq: group
          - _and:
              - table:
                  _eq: areas
              - _exists:
                  _table: &area_permissions_view
                    name: users_permissions_on_area
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - *editable
                      - *same_record
                      - entity_type:
                          _eq: area
          - _and:
              - table:
                  _eq: streets
              - _exists:
                  _table: &street_permissions_view
                    name: users_permissions_on_street
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - *editable
                      - *same_record
                      - entity_type:
                          _eq: street
          - _and:
              - table:
                  _eq: stores
              - _exists:
                  _table: &store_permissions_view
                    name: users_permissions_on_store
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - *editable
                      - *same_record
                      - entity_type:
                          _eq: store
      set:
        recorded_by: x-hasura-user-id
      columns:
        - is_father_visit
        - record_id
        - table
        - time
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - is_father_visit
        - record_id
        - recorded_by
        - table
        - time
        - visit_id
      filter:
        _or:
          - _exists:
              _table: *any_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _and:
              - table:
                  _eq: persons
              - _exists:
                  _table: *person_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - &same_record_2
                        entity_id:
                          _ceq:
                            - $
                            - record_id
                      - entity_type:
                          _eq: person
          - _and:
              - table:
                  _eq: families
              - _exists:
                  _table: *family_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - *same_record_2
                      - entity_type:
                          _eq: family
          - _and:
              - table:
                  _eq: users
              - _exists:
                  _table: *user_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - *same_record_2
                      - entity_type:
                          _eq: user
          - _and:
              - table:
                  _eq: services
              - _exists:
                  _table: *service_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - *same_record_2
                      - entity_type:
                          _eq: service
          - _and:
              - table:
                  _eq: classes
              - _exists:
                  _table: *class_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - *same_record_2
                      - entity_type:
                          _eq: class
          - _and:
              - table:
                  _eq: groups
              - _exists:
                  _table: *group_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - *same_record_2
                      - entity_type:
                          _eq: group
          - _and:
              - table:
                  _eq: areas
              - _exists:
                  _table: *area_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - *same_record_2
                      - entity_type:
                          _eq: area
          - _and:
              - table:
                  _eq: streets
              - _exists:
                  _table: *street_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - *same_record_2
                      - entity_type:
                          _eq: street
          - _and:
              - table:
                  _eq: stores
              - _exists:
                  _table: *store_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - *same_record_2
                      - entity_type:
                          _eq: store
      allow_aggregations: true
