table:
  name: visit_history
  schema: history
object_relationships:
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      check:
        person:
          isUserAllowedToWrite:
            _eq: true
      columns:
        - person_id
        - time
select_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - time
        - recorded_by
      filter:
        person:
          isUserAllowedToRead:
            _eq: true
      allow_aggregations: true
