table:
  name: visit_history
  schema: history
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table: &permissions_view
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - table:
                      _ceq:
                        - $
                        - table
                  - entity_id:
                      _ceq:
                        - $
                        - record_id
      set:
        recorded_by: x-hasura-user-id
      columns:
        - is_father_visit
        - record_id
        - table
        - time
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - is_father_visit
        - record_id
        - recorded_by
        - table
        - time
        - visit_id
      filter:
        _or:
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - table:
                      _ceq:
                        - $
                        - table
                  - entity_id:
                      _ceq:
                        - $
                        - record_id
      allow_aggregations: true
