table:
  name: visit_history
  schema: history
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: recorded_by
computed_fields:
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_visit
        schema: history
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_visit
        schema: history
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        isUserAllowedToWrite:
          _eq: true
      set:
        recorded_by: x-hasura-User-Id
      columns:
        - record_id
        - table
        - time
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - record_id
        - recorded_by
        - table
        - time
        - visit_id
      filter:
        isUserAllowedToRead:
          _eq: true
      allow_aggregations: true
