table:
  name: fingerprint_sync_status
  schema: operations
insert_permissions:
  - role: fingerprint_sync
    permission:
      check: {}
      columns:
        - last_synced_at
select_permissions:
  - role: fingerprint_sync
    permission:
      columns:
        - last_synced_at
      filter: {}
  - role: user
    permission:
      columns:
        - last_synced_at
      filter:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
update_permissions:
  - role: fingerprint_sync
    permission:
      columns:
        - last_synced_at
      filter: {}
      check: {}
