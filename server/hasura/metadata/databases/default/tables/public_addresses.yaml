table:
  name: addresses
  schema: public
object_relationships:
  - name: area
    using:
      foreign_key_constraint_on: area_id
  - name: district
    using:
      foreign_key_constraint_on: district_id
  - name: family
    using:
      foreign_key_constraint_on: family_id
  - name: store
    using:
      foreign_key_constraint_on: store_id
  - name: street
    using:
      foreign_key_constraint_on: street_id
computed_fields:
  - name: fullAddressText
    definition:
      function:
        name: address_full_address_text
        schema: public
    comment: ""
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - apartment_number
        - area_id
        - country_iso_code
        - district_id
        - family_id
        - geolocation
        - house_code
        - house_number
        - special_landmark
        - store_id
        - storey_number
        - street_id
        - substreet_name
    comment: ""
select_permissions:
  - role: user
    permission:
      columns:
        - apartment_number
        - area_id
        - country_iso_code
        - district_id
        - family_id
        - geolocation
        - house_code
        - house_number
        - id
        - special_landmark
        - store_id
        - storey_number
        - street_id
        - substreet_name
      computed_fields:
        - fullAddressText
      filter:
        _or:
          - _exists:
              _table: &family_permissions_view
                name: users_permissions_on_family
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: family
                  - entity_id:
                      _ceq:
                        - $
                        - family_id
          - _exists:
              _table: &store_permissions_view
                name: users_permissions_on_store
                schema: auth
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: store
                  - entity_id:
                      _ceq:
                        - $
                        - store_id
          - _exists:
              _table: &any_permissions_view
                name: users_permissions_on_any
                schema: auth
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      limit: 100
    comment: ""
update_permissions:
  - role: user
    permission:
      columns:
        - apartment_number
        - area_id
        - country_iso_code
        - district_id
        - family_id
        - geolocation
        - house_code
        - house_number
        - special_landmark
        - store_id
        - storey_number
        - street_id
        - substreet_name
      filter: &can_edit_address
        _or:
          - _or:
              - &family_by_family_id_editable
                _exists:
                  _table: *family_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - family_id
              - &store_by_store_id_editable
                _exists:
                  _table: *store_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: store
                      - entity_id:
                          _ceq:
                            - $
                            - store_id
              - &all_data_editable
                _exists:
                  _table: *any_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - family:
              persons:
                _and:
                  - deleted_at:
                      _is_null: true
                  - permissionGrants:
                      _and:
                        - uid:
                            _eq: X-Hasura-User-Id
                        - allow_edit:
                            _eq: true
                        - entity_type:
                            _eq: person
      check: *can_edit_address
    comment: ""
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - *family_by_family_id_editable
          - *store_by_store_id_editable
          - *all_data_editable
    comment: ""
