table:
  name: areas
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
array_relationships:
  - name: adminUsers
    using:
      foreign_key_constraint_on:
        column: admin_on_area
        table:
          name: users_admin_on
          schema: auth
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
computed_fields:
  - name: families
    definition:
      function:
        name: area_families
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_area
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_area
        schema: public
      session_argument: hasura_session
  - name: persons
    definition:
      function:
        name: area_persons
        schema: public
      session_argument: hasura_session
  - name: stores
    definition:
      function:
        name: area_stores
        schema: public
      session_argument: hasura_session
  - name: streets
    definition:
      function:
        name: area_streets
        schema: public
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        isUserAllowedToWrite:
          _eq: true
      columns:
        - bounds
        - color
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - blurhash
        - bounds
        - color
        - id
        - name
        - photo_updated_at
      filter:
        isUserAllowedToRead:
          _eq: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - bounds
        - color
        - name
      filter:
        isUserAllowedToWrite:
          _eq: true
      check:
        isUserAllowedToWrite:
          _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        isUserAllowedToWrite:
          _eq: true
