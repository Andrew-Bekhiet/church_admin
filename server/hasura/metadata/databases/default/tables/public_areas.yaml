table:
  name: areas
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
array_relationships:
  - name: addresses
    using:
      foreign_key_constraint_on:
        column: area_id
        table:
          name: addresses
          schema: public
  - name: adminUsers
    using:
      foreign_key_constraint_on:
        column: admin_on_area
        table:
          name: users_admin_on
          schema: auth
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: streets
    using:
      foreign_key_constraint_on:
        column: area_id
        table:
          name: areas_streets
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: writeAllData
      columns:
        - bounds
        - color
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - blurhash
        - bounds
        - color
        - id
        - name
        - photo_updated_at
      filter:
        deleted_at:
          _is_null: true
      limit: 200
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - bounds
        - color
        - name
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: area
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      check:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: area
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: writeAllData
