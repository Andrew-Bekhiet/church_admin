table:
  name: areas_streets
  schema: public
object_relationships:
  - name: area
    using:
      foreign_key_constraint_on: area_id
  - name: street
    using:
      foreign_key_constraint_on: street_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _or:
              - &area_by_area_id_editable
                _exists:
                  _table:
                    name: users_permissions_on_area
                    schema: auth
                  _where:
                    _and:
                      - &requesting_user
                        uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: area
                      - entity_id:
                          _ceq:
                            - $
                            - area_id
              - &all_data_editable
                _exists:
                  _table:
                    name: users_permissions_on_any
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - &street_by_street_id_editable
                _exists:
                  _table:
                    name: users_permissions_on_street
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: street
                      - entity_id:
                          _ceq:
                            - $
                            - street_id
              - *all_data_editable
      columns:
        - area_id
        - street_id
select_permissions:
  - role: user
    permission:
      columns:
        - area_id
        - street_id
      filter: {}
update_permissions:
  - role: user
    permission:
      columns: []
      filter: {}
      check: {}
      backend_only: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _or:
              - *area_by_area_id_editable
              - *all_data_editable
          - _or:
              - *street_by_street_id_editable
              - *all_data_editable
