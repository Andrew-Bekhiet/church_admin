table:
  name: areas_streets
  schema: public
object_relationships:
  - name: area
    using:
      foreign_key_constraint_on: area_id
  - name: street
    using:
      foreign_key_constraint_on: street_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _or:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: area
                      - entity_id:
                          _ceq:
                            - $
                            - area_id
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: street
                      - entity_id:
                          _ceq:
                            - $
                            - street_id
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      columns:
        - area_id
        - street_id
select_permissions:
  - role: user
    permission:
      columns:
        - area_id
        - street_id
      filter: {}
update_permissions:
  - role: user
    permission:
      columns: []
      filter: {}
      check: {}
      backend_only: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _or:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: area
                      - entity_id:
                          _ceq:
                            - $
                            - area_id
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: street
                      - entity_id:
                          _ceq:
                            - $
                            - street_id
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
