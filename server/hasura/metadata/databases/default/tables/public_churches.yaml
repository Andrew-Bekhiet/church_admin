table:
  name: churches
  schema: public
array_relationships:
  - name: fathers
    using:
      foreign_key_constraint_on:
        column: church_id
        table:
          name: fathers
          schema: public
  - name: persons
    using:
      foreign_key_constraint_on:
        column: church_id
        table:
          name: persons
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        is_hidden: "true"
      columns:
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - is_hidden
        - name
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter: {}
