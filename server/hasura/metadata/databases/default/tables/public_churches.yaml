table:
  name: churches
  schema: public
array_relationships:
  - name: fathers
    using:
      foreign_key_constraint_on:
        column: church_id
        table:
          name: fathers
          schema: public
  - name: persons
    using:
      foreign_key_constraint_on:
        column: church_id
        table:
          name: persons
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
      set:
        is_hidden: "true"
      columns:
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - is_hidden
        - name
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
      check:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
