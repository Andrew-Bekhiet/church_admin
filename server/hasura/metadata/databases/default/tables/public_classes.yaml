table:
  name: classes
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: service
    using:
      foreign_key_constraint_on: service_id
  - name: studyYear
    using:
      foreign_key_constraint_on: service_study_year
  - name: studyYearTo
    using:
      foreign_key_constraint_on: service_study_year_to
array_relationships:
  - name: adminUsers
    using:
      manual_configuration:
        column_mapping:
          service_gender: service_gender
          service_id: admin_on_service
          service_study_year: service_study_year
        insertion_order: null
        remote_table:
          name: users_admin_on
          schema: auth
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: meetings
    using:
      manual_configuration:
        column_mapping:
          service_gender: service_gender
          service_id: service_id
          service_study_year: service_study_year
        insertion_order: null
        remote_table:
          name: meetings
          schema: history
  - name: persons
    using:
      manual_configuration:
        column_mapping:
          id: class_id
        insertion_order: null
        remote_table:
          name: classes_persons
          schema: public
computed_fields:
  - name: userCanEdit
    definition:
      function:
        name: user_can_edit_class
        schema: auth
      session_argument: hasura_session
    comment: ""
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - &service_by_service_id_editable
            _exists:
              _table:
                name: users_permissions_on_service
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: service
                  - allow_edit:
                      _eq: true
                  - entity_id:
                      _ceq:
                        - $
                        - service_id
      columns:
        - color
        - name
        - service_gender
        - service_id
        - service_study_year
        - service_study_year_to
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
        - photo_updated_at
        - blurhash
        - service_id
        - service_study_year
        - service_study_year_to
        - service_gender
      computed_fields:
        - userCanEdit
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _or:
              - _exists:
                  _table: &class_permissions_view
                    name: users_permissions_on_class
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: class
                      - entity_id:
                          _ceq:
                            - $
                            - id
              - _exists:
                  _table: &any_permissions_view
                    name: users_permissions_on_any
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
        - service_id
        - service_study_year
        - service_study_year_to
        - service_gender
      filter:
        _or:
          - &class_by_id_editable
            _exists:
              _table: *class_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: class
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - &all_data_editable
            _exists:
              _table: *any_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      check:
        _or:
          - *class_by_id_editable
          - *all_data_editable
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
          - *service_by_service_id_editable
