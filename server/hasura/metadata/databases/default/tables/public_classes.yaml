table:
  name: classes
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: service
    using:
      foreign_key_constraint_on: service_id
  - name: studyYear
    using:
      foreign_key_constraint_on: service_study_year
array_relationships:
  - name: adminUsers
    using:
      manual_configuration:
        column_mapping:
          service_gender: service_gender
          service_id: admin_on_service
          service_study_year: service_study_year
        insertion_order: null
        remote_table:
          name: users_admin_on
          schema: auth
  - name: attendanceDaysConstraints
    using:
      manual_configuration:
        column_mapping:
          service_gender: service_gender
          service_id: service_id
          service_study_year: service_study_year
        insertion_order: null
        remote_table:
          name: attendance_days_constraints
          schema: history
  - name: attendanceHistory
    using:
      manual_configuration:
        column_mapping:
          service_gender: service_gender
          service_id: service_id
          service_study_year: service_study_year
        insertion_order: null
        remote_table:
          name: attendance_history
          schema: history
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: persons
    using:
      manual_configuration:
        column_mapping:
          id: class_id
        insertion_order: null
        remote_table:
          name: classes_persons
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: service
                  - allow_edit:
                      _eq: true
                  - entity_id:
                      _ceq:
                        - $
                        - service_id
      columns:
        - color
        - name
        - service_gender
        - service_id
        - service_study_year
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
        - photo_updated_at
        - blurhash
        - service_id
        - service_study_year
        - service_gender
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: class
                          - entity_id:
                              _ceq:
                                - $
                                - id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
        - photo_updated_at
        - blurhash
        - service_id
        - service_study_year
        - service_gender
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: class
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      check:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: class
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: service
                  - allow_edit:
                      _eq: true
                  - entity_id:
                      _ceq:
                        - $
                        - service_id
