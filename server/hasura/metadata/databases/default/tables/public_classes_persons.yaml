table:
  name: classes_persons
  schema: public
object_relationships:
  - name: class
    using:
      manual_configuration:
        column_mapping:
          class_id: id
        insertion_order: null
        remote_table:
          name: classes
          schema: public
  - name: person
    using:
      manual_configuration:
        column_mapping:
          person_id: id
        insertion_order: null
        remote_table:
          name: persons
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - class_id
        - person_id
      filter:
        _and:
          - _or:
              - _exists:
                  _table: &permissions_view
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - &requesting_user
                        uid:
                          _eq: X-Hasura-User-Id
                      - entity_type:
                          _eq: class
                      - entity_id:
                          _ceq:
                            - $
                            - class_id
              - &all_data_readable
                _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
              - *all_data_readable
