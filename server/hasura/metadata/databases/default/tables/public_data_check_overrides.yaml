table:
  name: data_check_overrides
  schema: public
insert_permissions:
  - role: user
    permission:
      check: &family_editable_with_change_data_checks
        _and:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: changeDataChecks
          - _or:
              - _exists:
                  _table: &permissions_view
                    name: users_permissions_by_entity_id_cache
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - family_id
      set:
        updated_by: x-hasura-User-Id
      columns:
        - family_id
        - is_complete
select_permissions:
  - role: user
    permission:
      columns:
        - family_id
        - is_complete
        - updated_by
      filter:
        _or:
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: family
                  - entity_id:
                      _ceq:
                        - $
                        - family_id
update_permissions:
  - role: user
    permission:
      columns:
        - is_complete
      filter: *family_editable_with_change_data_checks
      check: *family_editable_with_change_data_checks
      set:
        updated_by: x-hasura-User-Id
delete_permissions:
  - role: user
    permission:
      filter: *family_editable_with_change_data_checks
