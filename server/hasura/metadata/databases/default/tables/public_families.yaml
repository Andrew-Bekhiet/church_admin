table:
  name: families
  schema: public
object_relationships:
  - name: address
    using:
      foreign_key_constraint_on:
        column: family_id
        table:
          name: addresses
          schema: public
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
array_relationships:
  - name: children
    using:
      foreign_key_constraint_on:
        column: parent_family_id
        table:
          name: families_families
          schema: public
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: parents
    using:
      foreign_key_constraint_on:
        column: child_family_id
        table:
          name: families_families
          schema: public
  - name: persons
    using:
      manual_configuration:
        column_mapping:
          id: family_id
        insertion_order: null
        remote_table:
          name: persons
          schema: public
  - name: stores
    using:
      foreign_key_constraint_on:
        column: admin_family
        table:
          name: stores
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - address_text
        - color
        - deceased_spouse_name
        - geolocation
        - name
        - notes
        - status
select_permissions:
  - role: user
    permission:
      columns:
        - address_text
        - blurhash
        - color
        - deceased_spouse_name
        - geolocation
        - id
        - name
        - notes
        - photo_updated_at
        - status
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
      limit: 200
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - address_text
        - color
        - deceased_spouse_name
        - geolocation
        - name
        - notes
        - status
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
      check:
        _or:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: writeAllData
