table:
  name: families
  schema: public
object_relationships:
  - name: address
    using:
      foreign_key_constraint_on:
        column: family_id
        table:
          name: addresses
          schema: public
  - name: church
    using:
      foreign_key_constraint_on: church_id
  - name: familyAdminsPhones
    using:
      manual_configuration:
        column_mapping:
          id: family_id
        insertion_order: null
        remote_table:
          name: families_admins_phones
          schema: public
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: lastFatherVisit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_father_visits
          schema: history
  - name: lastVisit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_visits
          schema: history
array_relationships:
  - name: children
    using:
      foreign_key_constraint_on:
        column: parent_family_id
        table:
          name: families_families
          schema: public
  - name: contacts
    using:
      manual_configuration:
        column_mapping:
          id: effective_family_id
        insertion_order: null
        remote_table:
          name: resolved_contacts
          schema: public
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: parents
    using:
      foreign_key_constraint_on:
        column: child_family_id
        table:
          name: families_families
          schema: public
  - name: permissionGrants
    using:
      manual_configuration:
        column_mapping:
          id: entity_id
        insertion_order: null
        remote_table:
          name: users_permissions_on_family
          schema: auth
  - name: persons
    using:
      manual_configuration:
        column_mapping:
          id: family_id
        insertion_order: null
        remote_table:
          name: persons
          schema: public
  - name: stores
    using:
      foreign_key_constraint_on:
        column: admin_family
        table:
          name: stores
          schema: public
  - name: unclaimedContacts
    using:
      foreign_key_constraint_on:
        column: family_id
        table:
          name: contacts
          schema: public
  - name: visitHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: visit_history
          schema: history
computed_fields:
  - name: insertedInCurrentTransaction
    definition:
      function:
        name: family_inserted_in_current_transaction
        schema: public
  - name: userCanEdit
    definition:
      function:
        name: user_can_edit_family
        schema: auth
      session_argument: hasura_session
    comment: ""
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - church_id
        - color
        - deceased_spouse_name
        - marriage_date
        - name
        - notes
        - status
select_permissions:
  - role: user
    permission:
      columns:
        - blurhash
        - church_id
        - color
        - deceased_spouse_name
        - id
        - marriage_date
        - name
        - notes
        - photo_updated_at
        - status
      computed_fields:
        - userCanEdit
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _or:
              - _or:
                  - _exists:
                      _table: &family_permissions_view
                        name: users_permissions_on_family
                        schema: auth
                      _where:
                        _and:
                          - &requesting_user
                            uid:
                              _eq: X-Hasura-User-Id
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - id
                  - _exists:
                      _table: &any_permissions_view
                        name: users_permissions_on_any
                        schema: auth
                      _where:
                        _and:
                          - *requesting_user
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - church_id
        - color
        - deceased_spouse_name
        - marriage_date
        - name
        - notes
        - status
      filter:
        _or:
          - &family_by_id_editable
            _exists:
              _table: *family_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: family
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - &all_data_editable
            _exists:
              _table: *any_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      check:
        _or:
          - *family_by_id_editable
          - *all_data_editable
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
