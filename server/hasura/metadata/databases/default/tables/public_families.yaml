table:
  name: families
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
array_relationships:
  - name: children
    using:
      foreign_key_constraint_on:
        column: parent_family_id
        table:
          name: families_families
          schema: public
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: parents
    using:
      foreign_key_constraint_on:
        column: child_family_id
        table:
          name: families_families
          schema: public
  - name: persons
    using:
      manual_configuration:
        column_mapping:
          id: family_id
        insertion_order: null
        remote_table:
          name: persons
          schema: public
  - name: stores
    using:
      foreign_key_constraint_on:
        column: admin_family
        table:
          name: stores
          schema: public
computed_fields:
  - name: areas
    definition:
      function:
        name: family_areas
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_family
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_family
        schema: public
      session_argument: hasura_session
  - name: streets
    definition:
      function:
        name: family_streets
        schema: public
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - isUserAllowedToWrite:
              _eq: true
      columns:
        - address
        - color
        - geolocation
        - name
        - notes
select_permissions:
  - role: user
    permission:
      columns:
        - address
        - blurhash
        - color
        - geolocation
        - id
        - name
        - notes
        - photo_updated_at
      filter:
        _and:
          - isUserAllowedToRead:
              _eq: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - address
        - color
        - geolocation
        - name
        - notes
      filter:
        _and:
          - isUserAllowedToWrite:
              _eq: true
      check:
        _and:
          - isUserAllowedToWrite:
              _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - isUserAllowedToWrite:
              _eq: true
