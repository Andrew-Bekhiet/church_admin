table:
  name: families_admins_phones
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - family_id
        - aggregated_phones
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - family_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
      limit: 1
