table:
  name: families_families
  schema: public
object_relationships:
  - name: child
    using:
      foreign_key_constraint_on: child_family_id
  - name: parent
    using:
      foreign_key_constraint_on: parent_family_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _or:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - child_family_id
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
