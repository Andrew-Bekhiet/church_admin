table:
  name: families_families
  schema: public
object_relationships:
  - name: child
    using:
      foreign_key_constraint_on: child_family_id
  - name: parent
    using:
      foreign_key_constraint_on: parent_family_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - child_family_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - parent_family_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
      columns:
        - child_family_id
        - parent_family_id
select_permissions:
  - role: user
    permission:
      columns:
        - parent_family_id
        - child_family_id
      filter:
        _and:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - child_family_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - parent_family_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns: []
      filter:
        rel_id:
          _is_null: true
      check:
        rel_id:
          _is_null: true
      backend_only: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - child_family_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - parent_family_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
