table:
  name: families_families
  schema: public
object_relationships:
  - name: child
    using:
      foreign_key_constraint_on: child_family_id
  - name: parent
    using:
      foreign_key_constraint_on: parent_family_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - parent:
              isUserAllowedToWrite:
                _eq: true
          - child:
              isUserAllowedToWrite:
                _eq: true
      columns:
        - child_family_id
        - parent_family_id
select_permissions:
  - role: user
    permission:
      columns:
        - parent_family_id
        - child_family_id
      filter:
        _and:
          - parent:
              isUserAllowedToRead:
                _eq: true
          - child:
              isUserAllowedToRead:
                _eq: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - parent_family_id
        - child_family_id
      filter:
        _and:
          - parent:
              isUserAllowedToWrite:
                _eq: true
          - child:
              isUserAllowedToWrite:
                _eq: true
      check:
        _and:
          - parent:
              isUserAllowedToWrite:
                _eq: true
          - child:
              isUserAllowedToWrite:
                _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - parent:
              isUserAllowedToWrite:
                _eq: true
          - child:
              isUserAllowedToWrite:
                _eq: true
