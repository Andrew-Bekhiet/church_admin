table:
  name: families_families
  schema: public
object_relationships:
  - name: child
    using:
      foreign_key_constraint_on: child_family_id
  - name: parent
    using:
      foreign_key_constraint_on: parent_family_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _or:
              - &family_by_child_family_id_editable
                _exists:
                  _table: &family_permissions_view
                    name: users_permissions_on_family
                    schema: auth
                  _where:
                    _and:
                      - &requesting_user
                        uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - child_family_id
              - &all_data_editable
                _exists:
                  _table: &any_permissions_view
                    name: users_permissions_on_any
                    schema: auth
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - &family_by_parent_family_id_editable
                _exists:
                  _table: *family_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - parent_family_id
              - *all_data_editable
      columns:
        - child_family_id
        - parent_family_id
select_permissions:
  - role: user
    permission:
      columns:
        - parent_family_id
        - child_family_id
      filter:
        _and:
          - _or:
              - _exists:
                  _table: *family_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - child_family_id
              - &all_data_readable
                _exists:
                  _table: *any_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - _exists:
                  _table: *family_permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - parent_family_id
              - *all_data_readable
update_permissions:
  - role: user
    permission:
      columns: []
      filter:
        rel_id:
          _is_null: true
      check:
        rel_id:
          _is_null: true
      backend_only: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _or:
              - *family_by_child_family_id_editable
              - *all_data_editable
          - _or:
              - *family_by_parent_family_id_editable
              - *all_data_editable
