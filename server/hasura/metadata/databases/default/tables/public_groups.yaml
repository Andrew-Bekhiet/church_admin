table:
  name: groups
  schema: public
object_relationships:
  - name: defaultMeeting
    using:
      foreign_key_constraint_on: default_meeting_id
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: service
    using:
      foreign_key_constraint_on: service_id
array_relationships:
  - name: adminUsers
    using:
      foreign_key_constraint_on:
        column: admin_on_group
        table:
          name: users_admin_on
          schema: auth
  - name: editHistroy
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: meetings
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: meetings
          schema: history
  - name: persons
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: persons_groups
          schema: public
computed_fields:
  - name: userCanEdit
    definition:
      function:
        name: user_can_edit_group
        schema: auth
      session_argument: hasura_session
    comment: ""
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _exists:
              _table: &permissions_view
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: service
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - &all_data_editable
            _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      columns:
        - color
        - name
        - service_id
        - validity
        - default_meeting_id
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
        - photo_updated_at
        - blurhash
        - service_id
        - validity
        - default_meeting_id
      computed_fields:
        - userCanEdit
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _or:
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: group
                      - entity_id:
                          _ceq:
                            - $
                            - id
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
        - service_id
        - validity
        - default_meeting_id
      filter:
        _or:
          - *all_data_editable
          - &group_by_id_editable
            _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: group
                  - entity_id:
                      _ceq:
                        - $
                        - id
      check:
        _or:
          - *all_data_editable
          - *group_by_id_editable
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
          - _or:
              - *all_data_editable
              - *group_by_id_editable
