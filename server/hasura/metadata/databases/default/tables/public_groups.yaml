table:
  name: groups
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: service
    using:
      foreign_key_constraint_on: service_id
array_relationships:
  - name: adminUsers
    using:
      foreign_key_constraint_on:
        column: admin_on_group
        table:
          name: users_admin_on
          schema: auth
  - name: attendanceDaysConstraints
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: attendance_days_constraints
          schema: history
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: attendance_history
          schema: history
  - name: editHistroy
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: persons
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: persons_groups
          schema: public
computed_fields:
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_group
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_group
        schema: public
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        isUserAllowedToWrite:
          _eq: true
      columns:
        - color
        - name
        - service_id
        - validity
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
        - photo_updated_at
        - blurhash
        - service_id
        - validity
      filter:
        isUserAllowedToRead:
          _eq: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
        - service_id
        - validity
      filter:
        isUserAllowedToWrite:
          _eq: true
      check:
        isUserAllowedToWrite:
          _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        isUserAllowedToWrite:
          _eq: true
