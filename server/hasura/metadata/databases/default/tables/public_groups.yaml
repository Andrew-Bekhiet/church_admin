table:
  name: groups
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: service
    using:
      foreign_key_constraint_on: service_id
array_relationships:
  - name: adminUsers
    using:
      foreign_key_constraint_on:
        column: admin_on_group
        table:
          name: users_admin_on
          schema: auth
  - name: attendanceDaysConstraints
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: attendance_days_constraints
          schema: history
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: attendance_history
          schema: history
  - name: editHistroy
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: persons
    using:
      foreign_key_constraint_on:
        column: group_id
        table:
          name: persons_groups
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - entity_type:
                  _eq: group
      columns:
        - color
        - name
        - service_id
        - validity
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
        - photo_updated_at
        - blurhash
        - service_id
        - validity
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: group
                  - entity_id:
                      _ceq:
                        - $
                        - id
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
        - service_id
        - validity
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: group
                  - entity_id:
                      _ceq:
                        - $
                        - id
      check:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: group
                  - entity_id:
                      _ceq:
                        - $
                        - id
delete_permissions:
  - role: user
    permission:
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - entity_type:
                      _eq: group
                  - entity_id:
                      _ceq:
                        - $
                        - id
