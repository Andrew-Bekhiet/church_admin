table:
  name: person_types
  schema: public
array_relationships:
  - name: persons
    using:
      foreign_key_constraint_on:
        column: person_type_id
        table:
          name: persons
          schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      set:
        is_family_admin: "false"
        is_hidden: "true"
      columns:
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - is_family_admin
        - is_hidden
        - name
        - order
      filter: {}
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter: {}
      check: null
delete_permissions:
  - role: user
    permission:
      filter: {}
