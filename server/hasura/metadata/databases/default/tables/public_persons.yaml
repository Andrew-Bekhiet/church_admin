table:
  name: persons
  schema: public
object_relationships:
  - name: address
    using:
      manual_configuration:
        column_mapping:
          family_id: family_id
        insertion_order: null
        remote_table:
          name: addresses
          schema: public
  - name: church
    using:
      foreign_key_constraint_on: church_id
  - name: college
    using:
      foreign_key_constraint_on: college_id
  - name: family
    using:
      foreign_key_constraint_on: family_id
  - name: father
    using:
      foreign_key_constraint_on: father_id
  - name: job
    using:
      foreign_key_constraint_on: job_id
  - name: lastCall
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: latest_calls
          schema: history
  - name: lastConfession
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: latest_confessions
          schema: history
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: lastKodas
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: latest_kodases
          schema: history
  - name: lastVisit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_visits
          schema: history
  - name: mainContact
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_main_contacts
          schema: public
  - name: personType
    using:
      foreign_key_constraint_on: person_type_id
  - name: qualification
    using:
      foreign_key_constraint_on: qualification_id
  - name: school
    using:
      foreign_key_constraint_on: school_id
  - name: servingChurch
    using:
      foreign_key_constraint_on: serving_church_id
  - name: shammasLevel
    using:
      foreign_key_constraint_on: shammas_level_id
  - name: state
    using:
      foreign_key_constraint_on: state_id
  - name: store
    using:
      foreign_key_constraint_on: store_id
  - name: studyYear
    using:
      foreign_key_constraint_on: study_year_id
  - name: user
    using:
      foreign_key_constraint_on: uid
array_relationships:
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: attendance_history
          schema: history
  - name: callHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: call_history
          schema: history
  - name: classes
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: classes_persons
          schema: public
  - name: contacts
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: contacts
          schema: public
  - name: confessionHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: confession_history
          schema: history
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: familyContacts
    using:
      manual_configuration:
        column_mapping:
          family_id: effective_family_id
        insertion_order: null
        remote_table:
          name: resolved_contacts
          schema: public
  - name: groups
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_groups
          schema: public
  - name: hobbies
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: persons_hobbies
          schema: public
  - name: kodasHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: kodas_history
          schema: history
  - name: permissionGrants
    using:
      manual_configuration:
        column_mapping:
          id: entity_id
        insertion_order: null
        remote_table:
          name: users_permissions_by_entity_id
          schema: auth
  - name: services
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_services
          schema: public
  - name: tags
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_tags
          schema: public
  - name: visitHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: visit_history
          schema: history
computed_fields:
  - name: birthday
    definition:
      function:
        name: get_person_birthday
        schema: public
  - name: insertedInCurrentTransaction
    definition:
      function:
        name: person_inserted_in_current_transaction
        schema: public
  - name: userCanEdit
    definition:
      function:
        name: user_can_edit_person
        schema: auth
      session_argument: hasura_session
    comment: ""
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - uid:
              _is_null: true
          - uid:
              _eq: X-Hasura-User-Id
      columns:
        - birthdate
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - martial_status
        - name
        - national_id
        - notes
        - other_phones
        - person_type_id
        - qualification_id
        - school_id
        - service_type
        - serving_church_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
        - uid
        - work_status
select_permissions:
  - role: user
    permission:
      columns:
        - birthdate
        - blurhash
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - id
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - martial_status
        - name
        - national_id
        - notes
        - other_phones
        - person_type_id
        - photo_updated_at
        - qualification_id
        - school_id
        - service_type
        - serving_church_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
        - uid
        - work_status
      computed_fields:
        - birthday
        - userCanEdit
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _or:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - id
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - birthdate
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - martial_status
        - name
        - national_id
        - notes
        - other_phones
        - person_type_id
        - qualification_id
        - school_id
        - service_type
        - serving_church_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
        - uid
        - work_status
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      check:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _or:
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - id
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
