table:
  name: persons
  schema: public
object_relationships:
  - name: church
    using:
      foreign_key_constraint_on: church_id
  - name: college
    using:
      foreign_key_constraint_on: college_id
  - name: family
    using:
      foreign_key_constraint_on: family_id
  - name: father
    using:
      foreign_key_constraint_on: father_id
  - name: job
    using:
      foreign_key_constraint_on: job_id
  - name: personType
    using:
      foreign_key_constraint_on: person_type_id
  - name: qualification
    using:
      foreign_key_constraint_on: qualification_id
  - name: school
    using:
      foreign_key_constraint_on: school_id
  - name: shammasLevel
    using:
      foreign_key_constraint_on: shammas_level_id
  - name: state
    using:
      foreign_key_constraint_on: state_id
  - name: studyYear
    using:
      foreign_key_constraint_on: study_year_id
  - name: user
    using:
      foreign_key_constraint_on: uid
array_relationships:
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: attendance_history
          schema: history
  - name: callHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: call_history
          schema: history
  - name: confessionHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: confession_history
          schema: history
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: groups
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_groups
          schema: public
  - name: kodasHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: kodas_history
          schema: history
  - name: services
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_services
          schema: public
  - name: tags
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_tags
          schema: public
  - name: visitHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: visit_history
          schema: history
computed_fields:
  - name: areas
    definition:
      function:
        name: person_areas
        schema: public
      session_argument: hasura_session
  - name: birthday
    definition:
      function:
        name: get_person_birthday
        schema: public
  - name: classes
    definition:
      function:
        name: get_person_classes
        schema: public
      session_argument: hasura_session
    comment: ""
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_person
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_person
        schema: public
      session_argument: hasura_session
  - name: lastAttendance
    definition:
      function:
        name: get_person_last_attendance
        schema: history
  - name: lastCall
    definition:
      function:
        name: get_person_last_call
        schema: history
      session_argument: hasura_session
  - name: lastConfession
    definition:
      function:
        name: get_person_last_confession
        schema: history
      session_argument: hasura_session
  - name: lastEdit
    definition:
      function:
        name: get_person_last_edit
        schema: history
      session_argument: hasura_session
  - name: lastKodas
    definition:
      function:
        name: get_person_last_kodas
        schema: history
      session_argument: hasura_session
  - name: lastVisit
    definition:
      function:
        name: get_person_last_visit
        schema: history
      session_argument: hasura_session
  - name: streets
    definition:
      function:
        name: person_streets
        schema: public
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _and:
              - uid:
                  _eq: null
          - isUserAllowedToWrite:
              _eq: true
      columns:
        - address
        - birthdate
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - geolocation
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - name
        - notes
        - other_phones
        - person_type_id
        - qualification_id
        - school_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
select_permissions:
  - role: user
    permission:
      columns:
        - address
        - birthdate
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - geolocation
        - id
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - name
        - notes
        - other_phones
        - person_type_id
        - photo_updated_at
        - qualification_id
        - school_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
        - uid
      computed_fields:
        - birthday
        - lastAttendance
        - lastCall
        - lastConfession
        - lastEdit
        - lastKodas
        - lastVisit
      filter:
        isUserAllowedToRead:
          _eq: true
update_permissions:
  - role: user
    permission:
      columns:
        - address
        - birthdate
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - geolocation
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - name
        - notes
        - other_phones
        - person_type_id
        - qualification_id
        - school_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
      filter:
        _and:
          - _and:
              - uid:
                  _eq: null
          - isUserAllowedToWrite:
              _eq: true
      check:
        _and:
          - _and:
              - uid:
                  _eq: null
          - isUserAllowedToWrite:
              _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _and:
              - uid:
                  _eq: null
          - isUserAllowedToWrite:
              _eq: true
