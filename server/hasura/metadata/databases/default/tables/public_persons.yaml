table:
  name: persons
  schema: public
object_relationships:
  - name: address
    using:
      manual_configuration:
        column_mapping:
          family_id: family_id
        insertion_order: null
        remote_table:
          name: addresses
          schema: public
  - name: church
    using:
      foreign_key_constraint_on: church_id
  - name: college
    using:
      foreign_key_constraint_on: college_id
  - name: family
    using:
      foreign_key_constraint_on: family_id
  - name: father
    using:
      foreign_key_constraint_on: father_id
  - name: job
    using:
      foreign_key_constraint_on: job_id
  - name: lastCall
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: latest_calls
          schema: history
  - name: lastConfession
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: latest_confessions
          schema: history
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: lastKodas
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: latest_kodases
          schema: history
  - name: lastVisit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_visits
          schema: history
  - name: personType
    using:
      foreign_key_constraint_on: person_type_id
  - name: qualification
    using:
      foreign_key_constraint_on: qualification_id
  - name: school
    using:
      foreign_key_constraint_on: school_id
  - name: shammasLevel
    using:
      foreign_key_constraint_on: shammas_level_id
  - name: state
    using:
      foreign_key_constraint_on: state_id
  - name: studyYear
    using:
      foreign_key_constraint_on: study_year_id
  - name: user
    using:
      foreign_key_constraint_on: uid
array_relationships:
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: attendance_history
          schema: history
  - name: callHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: call_history
          schema: history
  - name: classes
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: classes_persons
          schema: public
  - name: confessionHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: confession_history
          schema: history
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: groups
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_groups
          schema: public
  - name: hobbies
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: persons_hobbies
          schema: public
  - name: kodasHistory
    using:
      foreign_key_constraint_on:
        column: person_id
        table:
          name: kodas_history
          schema: history
  - name: services
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_services
          schema: public
  - name: tags
    using:
      manual_configuration:
        column_mapping:
          id: person_id
        insertion_order: null
        remote_table:
          name: persons_tags
          schema: public
  - name: visitHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: visit_history
          schema: history
computed_fields:
  - name: birthday
    definition:
      function:
        name: get_person_birthday
        schema: public
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - address_text
        - birthdate
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - geolocation
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - name
        - notes
        - other_phones
        - person_type_id
        - qualification_id
        - school_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
select_permissions:
  - role: user
    permission:
      columns:
        - address_text
        - birthdate
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - geolocation
        - id
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - name
        - notes
        - other_phones
        - person_type_id
        - photo_updated_at
        - blurhash
        - qualification_id
        - school_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
        - uid
      computed_fields:
        - birthday
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - address_text
        - birthdate
        - church_id
        - college_id
        - color
        - family_id
        - father_id
        - gender
        - geolocation
        - is_servant
        - is_shammas
        - is_student
        - job_description
        - job_id
        - main_phone
        - name
        - notes
        - other_phones
        - person_type_id
        - qualification_id
        - school_id
        - shammas_level_id
        - state_id
        - store_id
        - study_year_id
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      check:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: writeAllData
