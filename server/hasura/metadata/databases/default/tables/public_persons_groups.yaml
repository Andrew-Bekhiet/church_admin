table:
  name: persons_groups
  schema: public
object_relationships:
  - name: group
    using:
      foreign_key_constraint_on: group_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - _or:
              - &person_by_person_id_editable
                _exists:
                  _table: &permissions_view
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - &requesting_user
                        uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
              - &all_data_editable
                _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - &group_by_group_id_editable
                _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: group
                      - entity_id:
                          _ceq:
                            - $
                            - group_id
              - *all_data_editable
      columns:
        - group_id
        - person_id
select_permissions:
  - role: user
    permission:
      columns:
        - group_id
        - person_id
      filter:
        _and:
          - _or:
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
              - &all_data_readable
                _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: group
                      - entity_id:
                          _ceq:
                            - $
                            - group_id
              - *all_data_readable
      limit: 100
update_permissions:
  - role: user
    permission:
      columns: []
      filter: {}
      check: {}
      backend_only: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _or:
              - *person_by_person_id_editable
              - *all_data_editable
          - _or:
              - *group_by_group_id_editable
              - *all_data_editable
