table:
  name: persons_hobbies
  schema: public
object_relationships:
  - name: hobby
    using:
      foreign_key_constraint_on: hobby_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      columns:
        - hobby_id
        - person_id
select_permissions:
  - role: user
    permission:
      columns:
        - hobby_id
        - person_id
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      limit: 100
update_permissions:
  - role: user
    permission:
      columns: []
      filter:
