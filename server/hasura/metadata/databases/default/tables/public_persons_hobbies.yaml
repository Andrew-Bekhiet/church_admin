table:
  name: persons_hobbies
  schema: public
object_relationships:
  - name: hobby
    using:
      foreign_key_constraint_on: hobby_id
  - name: person
    using:
      foreign_key_constraint_on: person_id
insert_permissions:
  - role: user
    permission:
      check: &can_edit_person
        _or:
          - &person_by_person_id_editable
            _exists:
              _table: &permissions_view
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - person_id
          - &all_data_editable
            _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      columns:
        - hobby_id
        - person_id
select_permissions:
  - role: user
    permission:
      columns:
        - hobby_id
        - person_id
      filter:
        _or:
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - person_id
          - _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      limit: 100
update_permissions:
  - role: user
    permission:
      columns: []
      filter: *can_edit_person
      check: *can_edit_person
delete_permissions:
  - role: user
    permission:
      filter: *can_edit_person
