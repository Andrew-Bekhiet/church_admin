table:
  name: persons_services
  schema: public
object_relationships:
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: service
    using:
      foreign_key_constraint_on: service_id
insert_permissions:
  - role: user
    permission:
      check:
        _or:
          - _or:
              - &person_by_person_id_editable
                _exists:
                  _table: &permissions_view
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - &requesting_user
                        uid:
                          _eq: X-Hasura-User-Id
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
              - &all_data_editable
                _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _and:
              - person:
                  insertedInCurrentTransaction:
                    _eq: true
              - &service_by_service_id_editable
                _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: service
                      - entity_id:
                          _ceq:
                            - $
                            - service_id
      columns:
        - person_id
        - service_id
select_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - service_id
      filter:
        _and:
          - _or:
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
              - &all_data_readable
                _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
          - _or:
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: service
                      - entity_id:
                          _ceq:
                            - $
                            - service_id
              - *all_data_readable
      limit: 100
update_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - service_id
      filter:
        _and:
          - _or:
              - *person_by_person_id_editable
              - *all_data_editable
          - _or:
              - *service_by_service_id_editable
              - *all_data_editable
      check:
        _and:
          - _or:
              - *person_by_person_id_editable
              - *all_data_editable
          - _or:
              - *service_by_service_id_editable
              - *all_data_editable
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _or:
              - *person_by_person_id_editable
              - *all_data_editable
          - _or:
              - *service_by_service_id_editable
              - *all_data_editable
