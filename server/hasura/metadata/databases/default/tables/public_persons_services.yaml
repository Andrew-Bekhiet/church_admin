table:
  name: persons_services
  schema: public
object_relationships:
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: service
    using:
      foreign_key_constraint_on: service_id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - person_id
        - service_id
select_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - service_id
      filter:
        _and:
          - person:
              isUserAllowedToRead:
                _eq: true
          - service:
              isUserAllowedToRead:
                _eq: true
      limit: 60
update_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - service_id
      filter:
        _and:
          - person:
              isUserAllowedToWrite:
                _eq: true
          - service:
              isUserAllowedToWrite:
                _eq: true
      check:
        _and:
          - person:
              isUserAllowedToWrite:
                _eq: true
          - service:
              isUserAllowedToWrite:
                _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - person:
              isUserAllowedToWrite:
                _eq: true
          - service:
              isUserAllowedToWrite:
                _eq: true
