table:
  name: persons_tags
  schema: public
object_relationships:
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - person_id
        - tag_id
select_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - tag_id
      filter:
        _and:
          - person:
              isUserAllowedToRead:
                _eq: true
      limit: 100
update_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - tag_id
      filter:
        _and:
          - person:
              isUserAllowedToWrite:
                _eq: true
      check:
        _and:
          - person:
              isUserAllowedToWrite:
                _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - person:
              isUserAllowedToWrite:
                _eq: true
