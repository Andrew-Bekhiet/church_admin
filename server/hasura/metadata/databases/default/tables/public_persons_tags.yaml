table:
  name: persons_tags
  schema: public
object_relationships:
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - person_id
        - tag_id
select_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - tag_id
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      limit: 100
update_permissions:
  - role: user
    permission:
      columns: []
      filter: {}
      check: {}
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: person
                      - entity_id:
                          _ceq:
                            - $
                            - person_id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
