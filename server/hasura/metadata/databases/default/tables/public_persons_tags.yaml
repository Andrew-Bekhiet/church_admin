table:
  name: persons_tags
  schema: public
object_relationships:
  - name: person
    using:
      foreign_key_constraint_on: person_id
  - name: tag
    using:
      foreign_key_constraint_on: tag_id
insert_permissions:
  - role: user
    permission:
      check: &can_edit_person
        _or:
          - _exists:
              _table: &person_permissions_view
                name: users_permissions_on_person
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - person_id
          - _exists:
              _table: &any_permissions_view
                name: users_permissions_on_any
                schema: auth
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      columns:
        - person_id
        - tag_id
select_permissions:
  - role: user
    permission:
      columns:
        - person_id
        - tag_id
      filter:
        _or:
          - _exists:
              _table: *person_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: person
                  - entity_id:
                      _ceq:
                        - $
                        - person_id
          - _exists:
              _table: *any_permissions_view
              _where:
                _and:
                  - *requesting_user
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      limit: 100
update_permissions:
  - role: user
    permission:
      columns: []
      filter: *can_edit_person
      check: *can_edit_person
delete_permissions:
  - role: user
    permission:
      filter: *can_edit_person
