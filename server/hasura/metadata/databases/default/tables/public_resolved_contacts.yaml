table:
  name: resolved_contacts
  schema: public
object_relationships:
  - name: person
    using:
      manual_configuration:
        column_mapping:
          person_id: id
        insertion_order: null
        remote_table:
          name: persons
          schema: public
  - name: personType
    using:
      manual_configuration:
        column_mapping:
          effective_person_type_id: id
        insertion_order: null
        remote_table:
          name: person_types
          schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - created_at
        - effective_family_id
        - effective_person_type_id
        - family_id
        - id
        - is_main_phone
        - label
        - person_id
        - person_type_id
        - phone
        - updated_at
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: person
                          - entity_id:
                              _ceq:
                                - $
                                - person_id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
          - _and:
              - personType:
                  is_family_admin:
                    _eq: true
              - _exists:
                  _table:
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - uid:
                          _eq: X-Hasura-User-Id
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - effective_family_id
