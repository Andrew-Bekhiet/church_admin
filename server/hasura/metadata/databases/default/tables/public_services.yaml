table:
  name: services
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: nextService
    using:
      foreign_key_constraint_on: next_service_id
  - name: studyYearFrom
    using:
      foreign_key_constraint_on: study_year_from_id
  - name: studyYearTo
    using:
      foreign_key_constraint_on: study_year_to_id
array_relationships:
  - name: adminUsers
    using:
      manual_configuration:
        column_mapping:
          id: admin_on_service
        insertion_order: null
        remote_table:
          name: users_admin_on
          schema: auth
  - name: attendanceDaysConstraints
    using:
      manual_configuration:
        column_mapping:
          id: service_id
        insertion_order: null
        remote_table:
          name: attendance_days_constraints
          schema: history
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: attendance_history
          schema: history
  - name: classes
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: classes
          schema: public
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: groups
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: groups
          schema: public
  - name: persons
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: persons_services
          schema: public
computed_fields:
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_service
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_service
        schema: public
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - isUserAllowedToWrite:
              _eq: true
      columns:
        - color
        - name
        - next_service_id
        - study_year_from_id
        - study_year_to_id
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
        - next_service_id
        - photo_updated_at
        - blurhash
        - study_year_from_id
        - study_year_to_id
      filter:
        isUserAllowedToRead:
          _eq: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
        - next_service_id
        - study_year_from_id
        - study_year_to_id
      filter:
        _and:
          - isUserAllowedToWrite:
              _eq: true
      check:
        _and:
          - isUserAllowedToWrite:
              _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - isUserAllowedToWrite:
              _eq: true
