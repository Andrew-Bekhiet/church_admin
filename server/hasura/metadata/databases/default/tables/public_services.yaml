table:
  name: services
  schema: public
object_relationships:
  - name: defaultMeeting
    using:
      foreign_key_constraint_on: default_meeting_id
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: nextService
    using:
      foreign_key_constraint_on: next_service_id
  - name: studyYearFrom
    using:
      foreign_key_constraint_on: study_year_from_id
  - name: studyYearTo
    using:
      foreign_key_constraint_on: study_year_to_id
array_relationships:
  - name: adminUsers
    using:
      manual_configuration:
        column_mapping:
          id: admin_on_service
        insertion_order: null
        remote_table:
          name: users_admin_on
          schema: auth
  - name: classes
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: classes
          schema: public
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
  - name: groups
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: groups
          schema: public
  - name: meetings
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: meetings
          schema: history
  - name: persons
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: persons_services
          schema: public
computed_fields:
  - name: userCanEdit
    definition:
      function:
        name: user_can_edit_service
        schema: auth
      session_argument: hasura_session
    comment: ""
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: writeAllData
      columns:
        - color
        - name
        - next_service_id
        - study_year_from_id
        - study_year_to_id
        - default_meeting_id
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
        - next_service_id
        - default_meeting_id
        - photo_updated_at
        - blurhash
        - study_year_from_id
        - study_year_to_id
      computed_fields:
        - userCanEdit
      filter:
        deleted_at:
          _is_null: true
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
        - next_service_id
        - default_meeting_id
        - study_year_from_id
        - study_year_to_id
      filter:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: service
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      check:
        _or:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: service
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
