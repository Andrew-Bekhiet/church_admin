table:
  name: services
  schema: public
object_relationships:
  - name: fromStudyYear
    using:
      foreign_key_constraint_on: study_year_from
  - name: nextServiceObject
    using:
      foreign_key_constraint_on: next_service
  - name: toStudyYear
    using:
      foreign_key_constraint_on: study_year_to
array_relationships:
  - name: attendanceDaysConstraints
    using:
      manual_configuration:
        column_mapping:
          id: service_id
        insertion_order: null
        remote_table:
          name: attendance_days_constraints
          schema: history
  - name: attendanceHistory
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: attendance_history
          schema: history
  - name: classes
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: classes
          schema: public
  - name: groups
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: groups
          schema: public
  - name: persons
    using:
      foreign_key_constraint_on:
        column: service_id
        table:
          name: persons_services
          schema: public
  - name: users
    using:
      foreign_key_constraint_on:
        column: admin_on_service
        table:
          name: users_admin_on
          schema: auth
computed_fields:
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_service
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_service
        schema: public
      session_argument: hasura_session
  - name: lastEdit
    definition:
      function:
        name: get_service_last_edit
        schema: history
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - isUserAllowedToWrite:
              _eq: true
      columns:
        - color
        - name
        - next_service
        - study_year_from
        - study_year_to
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
        - next_service
        - photo_updated_at
        - study_year_from
        - study_year_to
      computed_fields:
        - lastEdit
      filter:
        isUserAllowedToRead:
          _eq: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
        - next_service
        - study_year_from
        - study_year_to
      filter:
        _and:
          - isUserAllowedToWrite:
              _eq: true
      check:
        _and:
          - isUserAllowedToWrite:
              _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - isUserAllowedToWrite:
              _eq: true
