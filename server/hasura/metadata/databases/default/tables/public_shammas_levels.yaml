table:
  name: shammas_levels
  schema: public
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
        - order
      filter: {}
update_permissions:
  - role: user
    permission:
      columns: []
      filter: &approved_user
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
      check: null
delete_permissions:
  - role: user
    permission:
      filter: *approved_user
