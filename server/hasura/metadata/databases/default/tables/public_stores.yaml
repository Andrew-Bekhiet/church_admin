table:
  name: stores
  schema: public
object_relationships:
  - name: address
    using:
      foreign_key_constraint_on:
        column: store_id
        table:
          name: addresses
          schema: public
  - name: family
    using:
      foreign_key_constraint_on: admin_family
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
array_relationships:
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - address_text
        - admin_family
        - color
        - geolocation
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - address_text
        - admin_family
        - blurhash
        - color
        - geolocation
        - id
        - name
        - photo_updated_at
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: store
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      limit: 100
update_permissions:
  - role: user
    permission:
      columns:
        - address_text
        - admin_family
        - color
        - geolocation
        - name
      filter:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: store
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      check:
        _exists:
          _table:
            name: users_permissions_by_entity_id
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - allow_edit:
                  _eq: true
              - _or:
                  - _and:
                      - entity_type:
                          _eq: store
                      - entity_id:
                          _ceq:
                            - $
                            - id
                  - _and:
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: store
                          - entity_id:
                              _ceq:
                                - $
                                - id
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
          - _exists:
              _table:
                name: users_permissions_by_entity_id
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - _or:
                      - _and:
                          - entity_type:
                              _eq: family
                          - entity_id:
                              _ceq:
                                - $
                                - admin_family
                      - _and:
                          - entity_type:
                              _eq: any
                          - entity_id:
                              _is_null: true
