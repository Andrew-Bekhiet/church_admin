table:
  name: stores
  schema: public
object_relationships:
  - name: family
    using:
      foreign_key_constraint_on: admin_family
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
array_relationships:
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
computed_fields:
  - name: areas
    definition:
      function:
        name: store_areas
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_store
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_store
        schema: public
      session_argument: hasura_session
  - name: streets
    definition:
      function:
        name: store_streets
        schema: public
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        _and:
          - isUserAllowedToWrite:
              _eq: true
          - _or:
              - admin_family:
                  _eq: null
              - family:
                  isUserAllowedToWrite:
                    _eq: true
      columns:
        - address
        - admin_family
        - color
        - geolocation
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - address
        - admin_family
        - blurhash
        - color
        - geolocation
        - id
        - name
        - photo_updated_at
      filter:
        _and:
          - isUserAllowedToRead:
              _eq: true
      limit: 100
update_permissions:
  - role: user
    permission:
      columns:
        - address
        - admin_family
        - color
        - geolocation
        - name
      filter:
        _and:
          - isUserAllowedToWrite:
              _eq: true
      check:
        _and:
          - isUserAllowedToWrite:
              _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - isUserAllowedToWrite:
              _eq: true
          - family:
              isUserAllowedToWrite:
                _eq: true
