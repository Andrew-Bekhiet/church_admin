table:
  name: stores
  schema: public
object_relationships:
  - name: address
    using:
      foreign_key_constraint_on:
        column: store_id
        table:
          name: addresses
          schema: public
  - name: family
    using:
      foreign_key_constraint_on: admin_family
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
array_relationships:
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
computed_fields:
  - name: userCanEdit
    definition:
      function:
        name: user_can_edit_store
        schema: auth
      session_argument: hasura_session
    comment: ""
insert_permissions:
  - role: user
    permission:
      check: {}
      columns:
        - admin_family
        - color
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - admin_family
        - blurhash
        - color
        - id
        - name
        - photo_updated_at
      computed_fields:
        - userCanEdit
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _or:
              - _exists:
                  _table: &permissions_view
                    name: users_permissions_by_entity_id
                    schema: auth
                  _where:
                    _and:
                      - &requesting_user
                        uid:
                          _eq: X-Hasura-User-Id
                      - entity_type:
                          _eq: store
                      - entity_id:
                          _ceq:
                            - $
                            - id
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - entity_type:
                          _eq: any
                      - entity_id:
                          _is_null: true
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - admin_family
        - color
        - name
      filter:
        _or:
          - &store_by_id_editable
            _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: store
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - &all_data_editable
            _exists:
              _table: *permissions_view
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      check:
        _or:
          - *store_by_id_editable
          - *all_data_editable
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
          - _or:
              - *store_by_id_editable
              - *all_data_editable
          - _or:
              - _exists:
                  _table: *permissions_view
                  _where:
                    _and:
                      - *requesting_user
                      - allow_edit:
                          _eq: true
                      - entity_type:
                          _eq: family
                      - entity_id:
                          _ceq:
                            - $
                            - admin_family
              - *all_data_editable
