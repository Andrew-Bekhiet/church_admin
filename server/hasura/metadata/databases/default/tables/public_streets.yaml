table:
  name: streets
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
  - name: lastVisit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_visits
          schema: history
array_relationships:
  - name: addresses
    using:
      foreign_key_constraint_on:
        column: street_id
        table:
          name: addresses
          schema: public
  - name: areas
    using:
      foreign_key_constraint_on:
        column: street_id
        table:
          name: areas_streets
          schema: public
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
computed_fields:
  - name: userCanEdit
    definition:
      function:
        name: user_can_edit_street
        schema: auth
      session_argument: hasura_session
    comment: ""
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: writeAllData
      columns:
        - color
        - line
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - blurhash
        - color
        - id
        - line
        - name
        - photo_updated_at
      computed_fields:
        - userCanEdit
      filter:
        deleted_at:
          _is_null: true
      allow_aggregations: true
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - line
        - name
      filter:
        _or:
          - &street_by_id_editable
            _exists:
              _table:
                name: users_permissions_on_street
                schema: auth
              _where:
                _and:
                  - &requesting_user
                    uid:
                      _eq: X-Hasura-User-Id
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: street
                  - entity_id:
                      _ceq:
                        - $
                        - id
          - &all_data_editable
            _exists:
              _table:
                name: users_permissions_on_any
                schema: auth
              _where:
                _and:
                  - *requesting_user
                  - allow_edit:
                      _eq: true
                  - entity_type:
                      _eq: any
                  - entity_id:
                      _is_null: true
      check:
        _or:
          - *street_by_id_editable
          - *all_data_editable
delete_permissions:
  - role: user
    permission:
      filter:
        _and:
          - deleted_at:
              _is_null: true
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: writeAllData
          - _exists:
              _table:
                name: users_permissions
                schema: auth
              _where:
                _and:
                  - uid:
                      _eq: X-Hasura-User-Id
                  - permission:
                      _eq: deleteData
