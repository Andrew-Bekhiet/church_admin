table:
  name: streets
  schema: public
object_relationships:
  - name: lastEdit
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: latest_edits
          schema: history
array_relationships:
  - name: editHistory
    using:
      manual_configuration:
        column_mapping:
          id: record_id
        insertion_order: null
        remote_table:
          name: edit_history
          schema: history
computed_fields:
  - name: areas
    definition:
      function:
        name: street_areas
        schema: public
      session_argument: hasura_session
  - name: families
    definition:
      function:
        name: street_families
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToRead
    definition:
      function:
        name: user_allowed_to_read_street
        schema: public
      session_argument: hasura_session
  - name: isUserAllowedToWrite
    definition:
      function:
        name: user_allowed_to_write_street
        schema: public
      session_argument: hasura_session
  - name: persons
    definition:
      function:
        name: street_persons
        schema: public
      session_argument: hasura_session
  - name: stores
    definition:
      function:
        name: street_stores
        schema: public
      session_argument: hasura_session
insert_permissions:
  - role: user
    permission:
      check:
        isUserAllowedToWrite:
          _eq: true
      columns:
        - color
        - line
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - blurhash
        - color
        - id
        - line
        - name
        - photo_updated_at
      filter:
        isUserAllowedToRead:
          _eq: true
      limit: 200
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - line
        - name
      filter:
        isUserAllowedToWrite:
          _eq: true
      check:
        isUserAllowedToWrite:
          _eq: true
delete_permissions:
  - role: user
    permission:
      filter:
        isUserAllowedToWrite:
          _eq: true
