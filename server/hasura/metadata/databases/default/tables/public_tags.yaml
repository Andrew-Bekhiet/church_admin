table:
  name: tags
  schema: public
array_relationships:
  - name: persons
    using:
      foreign_key_constraint_on:
        column: tag_id
        table:
          name: persons_tags
          schema: public
insert_permissions:
  - role: user
    permission:
      check: &approved_user
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
      columns:
        - color
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - color
        - id
        - name
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - color
        - name
      filter: *approved_user
      check: *approved_user
delete_permissions:
  - role: user
    permission:
      filter: *approved_user
