table:
  name: universities
  schema: public
array_relationships:
  - name: colleges
    using:
      foreign_key_constraint_on:
        column: university_id
        table:
          name: colleges
          schema: public
insert_permissions:
  - role: user
    permission:
      check:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
      columns:
        - name
select_permissions:
  - role: user
    permission:
      columns:
        - id
        - name
      filter: {}
update_permissions:
  - role: user
    permission:
      columns:
        - name
      filter:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
      check: null
delete_permissions:
  - role: user
    permission:
      filter:
        _exists:
          _table:
            name: users_permissions
            schema: auth
          _where:
            _and:
              - uid:
                  _eq: X-Hasura-User-Id
              - permission:
                  _eq: approved
