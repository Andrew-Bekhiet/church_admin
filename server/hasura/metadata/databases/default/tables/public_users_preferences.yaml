table:
  name: users_preferences
  schema: public
object_relationships:
  - name: user
    using:
      foreign_key_constraint_on: uid
select_permissions:
  - role: user
    permission:
      columns:
        - uid
        - order_by_preferences
        - dark_theme
        - great_feast_theme
        - last_home_mode
        - updated_at
      filter:
        uid:
          _eq: X-Hasura-User-Id
update_permissions:
  - role: user
    permission:
      columns:
        - order_by_preferences
        - dark_theme
        - great_feast_theme
        - last_home_mode
      filter:
        uid:
          _eq: X-Hasura-User-Id
      check:
        uid:
          _eq: X-Hasura-User-Id
